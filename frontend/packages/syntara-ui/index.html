<!doctype html>
<!-- Default classes limit FOUC before the inline script runs. The script below matches resolveColorScheme in colorScheme.ts and resolveContrastMode in contrastMode.ts. -->
<html lang="en" class="pf-v6-theme-dark pf-v6-theme-glass">
  <head>
    <meta charset="UTF-8" />
    <!-- HTML cannot import TS. Storage key literals must match COLOR_SCHEME_STORAGE_KEY and CONTRAST_MODE_STORAGE_KEY. -->
    <script>
      ;(function () {
        function mediaMatches(query) {
          try {
            return window.matchMedia(query).matches
          } catch {
            return false
          }
        }
        function stored(key) {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        var scheme = stored('syntara-ui-color-scheme')
        var resolvedScheme = 'dark'
        if (scheme === 'light' || scheme === 'dark') {
          resolvedScheme = scheme
        } else if (mediaMatches('(prefers-color-scheme: light)')) {
          resolvedScheme = 'light'
        } else if (mediaMatches('(prefers-color-scheme: dark)')) {
          resolvedScheme = 'dark'
        }
        document.documentElement.classList.toggle('pf-v6-theme-dark', resolvedScheme === 'dark')

        var contrast = stored('syntara-ui-contrast-mode')
        var resolvedContrast = 'glass'
        if (contrast === 'default' || contrast === 'high-contrast' || contrast === 'glass') {
          resolvedContrast = contrast
        } else if (mediaMatches('(prefers-contrast: more)') || mediaMatches('(forced-colors: active)')) {
          resolvedContrast = 'high-contrast'
        } else if (mediaMatches('(prefers-reduced-transparency: reduce)')) {
          resolvedContrast = 'default'
        }
        document.documentElement.classList.toggle('pf-v6-theme-high-contrast', resolvedContrast === 'high-contrast')
        document.documentElement.classList.toggle('pf-v6-theme-glass', resolvedContrast === 'glass')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/assets/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syntara</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
