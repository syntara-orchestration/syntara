---
schema_version: '2.0.0'
name: mcp-tool-call
description: Invokes a named tool on an MCP server integration

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          path:
            type: string
            description: Directory to inspect
            default: /var/log

nodes:
  - id: list_directory
    name: List Directory
    type: mcp_tool
    parameters:
      integration_id: 11111111-1111-4111-8111-111111111111
      tool_name: list_directory
      arguments:
        path: ${trigger.path}
      timeout_seconds: 30

  - id: summarize
    name: Summarize Result
    type: script
    parameters:
      language: bash
      code: echo "Tool returned ${list_directory.result}"

edges:
  - from: trigger_manual
    to: list_directory
  - from: list_directory
    to: summarize
