---
schema_version: '2.0.0'
name: basic-sequence-test
description: Test basic sequence activity type - executes steps in order

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: step1
    name: First Step
    type: script
    parameters:
      language: bash
      code: |
        echo "Step 1: Starting"
        sleep 1
        echo "Step 1: Complete"

  - id: step2
    name: Second Step
    type: script
    parameters:
      language: bash
      code: |
        echo "Step 2: Starting"
        sleep 1
        echo "Step 2: Complete"

  - id: step3
    name: Third Step
    type: script
    parameters:
      language: bash
      code: |
        echo "Step 3: Starting"
        sleep 1
        echo "Step 3: Complete"
edges:
  - from: step1
    to: step2
  - from: step2
    to: step3
