---
schema_version: '2.0.0'
name: permission-check-routing
description: Routes on whether the previous step was allowed to run for this execution

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: restart_service
    name: Restart Service
    type: http_request
    parameters:
      method: POST
      url: https://api.example.com/services/restart

  - id: was_restart_allowed
    name: Was restart allowed
    type: permission_check

  - id: notify_success
    name: Notify Success
    type: script
    parameters:
      language: bash
      code: echo "Service restarted"

  - id: notify_denied
    name: Notify Denied
    type: script
    parameters:
      language: bash
      code: echo "Restart was not permitted for this run"

edges:
  - from: trigger_manual
    to: restart_service
  - from: restart_service
    to: was_restart_allowed
  - from: was_restart_allowed
    to: notify_success
    port: allowed
  - from: was_restart_allowed
    to: notify_denied
    port: denied
