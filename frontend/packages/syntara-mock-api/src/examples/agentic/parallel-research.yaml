---
schema_version: "2.0.0"
name: parallel-research
description: Parallel agentic tasks for comprehensive research
metadata:
  tags:
    - agentic
    - parallel
    - research
triggers:
  - id: trigger_manual
    type: manual_trigger

inputs:
  topic:
    type: string
    description: Topic for parallel comprehensive research
    default: cloud computing platforms

nodes:
  - id: parallel_research_fork
    type: fork

  - id: technical_research
    type: agentic
    parameters:
      agent: production://technical-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Research the technical aspects of: ${input.topic}

        Focus on:
        - Technical architecture and implementation
        - Performance characteristics
        - Technical challenges and solutions
    inputs:
      topic: ${inputs.topic}
    outputs:
      technical_findings: $.result.content

  - id: market_research
    type: agentic
    parameters:
      agent: production://market-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Research the market aspects of: ${input.topic}

        Focus on:
        - Market size and growth
        - Key competitors and market share
        - Market trends and opportunities
    inputs:
      topic: ${inputs.topic}
    outputs:
      market_findings: $.result.content

  - id: regulatory_research
    type: agentic
    parameters:
      agent: production://compliance-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Research the regulatory and compliance aspects of: ${input.topic}

        Focus on:
        - Relevant regulations and standards
        - Compliance requirements
        - Legal considerations
    inputs:
      topic: ${inputs.topic}
    outputs:
      regulatory_findings: $.result.content

  - id: parallel_research_join
    type: join

  - id: synthesize_findings
    type: agentic
    parameters:
      agent: production://synthesis-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Synthesize the following research findings into a comprehensive report:

        Technical: ${technical_research.output.technical_findings}
        Market: ${market_research.output.market_findings}
        Regulatory: ${regulatory_research.output.regulatory_findings}

        Provide:
        - Executive summary
        - Key takeaways from each domain
        - Cross-domain insights
        - Overall recommendations
    inputs:
      technical: ${technical_research.output.technical_findings}
      market: ${market_research.output.market_findings}
      regulatory: ${regulatory_research.output.regulatory_findings}
    outputs:
      final_report: $.result.report
      executive_summary: $.result.executive_summary
edges:
  - source: parallel_research_fork
    target: technical_research
  - source: parallel_research_fork
    target: market_research
  - source: parallel_research_fork
    target: regulatory_research
  - source: technical_research
    target: parallel_research_join
  - source: market_research
    target: parallel_research_join
  - source: regulatory_research
    target: parallel_research_join
  - source: parallel_research_join
    target: synthesize_findings
