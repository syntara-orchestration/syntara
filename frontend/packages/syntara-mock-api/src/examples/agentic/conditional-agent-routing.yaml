---
schema_version: "2.0.0"
name: conditional-agent-routing
description: Route to different specialized agents based on conditions
metadata:
  tags:
    - agentic
    - conditional
    - routing
triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          user_request:
            type: string
            description: User request to be classified and routed to appropriate specialist
            default: How do I optimize database query performance?

nodes:
  - id: classify_request
    name: Classify User Request
    type: agentic
    parameters:
      agent: production://classifier-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Classify the following request and determine the appropriate domain:
        ${trigger.user_request}

        Domains:
        - technical: Technical questions, coding, architecture
        - business: Business strategy, market analysis, planning
        - creative: Content creation, design, marketing

        Respond with ONLY one word: technical, business, or creative

  - id: route_to_specialist
    name: Route to Specialist
    type: condition
    condition: ${classify_request.output.result.content} == 'technical'

  - id: technical_specialist
    name: Technical Specialist
    type: agentic
    parameters:
      agent: production://technical-specialist
      model: claude-3-5-sonnet-20241022
      prompt: |
        Provide technical assistance for: ${trigger.user_request}

  - id: check_business
    name: Check if Business Domain
    type: condition
    condition: ${classify_request.output.result.content} == 'business'

  - id: business_specialist
    name: Business Specialist
    type: agentic
    parameters:
      agent: production://business-specialist
      model: claude-3-5-sonnet-20241022
      prompt: |
        Provide business guidance for: ${trigger.user_request}

  - id: creative_specialist
    name: Creative Specialist
    type: agentic
    parameters:
      agent: production://creative-specialist
      model: claude-3-5-sonnet-20241022
      prompt: |
        Provide creative assistance for: ${trigger.user_request}
edges:
  - from: classify_request
    to: route_to_specialist
  - from: route_to_specialist
    to: technical_specialist
    port: then
  - from: route_to_specialist
    to: check_business
    port: else
  - from: check_business
    to: business_specialist
    port: then
  - from: check_business
    to: creative_specialist
    port: else
