---
schema_version: "2.0.0"
name: simple-research
description: Simple agentic workflow that performs web research
metadata:
  tags:
    - agentic
    - research
    - demo
triggers:
  - id: trigger_manual
    type: manual_trigger

inputs:
  research_topic:
    type: string
    description: Topic to research
    default: artificial intelligence

nodes:
  - id: research_topic
    type: agentic
    parameters:
      agent: production://research-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Research the following topic and provide a comprehensive summary: ${input.topic}

        Include:
        1. Key facts and statistics
        2. Recent developments (if applicable)
        3. Relevant context
    inputs:
      topic: ${inputs.research_topic}
    outputs:
      summary: $.result.content
edges: []
