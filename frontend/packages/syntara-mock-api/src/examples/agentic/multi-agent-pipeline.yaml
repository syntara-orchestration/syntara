---
schema_version: '2.0.0'
name: multi-agent-pipeline
description: Sequential agentic tasks with different specialized agents
metadata:
  tags:
    - agentic
    - multi-agent
    - pipeline
triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          topic:
            type: string
            description: Topic for research and analysis pipeline
            default: emerging technology trends

nodes:
  - id: research_phase
    type: agentic
    parameters:
      agent: production://research-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Research the topic: ${trigger.topic}

        Focus on:
        - Current state and recent developments
        - Key players and stakeholders
        - Important statistics and data points

  - id: analysis_phase
    type: agentic
    parameters:
      agent: production://analysis-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Analyze the following research data and identify key insights:

        ${research_phase.output.data}

        Provide:
        - Trend analysis
        - Risk assessment
        - Opportunity identification

  - id: recommendation_phase
    type: agentic
    parameters:
      agent: production://strategy-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Based on the analysis, provide strategic recommendations:

        Insights: ${analysis_phase.output}
        Trends: ${analysis_phase.output}
        Risks: ${analysis_phase.output}

        Provide:
        - Top 3 strategic recommendations
        - Implementation roadmap
        - Success metrics
edges:
  - from: research_phase
    to: analysis_phase
  - from: analysis_phase
    to: recommendation_phase
