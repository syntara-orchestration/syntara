---
schema_version: '2.0.0'
name: hybrid-workflow
description: Workflow combining script tasks and agentic tasks
metadata:
  tags:
    - agentic
    - hybrid
    - demo
triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: prepare_data
    type: script
    parameters:
      language: bash
      code: |
        echo "Preparing data for analysis..."
        echo '{"status": "ready", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'
    outputs:
      status: $.stdout

  - id: analyze_with_ai
    type: agentic
    parameters:
      agent: production://analysis-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Analyze the provided data and generate insights.

        Data status: ${prepare_data.output.status}

        Provide:
        1. Key trends and patterns
        2. Statistical summary
        3. Recommendations
    inputs:
      data_status: ${prepare_data.output.status}
    outputs:
      analysis: $.result.content

  - id: generate_report
    type: script
    parameters:
      language: bash
      code: |
        echo "=== Analysis Report ==="
        echo "Generated: $(date)"
        echo ""
        echo "Analysis: $INPUT_ANALYSIS"
    inputs:
      analysis: ${analyze_with_ai.output.analysis}
    outputs:
      report: $.stdout
edges:
  - source: prepare_data
    target: analyze_with_ai
  - source: analyze_with_ai
    target: generate_report
