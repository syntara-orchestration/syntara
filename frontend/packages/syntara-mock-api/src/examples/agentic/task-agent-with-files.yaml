---
schema_version: '2.0.0'
name: task-agent-file-context-demo
description: Task Agent workflow with context files and tool selection for testing file upload UI
metadata:
  tags:
    - agentic
    - files
    - demo
triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: analyze_docs
    type: agentic
    name: Analyze Documents
    parameters:
      agent: production://doc-analyst
      model: anthropic/claude-haiku-4.5
      prompt: |
        Analyze the attached context files and provide a summary of:
        1. Key topics covered
        2. Action items found
        3. Any security concerns mentioned
      credential_id: cred-001
      tool_selection_strategy: ALL
      file_ids:
        - 'a1b2c3d4-0001-0001-0001-000000000001'
        - 'a1b2c3d4-0001-0001-0001-000000000002'
        - 'a1b2c3d4-0001-0001-0001-000000000003'

  - id: generate_report
    type: script
    name: Generate Report
    parameters:
      language: python
      environment:
        INPUT_ANALYSIS: ${analyze_docs.output}
      code: |
        import json
        import os

        analysis = json.loads(os.getenv("INPUT_ANALYSIS", "[]"))
        print(f"Report generated from {len(analysis)} documents")

edges:
  - from: trigger_manual
    to: analyze_docs
  - from: analyze_docs
    to: generate_report
