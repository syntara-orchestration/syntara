---
schema_version: "2.0.0"
name: sequential-mixed-types
description: Sequential workflow with bash to python to api activities

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: bash_step
    type: script
    parameters:
      language: bash
      code: |
        echo '{"data": "from bash"}'

  - id: python_step
    type: script
    parameters:
      language: python
      code: |
        import json
        import os

        bash_data = os.getenv('INPUT_BASH_DATA', 'none')
        result = {"processed": bash_data, "by": "python"}
        print(json.dumps(result))

  - id: api_step
    type: http_request
    parameters:
      method: POST
      url: http://test-api.example.com/api/create
      body:
        data: ${python_step.output.processed}
edges:
  - source: bash_step
    to: python_step
  - source: python_step
    to: api_step
