---
schema_version: '2.0.0'
name: loop-mixed-types
description: Loop execution with alternating executor types

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          items:
            type: array
            description: Items to process
            default: [item1, item2, item3]

nodes:
  - id: process_items
    type: loop
    loop:
      type: forEach
      items: ${trigger.items}
      itemVariable: item
      indexVariable: index

  - id: process_item
    type: script
    parameters:
      language: python
      environment:
        INPUT_ITEM: ${loop.item}
        INPUT_INDEX: ${loop.index}
      code: |
        import os
        item = os.getenv('INPUT_ITEM', '')
        index = os.getenv('INPUT_INDEX', '0')
        print(f"Processing item {item} at index {index}")
edges:
  - from: process_items
    to: process_item
    port: body
