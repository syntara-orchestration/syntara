---
schema_version: '2.0.0'
name: conditional-test
description: Test conditional branching with positive/negative/zero values
triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      inputs:
        number:
          type: integer
          description: Number to check (positive, negative, or zero)
          default: 10
nodes:
  - id: check_value
    name: Check Value
    type: script
    parameters:
      language: bash
      code: |
        echo "Value is: $INPUT_VALUE"
        echo "{\"value\": $INPUT_VALUE}"
    inputs:
      value: ${trigger.number}
    outputs:
      result: $.stdout

  - id: positive_branch
    name: Positive Branch
    type: script
    condition: ${trigger.number} > 0
    parameters:
      language: bash
      code: |
        echo "Value is positive"

  - id: negative_branch
    name: Negative Branch
    type: script
    condition: ${trigger.number} < 0
    parameters:
      language: bash
      code: |
        echo "Value is negative"

  - id: zero_branch
    name: Zero Branch
    type: script
    condition: ${trigger.number} == 0
    parameters:
      language: bash
      code: |
        echo "Value is zero"
edges:
  - from: trigger_manual
    to: check_value
  - from: check_value
    to: positive_branch
  - from: positive_branch
    to: negative_branch
  - from: negative_branch
    to: zero_branch
