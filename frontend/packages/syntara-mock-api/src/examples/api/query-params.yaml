---
schema_version: "2.0.0"
name: query-params
description: Test query parameter construction

inputs:
  filter:
    type: string
    description: Filter parameter
    default: active
  limit:
    type: number
    description: Limit parameter
    default: 10

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: query_test
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/data
      query_params:
        filter: ${input.filter}
        limit: ${input.limit}
        sort: name
    inputs:
      filter: ${inputs.filter}
      limit: ${inputs.limit}
edges: []
