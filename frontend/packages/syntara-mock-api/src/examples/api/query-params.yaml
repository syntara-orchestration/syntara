---
schema_version: '2.0.0'
name: query-params
description: Test query parameter construction

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          filter:
            type: string
            description: Filter parameter
            default: active
          limit:
            type: number
            description: Limit parameter
            default: 10

nodes:
  - id: query_test
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/data
      query_params:
        filter: ${trigger.filter}
        limit: ${trigger.limit}
        sort: name
edges: []
