---
schema_version: '2.0.0'
name: authenticated-request
description: API request with Authorization header from inputs

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          apiToken:
            type: string
            description: API authentication token
            default: Bearer test-token-123

nodes:
  - id: authenticated_fetch
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/auth
      headers:
        Authorization: ${trigger.apiToken}
edges: []
