---
schema_version: "2.0.0"
name: post-with-body
description: HTTP POST request with JSON body and headers

inputs:
  data:
    type: object
    description: Data to post
    default:
      name: Test Resource
      value: 123

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: create_resource
    type: http_request
    parameters:
      method: POST
      url: http://test-api.example.com/api/create
      headers:
        Content-Type: application/json
        X-Custom-Header: test-value
      body: ${input.data}
    inputs:
      data: ${inputs.data}
edges: []
