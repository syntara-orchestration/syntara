---
schema_version: '2.0.0'
name: headers-resolution
description: Test header resolution from inputs and variables

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          customHeader:
            type: string
            description: Custom header value
            default: custom-value
          apiKey:
            type: string
            description: API key for authentication
            default: api-key-123

nodes:
  - id: headers_test
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/data
      headers:
        X-Custom-Header: ${trigger.customHeader}
        X-API-Key: ${trigger.apiKey}
        X-Static-Header: static-value
edges: []
