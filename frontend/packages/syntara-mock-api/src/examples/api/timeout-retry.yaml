---
schema_version: '2.0.0'
name: timeout-retry
description: API request with timeout and exponential backoff retry

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: slow_endpoint
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/slow
    timeout: 2
    retry_policy:
      maxAttempts: 3
      backoff: exponential
      initialInterval: 1
      maxInterval: 10
      multiplier: 2.0
edges: []
