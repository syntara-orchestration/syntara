---
schema_version: '2.0.0'
name: join-post-activities-test
description: Test join with activities that execute after join completes
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: parallel_work
    type: parallel

  - id: fetch_data_a
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data A"
        sleep 0.1
        echo '{"source": "A", "count": 10}'
    outputs:
      data: $.stdout

  - id: fetch_data_b
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data B"
        sleep 0.3
        echo '{"source": "B", "count": 20}'
    outputs:
      data: $.stdout

  - id: fetch_data_c
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data C"
        sleep 0.1
        echo '{"source": "C", "count": 30}'
    outputs:
      data: $.stdout

  - id: aggregate_data
    type: converge
    parameters:
      branches:
        - fetch_data_a
        - fetch_data_b
        - fetch_data_c
      strategy: all
      aggregateOutputs: true

  - id: process_aggregated_data
    name: Process Aggregated Data
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing aggregated data from all sources"
        echo "All parallel tasks have completed"
        echo "Total sources: 3"
    outputs:
      result: $.stdout

  - id: send_notification
    name: Send Completion Notification
    type: script
    parameters:
      language: bash
      code: |
        echo "Notification: All data fetching and aggregation complete"
        echo "Ready for next stage"
    outputs:
      status: $.stdout
edges:
  - from: trigger_manual
    to: parallel_work
  - from: parallel_work
    to: fetch_data_a
    from_port: branch
  - from: parallel_work
    to: fetch_data_b
    from_port: branch
  - from: parallel_work
    to: fetch_data_c
    from_port: branch
  - from: parallel_work
    to: aggregate_data
  - from: aggregate_data
    to: process_aggregated_data
  - from: process_aggregated_data
    to: send_notification
