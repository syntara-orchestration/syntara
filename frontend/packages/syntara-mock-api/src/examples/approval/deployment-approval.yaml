---
schema_version: '2.0.0'
name: deployment-approval
description: Demonstrates an approval gate before deploying to production

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          environment:
            type: string
            description: Target deployment environment
            default: production
          version:
            type: string
            description: Application version to deploy
            default: 3.2.0

nodes:
  - id: staging_tests
    name: Staging Tests
    type: script
    parameters:
      language: bash
      environment:
        INPUT_VERSION: ${trigger.version}
      code: |
        echo "Running staging tests for v${INPUT_VERSION}"
        echo "Tests passed: 42"
        echo "Tests failed: 0"
        echo "Coverage: 94.5%"

  - id: approval_gate
    name: Production Deployment Approval
    type: approval
    parameters:
      approvers:
        - ops-team@example.com
      prompt: 'Review the staging test results and approve deployment of v${trigger.version} to ${trigger.environment}.'
      fallback_decision: reject
      decision_window: 86400

  - id: deploy_to_prod
    name: Deploy to Production
    type: script
    parameters:
      language: bash
      environment:
        INPUT_VERSION: ${trigger.version}
        INPUT_ENV: ${trigger.environment}
      code: |
        echo "Deploying v${INPUT_VERSION} to ${INPUT_ENV}"
        echo "Deployment successful!"

  - id: rollback_staging
    name: Rollback Staging
    type: script
    parameters:
      language: bash
      code: |
        echo "Approval rejected — rolling back staging environment"

edges:
  - from: staging_tests
    to: approval_gate
  - from: approval_gate
    to: deploy_to_prod
    port: approved
  - from: approval_gate
    to: rollback_staging
    port: rejected
