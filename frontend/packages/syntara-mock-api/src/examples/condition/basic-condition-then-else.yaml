---
schema_version: '2.0.0'
name: basic-condition-test
description: Test condition activity type with then/else branches

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          age:
            type: integer
            description: Person's age
            default: 25

nodes:
  - id: age_check
    name: Check Age
    type: condition
    condition: ${trigger.age} >= 18

  - id: adult_message
    name: Adult Message
    type: script
    parameters:
      language: bash
      code: |
        echo "You are an adult (age >= 18)"
        echo "Access granted"

  - id: minor_message
    name: Minor Message
    type: script
    parameters:
      language: bash
      code: |
        echo "You are a minor (age < 18)"
        echo "Access denied"
edges:
  - from: age_check
    to: adult_message
    port: then
  - from: age_check
    to: minor_message
    port: else
