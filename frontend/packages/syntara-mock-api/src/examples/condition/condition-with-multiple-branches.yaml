---
schema_version: '2.0.0'
name: multi-branch-condition-test
description: Test condition with multiple activities in then/else branches

inputs:
  score:
    type: integer
    description: Test score
    default: 75

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: score_evaluation
    name: Evaluate Score
    type: condition
    condition: ${input.score} >= 60

  - id: pass_notification
    name: Pass Notification
    type: script
    parameters:
      language: bash
      code: |
        echo "Congratulations! You passed the test."
    outputs:
      result: $.stdout

  - id: certificate
    name: Generate Certificate
    type: script
    parameters:
      language: bash
      code: |
        echo "Certificate generated"
        echo "Grade: PASS"
    outputs:
      cert: $.stdout

  - id: fail_notification
    name: Fail Notification
    type: script
    parameters:
      language: bash
      code: |
        echo "Sorry, you did not pass the test."
    outputs:
      result: $.stdout

  - id: retry_info
    name: Retry Information
    type: script
    parameters:
      language: bash
      code: |
        echo "You can retake the test after 30 days"
        echo "Study materials: /path/to/materials"
    outputs:
      info: $.stdout
edges:
  - source: score_evaluation
    target: pass_notification
    port: then
  - source: pass_notification
    target: certificate
  - source: score_evaluation
    target: fail_notification
    port: else
  - source: fail_notification
    target: retry_info
