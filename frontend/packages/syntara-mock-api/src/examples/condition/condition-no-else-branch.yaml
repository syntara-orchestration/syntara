---
schema_version: '2.0.0'
name: condition-no-else-test
description: Test condition with only then branch (no else)

inputs:
  enable_feature:
    type: boolean
    description: Whether to enable the feature
    default: true

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: feature_check
    name: Check Feature Flag
    type: condition
    condition: ${input.enable_feature}

  - id: enable_feature
    name: Enable Feature
    type: script
    parameters:
      language: bash
      code: |
        echo "Feature enabled"
        echo "Initializing feature..."
    outputs:
      status: $.stdout
edges:
  - source: feature_check
    target: enable_feature
    port: then
