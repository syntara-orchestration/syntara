---
schema_version: '2.0.0'
name: condition-no-else-test
description: Test condition with only then branch (no else)

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          enable_feature:
            type: boolean
            description: Whether to enable the feature
            default: true

nodes:
  - id: feature_check
    name: Check Feature Flag
    type: condition
    condition: ${trigger.enable_feature}

  - id: enable_feature
    name: Enable Feature
    type: script
    parameters:
      language: bash
      code: |
        echo "Feature enabled"
        echo "Initializing feature..."
edges:
  - from: feature_check
    to: enable_feature
    port: then
