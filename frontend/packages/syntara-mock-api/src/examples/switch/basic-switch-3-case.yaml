---
schema_version: '2.0.0'
name: basic-switch-3-case-test
description: Test switch node with 3 cases routing to different downstream actions

inputs:
  status:
    type: string
    description: Request status
    default: approved

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: route_status
    name: Route by Status
    type: switch
    parameters:
      cases:
        - port: case_0
          label: Approved
          condition: "${trigger.status} == 'approved'"
        - port: case_1
          label: Rejected
          condition: "${trigger.status} == 'rejected'"
        - port: case_2
          label: Escalated
          condition: "${trigger.status} == 'escalated'"
      default_port: default

  - id: handle_approved
    name: Handle Approved
    type: script
    parameters:
      language: bash
      code: echo "Request approved"

  - id: handle_rejected
    name: Handle Rejected
    type: script
    parameters:
      language: bash
      code: echo "Request rejected"

  - id: handle_escalated
    name: Handle Escalated
    type: script
    parameters:
      language: bash
      code: echo "Request escalated"

  - id: handle_unknown
    name: Handle Unknown
    type: script
    parameters:
      language: bash
      code: echo "Unknown status"

edges:
  - from: route_status
    to: handle_approved
    from_port: case_0
  - from: route_status
    to: handle_rejected
    from_port: case_1
  - from: route_status
    to: handle_escalated
    from_port: case_2
  - from: route_status
    to: handle_unknown
    from_port: default
