---
schema_version: "2.0.0"
name: error-propagation-test
description: Test error propagation

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: first_task
    name: First Task
    type: script
    parameters:
      language: bash
      code: |
        echo "First task successful"
        echo '{"status": "ok"}'

  - id: second_task
    name: Second Task
    type: script
    parameters:
      language: bash
      code: |
        echo "Second task fails"
        exit 1

  - id: third_task
    name: Third Task
    type: script
    parameters:
      language: bash
      code: |
        echo "This should not execute if second task fails"
edges:
  - source: first_task
    target: second_task
  - source: second_task
    target: third_task
