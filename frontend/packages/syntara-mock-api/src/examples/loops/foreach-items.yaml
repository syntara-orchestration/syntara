---
schema_version: "2.0.0"
name: foreach-loop-test
description: Test forEach loop with bash

inputs:
  item_list:
    type: array
    description: List of items to process
    default: [apple, banana, cherry]

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: process_items
    name: Process Items
    type: loop
    loop:
      type: forEach
      items: ${trigger.item_list}
      itemVariable: item

  - id: process_item
    name: Process Item
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing item: $INPUT_ITEM"
        echo "Item value: $INPUT_ITEM"
    inputs:
      item: ${item}
    outputs:
      processed: $.stdout
edges:
  - source: process_items
    target: process_item
    port: body
