---
schema_version: "2.0.0"
name: while-loop-basic-test
description: Test while loop with condition and maxIterations

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: initialize_counter
    name: Initialize Counter
    type: script
    parameters:
      language: bash
      code: |
        echo '{"counter": 0}'
    outputs:
      data: $.stdout

  - id: while_loop
    name: While Loop
    type: loop
    loop:
      type: while
      condition: ${initialize_counter.output.data.counter} < 5
      maxIterations: 10

  - id: loop_task
    type: script
    parameters:
      language: bash
      code: |
        echo "Loop iteration executed"
    outputs:
      result: $.stdout
edges:
  - source: initialize_counter
    target: while_loop
  - source: while_loop
    target: loop_task
    port: body
