---
schema_version: '2.0.0'
name: while-loop-basic-test
description: Test while loop with condition and maxIterations

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: initialize_counter
    name: Initialize Counter
    type: script
    parameters:
      language: python
      code: |
        import json
        print(json.dumps({"counter": 0}))

  - id: while_loop
    name: While Loop
    type: loop
    loop:
      type: while
      condition: ${initialize_counter.stdout_json.counter} < 5
      maxIterations: 10

  - id: loop_task
    type: script
    parameters:
      language: bash
      code: |
        echo "Loop iteration executed"
edges:
  - from: initialize_counter
    to: while_loop
  - from: while_loop
    to: loop_task
    port: body
