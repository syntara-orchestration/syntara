---
schema_version: "2.0.0"
name: while-loop-basic-test
description: Test while loop with condition and maxIterations

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: initialize_counter
    name: Initialize Counter
    type: script
    parameters:
      language: bash
      code: |
        echo '{"counter": 0}'

  - id: while_loop
    name: While Loop
    type: loop
    loop:
      type: while
      condition: ${initialize_counter.output.data.counter} < 5
      maxIterations: 10

  - id: loop_task
    type: script
    parameters:
      language: bash
      code: |
        echo "Loop iteration executed"
edges:
  - source: initialize_counter
    to: while_loop
  - source: while_loop
    to: loop_task
    port: body
