---
schema_version: '2.0.0'
name: count-loop-index-test
description: Test count loop with custom indexVariable
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: count_with_index
    name: Count Loop with Index Variable
    type: loop
    parameters:
      type: count
      count: 3
      indexVariable: iteration_num

  - id: indexed_task
    type: script
    parameters:
      language: bash
      code: |
        echo "Iteration number: ${INPUT_ITERATION_NUM}"
    inputs:
      iteration_num: ${iteration_num}
    outputs:
      result: $.stdout
edges:
  - from: trigger_manual
    to: count_with_index
  - from: count_with_index
    to: indexed_task
    from_port: iterate
