---
schema_version: '2.0.0'
name: count-loop-basic-test
description: Test count loop with fixed number of iterations
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: count_loop
    name: Count Loop
    type: loop
    parameters:
      type: count
      count: 5
      indexVariable: idx

  - id: count_task
    type: script
    parameters:
      language: bash
      code: |
        echo "Count loop iteration"
    outputs:
      result: $.stdout
edges:
  - from: trigger_manual
    to: count_loop
  - from: count_loop
    to: count_task
    from_port: iterate
