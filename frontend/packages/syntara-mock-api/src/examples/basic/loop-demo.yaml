---
schema_version: '2.0.0'
name: loop-demo
description: Demonstrates forEach loop
triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          items:
            type: array
            description: List of items to process
            default: [apple, banana, cherry]
nodes:
  - id: process_items
    type: loop
    loop:
      type: forEach
      items: ${trigger.items}
      itemVariable: item
      indexVariable: idx

  - id: process_item
    type: script
    parameters:
      language: bash
      environment:
        INPUT_ITEM: ${loop.item}
        INPUT_INDEX: ${loop.index}
      code: |
        echo "Processing item #$INPUT_INDEX: $INPUT_ITEM"

  - id: summary
    type: script
    parameters:
      language: bash
      code: |
        echo "All items processed!"
edges:
  - from: process_items
    to: process_item
    port: body
  - from: process_items
    to: summary
