---
schema_version: "2.0.0"
name: loop-demo
description: Demonstrates forEach loop
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: process_items
    type: loop
    loop:
      type: forEach
      items: ${trigger.items}
      itemVariable: item
      indexVariable: idx

  - id: process_item
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing item #$INPUT_INDEX: $INPUT_ITEM"

  - id: summary
    type: script
    parameters:
      language: bash
      code: |
        echo "All items processed!"
edges:
  - source: process_items
    to: process_item
    port: body
  - source: process_items
    to: summary
