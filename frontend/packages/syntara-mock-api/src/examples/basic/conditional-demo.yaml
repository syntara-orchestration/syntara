---
schema_version: "2.0.0"
name: conditional-demo
description: Demonstrates conditional branching based on temperature input

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          temperature:
            type: number
            description: Temperature in Celsius
            default: 25

nodes:
  - id: check_temperature
    name: Check Temperature
    type: script
    parameters:
      language: bash
      environment:
        INPUT_TEMP: ${trigger.temperature}
      code: |
        echo "Current temperature: ${INPUT_TEMP}°C"
        echo "Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "$INPUT_TEMP"

  - id: temperature_routing
    name: Temperature-Based Routing
    type: condition
    condition: ${trigger.temperature} > 30

  - id: hot_weather
    name: Hot Weather Action
    type: script
    parameters:
      language: bash
      code: |
        echo "🌡️  Hot weather detected!"
        echo "Recommended actions:"
        echo "  - Turn on air conditioning"
        echo "  - Stay hydrated"
        echo "  - Avoid outdoor activities during peak hours"

  - id: check_cold
    name: Check for Cold Weather
    type: condition
    condition: ${trigger.temperature} < 15

  - id: cold_weather
    name: Cold Weather Action
    type: script
    parameters:
      language: bash
      code: |
        echo "❄️  Cold weather detected!"
        echo "Recommended actions:"
        echo "  - Turn on heating"
        echo "  - Dress warmly"
        echo "  - Check for frost warnings"

  - id: mild_weather
    name: Mild Weather Action
    type: script
    parameters:
      language: bash
      environment:
        INPUT_TEMP: ${trigger.temperature}
      code: |
        echo "☀️  Pleasant weather conditions!"
        echo "Temperature is just right: ${INPUT_TEMP}°C"
        echo "  - Enjoy outdoor activities"
        echo "  - No special precautions needed"

  - id: summary
    name: "Generate Weather Summary Report (${trigger.temperature})"
    type: script
    parameters:
      language: bash
      environment:
        INPUT_TEMP: ${trigger.temperature}
      code: |
        echo ""
        echo "=== Weather Check Complete ==="
        echo "Temperature assessed: ${INPUT_TEMP}°C"
        echo ""
        echo "Conditional activities executed based on temperature:"
        echo "  • Hot weather (>30°C): Shows AC recommendations"
        echo "  • Cold weather (<15°C): Shows heating recommendations"
        echo "  • Mild weather (15-30°C): Shows pleasant weather message"
        echo "=============================="
edges:
  - from: check_temperature
    to: temperature_routing
  - from: temperature_routing
    to: hot_weather
    port: then
  - from: temperature_routing
    to: check_cold
    port: else
  - from: check_cold
    to: cold_weather
    port: then
  - from: check_cold
    to: mild_weather
    port: else
  - from: temperature_routing
    to: summary
