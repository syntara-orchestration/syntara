---
schema_version: "2.0.0"
name: parallel-demo
description: Demonstrates parallel execution
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: parallel_tasks_fork
    type: fork

  - id: task1
    type: script
    parameters:
      language: bash
      code: |
        echo "Task 1 starting..."
        sleep 1
        echo "Task 1 complete!"

  - id: task2
    type: script
    parameters:
      language: bash
      code: |
        echo "Task 2 starting..."
        sleep 1
        echo "Task 2 complete!"

  - id: task3
    type: script
    parameters:
      language: bash
      code: |
        echo "Task 3 starting..."
        sleep 1
        echo "Task 3 complete!"

  - id: parallel_tasks_join
    type: join

  - id: summary
    type: script
    parameters:
      language: bash
      code: |
        echo "All parallel tasks completed!"
edges:
  - from: parallel_tasks_fork
    to: task1
  - from: parallel_tasks_fork
    to: task2
  - from: parallel_tasks_fork
    to: task3
  - from: task1
    to: parallel_tasks_join
  - from: task2
    to: parallel_tasks_join
  - from: task3
    to: parallel_tasks_join
  - from: parallel_tasks_join
    to: summary
