---
schema_version: '2.0.0'
name: parallel-demo
description: Demonstrates parallel execution
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: parallel_tasks_fork
    type: fork

  - id: task1
    type: script
    parameters:
      language: bash
      code: |
        echo "Task 1 starting..."
        sleep 1
        echo "Task 1 complete!"

  - id: task2
    type: script
    parameters:
      language: bash
      code: |
        echo "Task 2 starting..."
        sleep 1
        echo "Task 2 complete!"

  - id: task3
    type: script
    parameters:
      language: bash
      code: |
        echo "Task 3 starting..."
        sleep 1
        echo "Task 3 complete!"

  - id: parallel_tasks_join
    type: join

  - id: summary
    type: script
    parameters:
      language: bash
      code: |
        echo "All parallel tasks completed!"
edges:
  - source: parallel_tasks_fork
    target: task1
  - source: parallel_tasks_fork
    target: task2
  - source: parallel_tasks_fork
    target: task3
  - source: task1
    target: parallel_tasks_join
  - source: task2
    target: parallel_tasks_join
  - source: task3
    target: parallel_tasks_join
  - source: parallel_tasks_join
    target: summary
