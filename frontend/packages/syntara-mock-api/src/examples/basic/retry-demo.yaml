---
schema_version: "2.0.0"
name: retry-demo
description: Demonstrates retry policies with exponential backoff

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          failure_rate:
            type: integer
            description: Percentage chance of failure (0-100)
            default: 70
            minimum: 0
            maximum: 100
          seed:
            type: integer
            description: |
              Random seed for deterministic testing (optional).
              When provided, ensures reproducible behavior in tests.
              Seed advances by attempt number (attempt 1=seed, attempt 2=seed+1, etc):
                - Seed 10: Produces [28, 39] = FAIL, SUCCESS (tests retry mechanism)
                - Seed 1707: Produces [20, 22, 29, 0, 3] = all failures (tests exhaustion)
              In production, omit this parameter to use true randomness.

nodes:
  - id: unreliable_service
    name: Simulate Unreliable Service
    type: script
    parameters:
      language: python
      environment:
        INPUT_FAILURE_RATE: ${trigger.failure_rate}
        INPUT_SEED: ${trigger.seed}
      code: |
        import json
        import os
        import random
        import sys

        failure_rate = int(os.environ.get("INPUT_FAILURE_RATE", "70"))
        seed_env = os.environ.get("INPUT_SEED", "")
        attempt_number = int(os.environ.get("INPUT_TEMPORAL_ATTEMPT", "1"))

        print(f"Attempt #{attempt_number}: Calling unreliable service...")
        print(f"Failure rate: {failure_rate}%")

        # Seed for deterministic testing; advance by attempt so each retry differs
        if seed_env:
            random.seed(int(seed_env) + attempt_number - 1)

        random_num = random.randint(0, 99)
        print(f"Random roll: {random_num} (need > {failure_rate} to succeed)")

        if random_num > failure_rate:
            print("Success! Service responded correctly")
            print(json.dumps({"status": "success", "attempt": attempt_number, "random": random_num}))
            sys.exit(0)
        else:
            print("Failed! Service error (will retry with backoff)", file=sys.stderr)
            print(json.dumps({"status": "failed", "attempt": attempt_number, "random": random_num}), file=sys.stderr)
            sys.exit(1)
    timeout: 10
    retry_policy:
      maxAttempts: 5
      backoff: exponential
      multiplier: 2.0
      initialInterval: 1
      maxInterval: 10

  - id: process_result
    name: Process Successful Result
    type: script
    parameters:
      language: bash
      environment:
        INPUT_STATUS: ${unreliable_service.stdout_json.status}
        INPUT_ATTEMPT: ${unreliable_service.stdout_json.attempt}
      code: |
        echo ""
        echo "=== Service Call Completed ==="
        echo "Final status: $INPUT_STATUS"
        echo "Succeeded after attempt: $INPUT_ATTEMPT"
        echo "============================="
        echo ""
        echo "Key learnings:"
        echo "  ✓ Retry policies help handle transient failures"
        echo "  ✓ Exponential backoff prevents overwhelming failing services"
        echo "  ✓ Timeouts prevent indefinite waiting"

  - id: fixed_backoff_example
    name: Fixed Backoff Example
    type: script
    parameters:
      language: bash
      code: |
        echo "This task uses fixed backoff (2 seconds between retries)"
        echo "If it fails, it will retry after exactly 2s, then 2s again"
        echo ""
        echo "Comparing backoff strategies:"
        echo "  - Fixed: Same interval every time (2s, 2s, 2s)"
        echo "  - Exponential: Increasing intervals (1s, 2s, 4s, 8s)"
        echo "  - Linear: Linear increase (1s, 2s, 3s, 4s)"
    timeout: 5
    retry_policy:
      maxAttempts: 3
      backoff: fixed
      initialInterval: 2

  - id: summary
    name: Retry Summary
    type: script
    parameters:
      language: bash
      code: |
        echo ""
        echo "=== Retry Demo Complete ==="
        echo ""
        echo "This workflow demonstrated:"
        echo "  1. Exponential backoff retry policy (1s → 2s → 4s → 8s)"
        echo "  2. Maximum retry attempts (5)"
        echo "  3. Activity timeouts (10s)"
        echo "  4. Fixed backoff as alternative strategy"
        echo ""
        echo "Retry policies are essential for:"
        echo "  • Handling transient network failures"
        echo "  • Dealing with rate-limited APIs"
        echo "  • Managing unreliable external services"
        echo "  • Improving workflow resilience"
        echo ""
        echo "Try running with different failure rates:"
        echo "  --inputs '{\"failure_rate\": 30}'  (easier to succeed)"
        echo "  --inputs '{\"failure_rate\": 90}'  (harder to succeed)"
edges:
  - from: unreliable_service
    to: process_result
  - from: process_result
    to: fixed_backoff_example
  - from: fixed_backoff_example
    to: summary
