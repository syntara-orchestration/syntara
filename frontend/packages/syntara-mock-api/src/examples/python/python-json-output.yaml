---
schema_version: '2.0.0'
name: python-json-output
description: Python script that outputs structured JSON data

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: json_producer
    type: script
    parameters:
      language: python
      code: |
        import json

        data = {
            "data": {
                "items": [1, 2, 3],
                "count": 3,
                "message": "JSON output from Python"
            },
            "result": "success"
        }

        print(json.dumps(data))
    outputs:
      data: $.output.data
      result: $.output.result
edges: []
