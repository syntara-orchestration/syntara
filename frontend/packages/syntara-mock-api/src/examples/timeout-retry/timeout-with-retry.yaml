---
schema_version: '2.0.0'
name: timeout-retry-test
description: Test timeout and retry combination

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: task_with_both
    name: Task With Timeout and Retry
    type: script
    parameters:
      language: bash
      code: |
        echo "Executing task"
        sleep 1
        echo "Complete"
    timeout: 5
    retry_policy:
      maxAttempts: 2
      backoff: fixed
      initialInterval: 1
edges: []
