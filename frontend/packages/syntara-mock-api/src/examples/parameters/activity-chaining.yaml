---
schema_version: "2.0.0"
name: parameter-mapping-test
description: Test parameter mapping between activities

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_data
    name: Fetch Data
    type: script
    parameters:
      language: bash
      code: |
        echo '{"user_id": "123", "name": "John Doe", "age": 30}'
    outputs:
      user_data: $.stdout

  - id: process_data
    name: Process Data
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing user: $INPUT_NAME (ID: $INPUT_USER_ID)"
        echo '{"processed": true, "user_id": "'"$INPUT_USER_ID"'"}'
    inputs:
      user_id: ${fetch_data.output.user_data.user_id}
      name: ${fetch_data.output.user_data.name}
    outputs:
      result: $.stdout

  - id: finalize
    name: Finalize
    type: script
    parameters:
      language: bash
      code: |
        echo "Finalization complete for processed=$INPUT_PROCESSED"
    inputs:
      processed: ${process_data.output.result.processed}
edges:
  - source: fetch_data
    target: process_data
  - source: process_data
    target: finalize
