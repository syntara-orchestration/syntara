---
schema_version: '2.0.0'
name: parameter-mapping-test
description: Test parameter mapping between activities

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_data
    name: Fetch Data
    type: script
    parameters:
      language: python
      code: |
        import json
        print(json.dumps({"user_id": "123", "name": "John Doe", "age": 30}))

  - id: process_data
    name: Process Data
    type: script
    parameters:
      language: python
      environment:
        INPUT_USER_ID: ${fetch_data.stdout_json.user_id}
        INPUT_NAME: ${fetch_data.stdout_json.name}
      code: |
        import json
        import os

        name = os.getenv("INPUT_NAME", "")
        user_id = os.getenv("INPUT_USER_ID", "")
        print(f"Processing user: {name} (ID: {user_id})")
        print(json.dumps({"processed": True, "user_id": user_id}))

  - id: finalize
    name: Finalize
    type: script
    parameters:
      language: bash
      environment:
        INPUT_PROCESSED: ${process_data.stdout_json.processed}
      code: |
        echo "Finalization complete for processed=$INPUT_PROCESSED"
edges:
  - from: fetch_data
    to: process_data
  - from: process_data
    to: finalize
