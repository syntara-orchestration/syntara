---
schema_version: "2.0.0"
name: expression-test
description: Test input parameter expressions

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: source
    name: Source Activity
    type: script
    parameters:
      language: bash
      code: |
        echo '{"count": 42, "status": "active"}'

  - id: consumer
    name: Consumer Activity
    type: script
    parameters:
      language: bash
      code: |
        echo "Count: $INPUT_COUNT, Status: $INPUT_STATUS"
edges:
  - source: source
    to: consumer
