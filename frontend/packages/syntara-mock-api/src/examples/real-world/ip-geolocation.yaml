---
schema_version: "2.0.0"
name: ip-geolocation
description: Fetch IP geolocation data and generate location report
metadata:
  tags:
    - real-world
    - api
    - geolocation
  owner: demo-team

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          ip_address:
            type: string
            description: IP address to lookup (leave empty for your current IP)
            default: 8.8.8.8

nodes:
  - id: fetch_location
    name: Fetch IP Geolocation
    type: http_request
    parameters:
      method: GET
      url: http://ip-api.com/json/${trigger.ip_address}
      headers:
        Accept: application/json
    timeout: 30

  - id: generate_report
    name: Generate Location Report
    type: script
    parameters:
      language: bash
      environment:
        INPUT_IP: ${trigger.ip_address}
        INPUT_COUNTRY: ${fetch_location.body.country}
        INPUT_CITY: ${fetch_location.body.city}
        INPUT_REGION: ${fetch_location.body.regionName}
        INPUT_LATITUDE: ${fetch_location.body.lat}
        INPUT_LONGITUDE: ${fetch_location.body.lon}
        INPUT_TIMEZONE: ${fetch_location.body.timezone}
        INPUT_ISP: ${fetch_location.body.isp}
      code: |
        #!/bin/bash

        # Get environment variables
        IP="$INPUT_IP"
        COUNTRY="$INPUT_COUNTRY"
        CITY="$INPUT_CITY"
        REGION="$INPUT_REGION"
        LAT="$INPUT_LATITUDE"
        LON="$INPUT_LONGITUDE"
        TIMEZONE="$INPUT_TIMEZONE"
        ISP="$INPUT_ISP"

        # Generate report
        cat <<EOF
        {
          "report_title": "IP Geolocation Report",
          "ip_address": "$IP",
          "location": {
            "country": "$COUNTRY",
            "region": "$REGION",
            "city": "$CITY",
            "coordinates": {
              "latitude": $LAT,
              "longitude": $LON
            }
          },
          "network": {
            "isp": "$ISP",
            "timezone": "$TIMEZONE"
          },
          "summary": "IP $IP is located in $CITY, $REGION, $COUNTRY (ISP: $ISP)"
        }
        EOF
    timeout: 60
edges:
  - from: fetch_location
    to: generate_report
