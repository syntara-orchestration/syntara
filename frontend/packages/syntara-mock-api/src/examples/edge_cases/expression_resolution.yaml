---
schema_version: "2.0.0"
name: expression-resolution-test
description: Test expression resolution with multiple placeholders and nested paths

inputs:
  firstName:
    type: string
    default: John
  lastName:
    type: string
    default: Doe

variables:
  config:
    timeout: 30
    retries: 3

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: test_multiple_placeholders
    name: Test Multiple Expression Placeholders
    type: script
    parameters:
      language: bash
      code: |
        echo "Greeting: $INPUT_GREETING"
    inputs:
      greeting: Hello, ${input.firstName} ${input.lastName}!
    outputs:
      result: $.stdout

  - id: test_variable_reference
    name: Test Variable Reference
    type: script
    parameters:
      language: bash
      code: |
        echo "Timeout: $INPUT_TIMEOUT_VALUE seconds"
    inputs:
      timeout_value: ${variables.config.timeout}
    outputs:
      result: $.stdout

  - id: test_activity_output_reference
    name: Test Activity Output Reference
    type: script
    parameters:
      language: bash
      code: |
        echo "Previous output was: $INPUT_PREVIOUS_RESULT"
    inputs:
      previous_result: ${test_multiple_placeholders.output.result}
    outputs:
      final: $.stdout
edges:
  - source: test_multiple_placeholders
    target: test_variable_reference
  - source: test_variable_reference
    target: test_activity_output_reference
