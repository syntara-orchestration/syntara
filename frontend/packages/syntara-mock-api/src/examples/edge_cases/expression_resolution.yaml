---
schema_version: '2.0.0'
name: expression-resolution-test
description: Test expression resolution with multiple placeholders and nested paths

triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          firstName:
            type: string
            default: John
          lastName:
            type: string
            default: Doe
          timeout:
            type: integer
            default: 30

nodes:
  - id: test_multiple_placeholders
    name: Test Multiple Expression Placeholders
    type: script
    parameters:
      language: bash
      environment:
        INPUT_GREETING: "Hello, ${trigger.firstName} ${trigger.lastName}!"
      code: |
        echo "Greeting: $INPUT_GREETING"

  - id: test_variable_reference
    name: Test Trigger Field Reference
    type: script
    parameters:
      language: bash
      environment:
        INPUT_TIMEOUT_VALUE: ${trigger.timeout}
      code: |
        echo "Timeout: $INPUT_TIMEOUT_VALUE seconds"

  - id: test_activity_output_reference
    name: Test Activity Output Reference
    type: script
    parameters:
      language: bash
      environment:
        INPUT_PREVIOUS_RESULT: ${test_multiple_placeholders.stdout}
      code: |
        echo "Previous output was: $INPUT_PREVIOUS_RESULT"
edges:
  - from: test_multiple_placeholders
    to: test_variable_reference
  - from: test_variable_reference
    to: test_activity_output_reference
