---
schema_version: '2.0.0'
name: output-mapping-json-test
description: Test output mapping with JSON parsing

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: generate_json
    name: Generate JSON Output
    type: script
    parameters:
      language: python
      code: |
        import json
        print(json.dumps({"user": "Alice", "age": 30, "active": True}))

  - id: use_parsed_data
    name: Use Parsed JSON Data
    type: script
    parameters:
      language: bash
      environment:
        INPUT_USER_NAME: ${generate_json.stdout_json.user}
        INPUT_USER_AGE: ${generate_json.stdout_json.age}
      code: |
        echo "User: $INPUT_USER_NAME, Age: $INPUT_USER_AGE"
edges:
  - from: generate_json
    to: use_parsed_data
