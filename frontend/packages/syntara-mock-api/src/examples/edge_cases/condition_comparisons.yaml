---
schema_version: '2.0.0'
name: condition-comparisons-test
description: Test condition evaluation with various comparison operators
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: test_numeric_greater_than
    name: Test Numeric Greater Than
    type: script
    parameters:
      language: bash
      code: |
        echo "10 is greater than 5"
    outputs:
      result: $.stdout

  - id: test_numeric_equality
    name: Test Numeric Equality
    type: script
    condition: 10 == 10
    parameters:
      language: bash
      code: |
        echo "Numbers are equal"
    outputs:
      result: $.stdout

  - id: test_string_inequality
    name: Test String Inequality
    type: script
    condition: "'test' != 'other'"
    parameters:
      language: bash
      code: |
        echo "Strings are not equal"
    outputs:
      result: $.stdout

  - id: test_numeric_less_than
    name: Test Numeric Less Than
    type: script
    condition: 3 < 5
    parameters:
      language: bash
      code: |
        echo "3 is less than 5"
    outputs:
      result: $.stdout

  - id: test_numeric_greater_equal
    name: Test Numeric Greater or Equal
    type: script
    condition: 5 >= 5
    parameters:
      language: bash
      code: |
        echo "5 is greater or equal to 5"
    outputs:
      result: $.stdout

  - id: test_numeric_less_equal
    name: Test Numeric Less or Equal
    type: script
    condition: 5 <= 10
    parameters:
      language: bash
      code: |
        echo "5 is less or equal to 10"
    outputs:
      result: $.stdout
edges:
  - from: trigger_manual
    to: test_numeric_greater_than
  - from: test_numeric_greater_than
    to: test_numeric_equality
  - from: test_numeric_equality
    to: test_string_inequality
  - from: test_string_inequality
    to: test_numeric_less_than
  - from: test_numeric_less_than
    to: test_numeric_greater_equal
  - from: test_numeric_greater_equal
    to: test_numeric_less_equal
