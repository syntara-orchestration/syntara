---
schema_version: '2.0.0'
name: converge-missing-branch-test
description: Test converge with a branch ID that doesn't exist
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: existing_task
    type: script
    parameters:
      language: bash
      code: echo "Existing task"

  - id: converge_missing
    type: converge
    converge:
      branches:
        - existing_task
        - nonexistent_task
      strategy: all
edges:
  - source: existing_task
    target: converge_missing
