---
schema_version: '2.0.0'
name: converge-post-activities-test
description: Test converge with activities that execute after converge completes

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: parallel_work_fork
    type: fork

  - id: fetch_data_a
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data A"
        sleep 0.1
        echo '{"source": "A", "count": 10}'
    outputs:
      data: $.stdout

  - id: fetch_data_b
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data B"
        sleep 0.3
        echo '{"source": "B", "count": 20}'
    outputs:
      data: $.stdout

  - id: fetch_data_c
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data C"
        sleep 0.1
        echo '{"source": "C", "count": 30}'
    outputs:
      data: $.stdout

  - id: parallel_work_join
    type: join

  - id: aggregate_data
    type: converge
    converge:
      branches:
        - fetch_data_a
        - fetch_data_b
        - fetch_data_c
      strategy: all
      aggregateOutputs: true

  - id: process_aggregated_data
    name: Process Aggregated Data
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing aggregated data from all sources"
        echo "All parallel tasks have completed"
        echo "Total sources: 3"
    outputs:
      result: $.stdout

  - id: send_notification
    name: Send Completion Notification
    type: script
    parameters:
      language: bash
      code: |
        echo "Notification: All data fetching and aggregation complete"
        echo "Ready for next stage"
    outputs:
      status: $.stdout
edges:
  - source: parallel_work_fork
    target: fetch_data_a
  - source: parallel_work_fork
    target: fetch_data_b
  - source: parallel_work_fork
    target: fetch_data_c
  - source: fetch_data_a
    target: parallel_work_join
  - source: fetch_data_b
    target: parallel_work_join
  - source: fetch_data_c
    target: parallel_work_join
  - source: parallel_work_join
    target: aggregate_data
  - source: aggregate_data
    target: process_aggregated_data
  - source: process_aggregated_data
    target: send_notification
