---
schema_version: '2.0.0'
name: converge-timeout-fail-test
description: Test converge with timeout that fails when timeout is reached

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: parallel_tasks_fork
    name: Parallel Tasks (fork)
    type: fork

  - id: fast_task
    name: Fast Task
    type: script
    parameters:
      language: bash
      code: |
        echo "Fast task completed"

  - id: slow_task
    name: Slow Task
    type: script
    parameters:
      language: bash
      code: |
        sleep 3
        echo "Slow task completed"

  - id: parallel_tasks_join
    type: join

  - id: converge_with_timeout
    name: Converge with Timeout (Fail)
    type: converge
    converge:
      branches:
        - fast_task
        - slow_task
      strategy: all
      timeout: 1
      onTimeout: fail
      aggregateOutputs: true
edges:
  - from: parallel_tasks_fork
    to: fast_task
  - from: parallel_tasks_fork
    to: slow_task
  - from: fast_task
    to: parallel_tasks_join
  - from: slow_task
    to: parallel_tasks_join
  - from: parallel_tasks_join
    to: converge_with_timeout
