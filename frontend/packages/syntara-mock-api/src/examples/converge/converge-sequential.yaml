---
schema_version: "2.0.0"
name: converge-sequential-test
description: Test converge after sequential activities complete
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: seq1
    type: script
    parameters:
      language: bash
      code: echo "Step 1"

  - id: seq2
    type: script
    parameters:
      language: bash
      code: echo "Step 2"

  - id: seq3
    type: script
    parameters:
      language: bash
      code: echo "Step 3"

  - id: converge_sequential
    type: converge
    converge:
      branches:
        - seq1
        - seq2
        - seq3
      strategy: all
edges:
  - from: seq1
    to: seq2
  - from: seq2
    to: seq3
  - from: seq3
    to: converge_sequential
