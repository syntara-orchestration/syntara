---
schema_version: "2.0.0"
name: converge-all-test
description: Test converge with all strategy - waits for all branches to complete
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: parallel_tasks_fork
    type: fork

  - id: task1
    type: script
    parameters:
      language: bash
      code: echo "Task 1 complete"

  - id: task2
    type: script
    parameters:
      language: bash
      code: echo "Task 2 complete"

  - id: task3
    type: script
    parameters:
      language: bash
      code: echo "Task 3 complete"

  - id: parallel_tasks_join
    type: join

  - id: converge_all
    type: converge
    converge:
      branches:
        - task1
        - task2
        - task3
      strategy: all
edges:
  - source: parallel_tasks_fork
    target: task1
  - source: parallel_tasks_fork
    target: task2
  - source: parallel_tasks_fork
    target: task3
  - source: task1
    target: parallel_tasks_join
  - source: task2
    target: parallel_tasks_join
  - source: task3
    target: parallel_tasks_join
  - source: parallel_tasks_join
    target: converge_all
