---
schema_version: "2.0.0"
name: converge-nested-parallel-test
description: Test converge with nested parallel execution
triggers:
  - id: trigger_manual
    type: manual_trigger
nodes:
  - id: group1_fork
    type: fork

  - id: branch1a
    type: script
    parameters:
      language: bash
      code: echo "Branch 1A"

  - id: branch1b
    type: script
    parameters:
      language: bash
      code: echo "Branch 1B"

  - id: group1_join
    type: join

  - id: group2_fork
    type: fork

  - id: branch2a
    type: script
    parameters:
      language: bash
      code: echo "Branch 2A"

  - id: branch2b
    type: script
    parameters:
      language: bash
      code: echo "Branch 2B"

  - id: group2_join
    type: join

  - id: converge_groups
    type: converge
    converge:
      branches:
        - branch1a
        - branch1b
        - branch2a
        - branch2b
      strategy: all
edges:
  - from: group1_fork
    to: branch1a
  - from: group1_fork
    to: branch1b
  - from: branch1a
    to: group1_join
  - from: branch1b
    to: group1_join
  - from: group1_join
    to: group2_fork
  - from: group2_fork
    to: branch2a
  - from: group2_fork
    to: branch2b
  - from: branch2a
    to: group2_join
  - from: branch2b
    to: group2_join
  - from: group2_join
    to: converge_groups
