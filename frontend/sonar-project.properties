# SonarCloud Configuration for Syntara UI

# Project identification
# sonar.projectKey and sonar.organization are set dynamically via CI.
# For local scans, pass: -Dsonar.projectKey=... -Dsonar.organization=...

# Report Quality Gate pass/fail in PR checks (informational, not blocking)
sonar.qualitygate.wait=true

# Source and test directories
sonar.sources=packages/syntara-ui/src
sonar.tests=packages/syntara-ui/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.*,**/*.testFixtures.ts,**/src/test/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.svg,**/*.ico,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot,**/*.mp4,**/*.webm,**/*.pdf
# WorkflowHistoryCard / VersionHistoryPanel / RunHistoryTableHead / ExecutionActivityTable: v8 emits large
# numbers of phantom JSX branches on the history layout and compact/sortable table headers;
# logic is covered via historyRowModel, versionHistoryHelpers, sortExecutionActivities, and
# RunHistoryTableHead / runHistoryTableColumns / ExecutionActivityTable unit tests instead.
# AgentTraceView / NodeExecutionDetailsPanel: Istanbul/v8 counts JSX ternary and
# short-circuit branches that are not meaningfully exercisable; logic is covered
# via agentTraceTypes, executionPolling, and component behavior tests instead.
# SimpleSchemaBuilder: v8 generates 99 branches for JSX prop objects, callbacks,
# and template literals in a 55-line component; 100% line coverage but only 53%
# branch coverage due to phantom branches. Covered by SimpleSchemaBuilder.test.tsx.
# CredentialDependencySection / CredentialAffectedResourcesWarnings: new ripple
# presentation components; 100% line coverage but v8 phantom JSX branches tank
# new-code branch coverage. Covered by dedicated unit tests. Existing delete/
# disable dialogs are not excluded.
# NodePanelNavigationArrow: NavTargetLabel IconLabel JSX ternary; v8 phantom
# branches tank new-code coverage; logic covered by NodePanelNavigationArrow.test.tsx.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.*,**/src/test/**,packages/syntara-ui/src/app/tanstackRouteTree.tsx,packages/syntara-ui/src/routes/builder/WorkflowHistoryCard.tsx,packages/syntara-ui/src/routes/builder/RunHistoryTableHead.tsx,packages/syntara-ui/src/routes/builder/ExecutionActivityTable.tsx,packages/syntara-ui/src/routes/builder/VersionHistoryPanel.tsx,packages/syntara-ui/src/routes/executions/AgentTraceView.tsx,packages/syntara-ui/src/routes/executions/NodeExecutionDetailsPanel.tsx,packages/syntara-ui/src/routes/builder/node-forms/SimpleSchemaBuilder.tsx,packages/syntara-ui/src/routes/configuration/credentials/CredentialDependencySection.tsx,packages/syntara-ui/src/routes/configuration/credentials/CredentialAffectedResourcesWarnings.tsx,packages/syntara-ui/src/routes/builder/panels/NodePanelNavigationArrow.tsx

# Language settings - Coverage report paths
sonar.javascript.lcov.reportPaths=packages/syntara-ui/coverage/lcov.info
sonar.typescript.lcov.reportPaths=packages/syntara-ui/coverage/lcov.info

# Duplication Detection Settings
# Exclude test files from duplication detection
# GroupFormModal and ProjectFormModal are intentionally parallel implementations
# of the same name+description modal pattern for different resources (group vs project).
# CheckAccessView and WhoCanView share the same form layout (resource type, action,
# project, resource ID) for two related access-query views (Can I? vs Who Can?).
# Their structural similarity is by design, not accidental duplication.
# app/routes/ files (TanStack Router route definitions) all use the same mandatory
# createRoute({ getParentRoute, path, component }) boilerplate — idiomatic, not accidental.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,\
  **/GroupFormModal.tsx,**/ProjectFormModal.tsx,\
  **/CheckAccessView.tsx,**/WhoCanView.tsx,\
  **/app/routes/**

# Increase minimum tokens for duplication detection (default is 100)
# Higher values = less sensitive to duplications
sonar.cpd.minimumTokens=200

# Alternative: Completely disable duplication detection
# Uncomment the following lines to completely ignore all duplication issues:
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=common-ts:DuplicatedBlocks
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
