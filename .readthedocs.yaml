---
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - git fetch origin $READTHEDOCS_GIT_IDENTIFIER
      - git checkout --force $READTHEDOCS_GIT_COMMIT_HASH

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: uv
      command: pip
      requirements: docs/requirements.txt
