---
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  submodules: false

exclude: ^\.tekton/

repos:
  # =========================================================================
  # Universal hooks (all files)
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^backend/src/syntara/schemas/openapi.*\.yaml$
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d # v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]

  # =========================================================================
  # Backend hooks (Python — scoped to backend/)
  # =========================================================================
  - repo: local
    hooks:
      - id: backend-ruff-format
        name: 'backend: ruff format'
        entry: make -C backend ruff
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: backend-pyrefly
        name: 'backend: pyrefly type checking'
        entry: make -C backend typecheck-pyrefly
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: backend-sync-requirements
        name: 'backend: sync requirements.txt with uv.lock'
        entry: make -C backend sync-requirements
        language: system
        pass_filenames: false
        files: ^backend/(uv\.lock|pyproject\.toml|requirements\.txt)$

  # =========================================================================
  # Frontend hooks (Node.js — scoped to frontend/)
  # =========================================================================
  - repo: local
    hooks:
      - id: frontend-prettier
        name: 'frontend: prettier format'
        entry: npx --prefix frontend prettier --write --
        language: system
        pass_filenames: true
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|yml|yaml|md|css)$

      - id: frontend-eslint
        name: 'frontend: eslint'
        # --flag v10_config_lookup_from_file makes ESLint resolve eslint.config.js
        # from each file's own directory rather than the cwd. Without it, running
        # ESLint from the repo root (as pre-commit does) would fail to find any
        # config because there is no root-level eslint.config.js — each package
        # owns its own config.
        entry: npx --prefix frontend eslint --flag v10_config_lookup_from_file --
        language: system
        pass_filenames: true
        # Type-aware linting (parserOptions.project) loads full TypeScript
        # programs per ESLint process. Without require_serial, pre-commit
        # fans file batches out to one process per CPU core, multiplying
        # that memory footprint until the machine OOMs on large changesets.
        require_serial: true
        files: ^frontend/packages/.*\.(ts|tsx|js|jsx)$

      - id: frontend-tsc
        name: 'frontend: typescript type check'
        entry: npm --prefix frontend run tsc
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

  # =========================================================================
  # YAML formatting (all YAML files except Tekton and rpms.lock.yaml)
  # =========================================================================
  - repo: https://github.com/google/yamlfmt
    rev: b5ca1890231d5e1e5181fef75a1be609d1e25029 # v0.21.0
    hooks:
      - id: yamlfmt
        exclude: ^backend/rpms\.lock\.yaml$
        args:
          - --formatter
          - include_document_start=true,retain_line_breaks=true,scan_folded_as_literal=true
