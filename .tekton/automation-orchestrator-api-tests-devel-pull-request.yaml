---
# Thin stub: the EP-enabled ao-api-tests pipeline, resolved via the Tekton
# git resolver from the unmerged aap-konflux-pipelines branch, which itself
# git-resolves the (also unmerged) tasks from
# goneri/promote-ep-e2e-staging-tasks. Tests the whole catalog promotion
# (aap-konflux-pipelines#4689) end to end before any bundle is published.
#
# Differences from the merged inline pipeline (syntara#1024):
# - the pipeline body, the EP staging/patch/prepare tasks, and deploy-ao all
#   come from the catalog branch instead of living here
# - deploy-ao's new ep-revision param replaces stage-ep-source and the
#   AO_EXECUTION_PLANE makefile sed
# Once aap-konflux-pipelines#4689 merges and publishes bundles, this stub
# flips to a digest-pinned pipelineRef and shrinks further.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: '{{source_url}}?rev={{revision}}'
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" &&
      (target_branch == "devel" || target_branch.startsWith("feature/") || target_branch.startsWith("feat/")) &&
      (files.all.exists(x, x.startsWith("backend/")) ||
      ".tekton/automation-orchestrator-api-tests-devel-pull-request.yaml".pathChanged())
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ansible-automation-orchestrator-devel
    appstudio.openshift.io/component: ansible-automation-orchestrator-backend-devel
    pipelines.appstudio.openshift.io/type: test
  name: automation-orchestrator-api-tests-devel-pull-request
  namespace: nexus-tenant
spec:
  timeouts:
    pipeline: "10h"
    tasks: "8h"
    finally: "2h"
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: pipeline-github-org
      value: '{{repo_owner}}'
    - name: pipeline-github-repo
      value: '{{repo_name}}'
    - name: pipeline-github-pr-revision
      value: '{{revision}}'
    - name: pipeline-github-pr-number
      value: '{{pull_request_number}}'
    # Deploy the operator-managed Execution Plane alongside AO
    - name: ep-revision
      value: devel
    # Temporary pins until the matching branches land (see the pipeline
    # descriptions): aap-dev must understand AO_EXECUTION_PLANE
    # (ansible/aap-dev#1111) and the prebuilt operator devel bundle ignores
    # ENABLE_EXECUTION_PLANE (automation-orchestrator-operator#1573).
    - name: aap-dev-revision
      value: AAP-90779-ep-from-source
    - name: ao-operator-revision
      value: AAP-90779-ep-from-source
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/ansible-automation-platform/aap-konflux-pipelines.git
      - name: revision
        value: goneri/ao-api-tests-ep-git-resolver
      - name: pathInRepo
        value: pipelines/test/ao-api-tests/0.1/pipeline.yaml
  taskRunTemplate:
    serviceAccountName: konflux-integration-runner
