[project]
name = "syntara-node-protocol"
version = "0.2.0"
requires-python = ">=3.12,<3.15"
dependencies = ["grpcio>=1.78.0,<2", "protobuf>=6.31.1,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_node_protocol"]
