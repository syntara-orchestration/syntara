[project]
name = "syntara-node-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["syntara-sdk", "syntara-node-protocol", "sqlmodel>=0.0.22", "structlog>=24.0", "httpx>=0.28", "jsonschema>=4.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_node_runtime"]
