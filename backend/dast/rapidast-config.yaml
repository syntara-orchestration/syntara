---
# RapidAST configuration for DAST scanning of the Syntara API.
#
# Targets the Syntara FastAPI backend via its runtime OpenAPI 3.1.0 spec.
# Designed to run inside the RapidAST container image with ZAP bundled.
#
# Usage (CI):
#   Automatically invoked by .github/workflows/dast.yml
#
# Usage (local, with Syntara running via podman-compose on localhost:8000):
#   uv run podman-compose -f ../podman-compose.yml up -d syntara
#   podman run --rm --network=host \
#     -v ./dast/rapidast-config.yaml:/opt/rapidast/config/config.yaml:z \
#     -v ./dast/results:/opt/rapidast/results:z \
#     quay.io/redhatproductsecurity/rapidast:latest \
#     --config /opt/rapidast/config/config.yaml
#
# RapidAST fetches /api_docs/v1/openapi.json (enabled by default via APP_ENABLE_API_DOCS).

config:
  configVersion: 6
  base_results_dir: "./results"

  googleCloudStorage:
    keyFile: "/opt/rapidast/gcs-key.json"
    bucketName: secaut-bucket
    directory: ansible/syntara

application:
  shortName: "syntara-api"
  url: "http://localhost:8000"

general:
  container:
    type: "none"

scanners:
  zap:
    apiScan:
      apis:
        apiUrl: "http://localhost:8000/api_docs/v1/openapi.json"

    passiveScan:
      disabledRules: "2,10015,10024,10027,10054,10096,10109,10112"

    # Uncomment once passive-only scans have run successfully and results are reviewed.
    # activeScan:
    #   policy: "API-scan-minimal"

    urls:
      excludes:
        - "^.*/auth/oidc/callback.*$"

    report:
      format: ["json", "sarif"]

    miscOptions:
      updateAddons: true
      additionalAddons: "ascanrulesBeta"
