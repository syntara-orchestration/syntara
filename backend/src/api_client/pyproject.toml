[project]
name = "syntara-api-client"
version = "1.2.0"
description = "A client library for accessing Orchestrator API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = []
dependencies = [
  "attrs>=22.2.0",
  "httpx>=0.23.0,<0.29.0",
  "python-dateutil>=2.8.0,<3",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.uv.build-backend]
module-name = "syntara_api_client"
module-root = ""
