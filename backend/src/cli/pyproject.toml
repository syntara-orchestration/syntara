[project]
name = "orchestrator-cli"
version = "0.1.0"
description = "Command-line client for the Automation Orchestrator API"
license = "Apache-2.0"
authors = []
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "syntara-api-client",
    "typer>=0.9.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
syntara-api-client = { path = "../api_client", editable = true }

[tool.uv.build-backend]
module-name = "orchestrator_cli"
module-root = ""

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
orchestrator = "orchestrator_cli:app"
