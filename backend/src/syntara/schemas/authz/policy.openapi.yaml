---
openapi: 3.1.0
info:
  title: Syntara Policies API
  version: 1.0.0
  description: |
    Policy management endpoints for the Syntara authorization system.

    Policies define fine-grained access control rules with allow/deny statements.
    Each statement specifies actions, scope, and optional conditions.
    Builtin policies cannot be modified or deleted.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Policies
    description: Policy CRUD operations

paths:
  /policies:
    post:
      summary: Create policy
      description: |-
        Create a custom policy. Requires: policy:create permission.
      operationId: create_policy
      x-app-permission:
        resource: policy
        action: create
      tags:
        - Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreate"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    get:
      summary: List policies
      description: List policies with filtering and pagination.
      operationId: list_policies
      x-app-permission:
        resource: null
        action: null
      tags:
        - Policies
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Name
          description: Filter by policy name
        - name: is_builtin
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            title: Is Builtin
          description: Filter by builtin status
        - name: project_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Project Id
          description: Filter by project scope
        - name: project_eligible
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            title: Project Eligible
        - in: query
          name: scope
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Scope
      responses:
        "200":
          description: Paginated list of policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /policies/{policy_id}:
    get:
      summary: Get policy
      description: Get a policy by ID.
      operationId: get_policy
      x-app-permission:
        resource: null
        action: null
      tags:
        - Policies
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Policy Id
      responses:
        "200":
          description: Policy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    patch:
      summary: Update policy
      description: |-
        Patch a policy. Builtin policies cannot be modified. Requires: policy:update permission.
      operationId: update_policy
      x-app-permission:
        resource: policy
        action: update
      tags:
        - Policies
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdate"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    put:
      summary: Replace policy
      description: |-
        Replace a policy. Builtin policies cannot be modified. Requires: policy:update permission.
      operationId: replace_policy
      x-app-permission:
        resource: policy
        action: update
      tags:
        - Policies
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdate"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    delete:
      summary: Delete policy
      description: |-
        Delete a policy. Builtin policies cannot be deleted. Requires: policy:delete permission.
      operationId: delete_policy
      x-app-permission:
        resource: policy
        action: delete
      tags:
        - Policies
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Policy Id
      responses:
        "204":
          description: Policy deleted
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
components:
  schemas:
    PolicyStatementSchema:
      type: object
      title: PolicyStatementSchema
      description: A single policy statement.
      required:
        - effect
        - actions
        - scope
      properties:
        effect:
          type: string
          title: Effect
          description: allow or deny
        actions:
          type: array
          items:
            type: string
          title: Actions
          description: List of resource_type:action strings
        scope:
          type: string
          title: Scope
          description: any, self, or project
        conditions:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          title: Conditions
          description: Optional attribute-based conditions

    PolicyCreate:
      type: object
      title: PolicyCreate
      description: Request body for creating a policy.
      required:
        - name
        - statements
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9]([a-zA-Z0-9:_-]*[a-zA-Z0-9])?$
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        statements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PolicyStatementSchema"
          title: Statements
        labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          title: Labels
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Project Id

    PolicyUpdate:
      type: object
      title: PolicyUpdate
      description: Request body for updating a policy (partial).
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
              pattern: ^[a-zA-Z0-9]([a-zA-Z0-9:_-]*[a-zA-Z0-9])?$
            - type: "null"
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        statements:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/PolicyStatementSchema"
            - type: "null"
          title: Statements
        labels:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
          title: Labels

    PolicyRead:
      type: object
      title: PolicyRead
      description: Response body for a policy.
      required:
        - id
        - name
        - is_system_scoped
        - is_project_eligible
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        statements:
          type: array
          default: []
          items:
            type: object
            additionalProperties: true
          title: Statements
        is_builtin:
          type: boolean
          default: false
          title: Is Builtin
        is_project_eligible:
          type: boolean
          readOnly: true
          description: True when the policy belongs to a project or is a project-scoped builtin.
          title: Is Project Eligible
        is_system_scoped:
          type: boolean
          readOnly: true
          description: True when the policy is not scoped to a specific project.
          title: Is System Scoped
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Project Id
        scope:
          type: string
          default: any
          title: Scope
        labels:
          type: object
          default: {}
          additionalProperties: true
          title: Labels
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Created At
        updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Updated At

    PolicyListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          properties:
            resources:
              type: array
              items:
                $ref: "#/components/schemas/PolicyRead"
          required:
            - resources
      title: PolicyListResponse
      description: Paginated list response for policies.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
