---
openapi: 3.1.0
info:
  title: Orchestrator Role Assignments API
  version: 1.0.0
  description: |
    Unified role assignment endpoints for the Orchestrator platform.

    These endpoints manage role assignments to users and groups,
    both at the system level (global) and project-scoped.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Role Assignments
    description: Unified role assignment management

paths:
  /role_assignments:
    post:
      summary: Create role assignment
      description: |-
        Assign a role to a user or group.

        When project_id is provided the assignment is project-scoped;
        otherwise it is a global (system-level) assignment.
      operationId: create_role_assignment
      x-app-permission:
        resource: role-assignment
        action: assign
      tags:
        - Role Assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentCreate"
      responses:
        "201":
          description: Role assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    get:
      summary: List role assignments
      description: |-
        List role assignments with policy-driven visibility.

        Users with ``role-assignment:read:any`` see all.
        Users with ``role-assignment:read:project`` see assignments in their projects.
        Users with ``role-assignment:read:self`` see their own (direct and via groups).
      operationId: list_role_assignments
      x-app-permission:
        resource: role-assignment
        action: read
      tags:
        - Role Assignments
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: principal_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Principal Id
          description: Filter by principal ID (user or service account)
        - name: group_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Group Id
          description: Filter by group ID
        - name: principal_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Principal Name
        - name: principal_type
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - user
                  - group
                  - service_account
              - type: 'null'
            title: Principal Type
        - name: role_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Role Name
        - name: project_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Project Id
        - name: scope
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - system
                  - project
              - type: 'null'
            title: Scope
      responses:
        "200":
          description: List of role assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

  /role_assignments/{assignment_id}:
    get:
      summary: Get role assignment
      description: |-
        Get a single role assignment by ID.

        Visibility rules match the list endpoint: admins see all,
        project-admins see their projects, users see their own.
      operationId: get_role_assignment
      x-app-permission:
        resource: null
        action: null
      tags:
        - Role Assignments
      parameters:
        - in: path
          name: assignment_id
          required: true
          schema:
            type: string
            format: uuid
            title: Assignment Id
      responses:
        "200":
          description: Role assignment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    delete:
      summary: Delete role assignment
      description: |-
        Remove a role assignment.
      operationId: delete_role_assignment
      x-app-permission:
        resource: role-assignment
        action: revoke
      tags:
        - Role Assignments
      parameters:
        - in: path
          name: assignment_id
          required: true
          schema:
            type: string
            format: uuid
            title: Assignment Id
      responses:
        "204":
          description: Assignment removed
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

components:
  schemas:
    RoleAssignmentCreate:
      type: object
      title: RoleAssignmentCreate
      description: |-
        Request body for creating a role assignment.

        Exactly one of ``principal_id`` or ``group_id`` must be provided.
      required:
        - role_name
      properties:
        principal_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Principal Id
        group_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Group Id
        role_name:
          type: string
          title: Role Name
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Project Id

    SubResourceRoleAssignmentCreate:
      type: object
      title: SubResourceRoleAssignmentCreate
      description: |-
        Request body for creating a role assignment from a sub-resource endpoint.

        The principal_id (or group_id) comes from the URL path.
      required:
        - role_name
      properties:
        role_name:
          type: string
          title: Role Name
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Project Id

    RoleAssignmentRead:
      type: object
      title: RoleAssignmentRead
      description: Response body for a role assignment.
      required:
        - id
        - principal_name
        - role_name
      properties:
        id:
          type: string
          format: uuid
          title: Id
        principal_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Principal Id
        group_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Group Id
        principal_name:
          type: string
          title: Principal Name
        principal_type:
          anyOf:
            - type: string
              enum:
                - user
                - group
                - service_account
            - type: 'null'
          title: Principal Type
        role_name:
          type: string
          title: Role Name
        role_description:
          anyOf:
            - type: string
            - type: 'null'
          title: Role Description
        role_policies:
          type: array
          default: []
          items:
            type: string
          title: Role Policies
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Project Id
        project_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Project Name
        is_builtin:
          type: boolean
          default: false
          title: Is Builtin
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At

    RoleAssignmentListResponse:
      type: object
      title: RoleAssignmentListResponse
      description: Paginated response for role assignments.
      required:
        - resources
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          properties:
            resources:
              type: array
              items:
                $ref: "#/components/schemas/RoleAssignmentRead"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
