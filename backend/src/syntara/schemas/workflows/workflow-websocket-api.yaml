---
asyncapi: 3.0.0
info:
  title: Workflow Engine WebSocket API
  version: 1.0.0
  description: |
    Real-time WebSocket API for workflow execution monitoring and control.

    **API Version**: v1 (current)
    **Protocol Version**: 1.0.0
    **AsyncAPI Version**: 3.0.0

    This API provides bidirectional communication for:
    - Real-time workflow execution updates
    - Activity completion notifications
    - Human approval workflow alerts
    - Execution control commands (pause, resume, cancel)
    - Subscription-based filtering and event delivery

    ## Version Management

    - **URL Versioning**: All WebSocket endpoints include `/v1/` in the path
    - **Protocol Versioning**: Message format versioned via `api_version` field
    - **Backward Compatibility**: v1.x versions maintain backward compatibility
    - **Version Negotiation**: Client can specify preferred version in connection
    - **Deprecation Policy**: 6-month notice before major version deprecation

    ## Connection Management

    - **Authentication**: JWT token in query parameter or Authorization header
    - **Session Management**: Server assigns session_id for reconnection support
    - **Message Replay**: Use last_event_id to resume from specific event
    - **State Persistence**: Session state maintained in Redis for reliability
    - **Version Detection**: Server includes API version in connection acknowledgment

    ## Shared Schemas

    This specification references shared schemas from `shared-schemas.yaml` for consistency
    with the REST API. All core entities (Workflow, Execution, Approval, etc.) use the
    same definitions across both REST and WebSocket APIs.
  contact:
    name: Automation Nexus Team
  license:
    name: MIT
  x-api-version: v1
  x-protocol-version: 1.0.0
  x-version-examples: |
    **Connection with Version Negotiation**:
    ```
    Client connects to: ws://localhost:8000/api/v1/ws/executions/exec-123?api_version=v1

    Server responds with:
    {
      "message_type": "connection_ack",
      "api_version": "v1",
      "protocol_version": "1.0.0",
      "supported_versions": ["v1"],
      "session_id": "sess_abc123",
      "timestamp": "2025-10-10T10:00:00Z"
    }
    ```

    **Versioned Message Example**:
    ```
    {
      "message_type": "execution_update",
      "api_version": "v1",
      "event_id": "evt_001",
      "session_id": "sess_abc123",
      "execution_id": "exec-uuid-123",
      "data": {
        "status": "running",
        "current_activities": [...]
      },
      "timestamp": "2025-10-10T10:00:01Z"
    }
    ```

    **Client Command with Version**:
    ```
    {
      "command": "pause",
      "api_version": "v1",
      "execution_id": "exec-uuid-123"
    }
    ```

servers:
  development:
    host: localhost:8000
    protocol: ws
    description: Development WebSocket server (API v1)
    pathname: /api/v1/ws
    security:
      - bearerAuth: []
    variables:
      version:
        enum: [v1]
        default: v1
        description: API version
  production:
    host: api.automation.example.com
    protocol: wss
    description: Production WebSocket server (API v1)
    pathname: /api/v1/ws
    security:
      - bearerAuth: []
    variables:
      version:
        enum: [v1]
        default: v1
        description: API version

defaultContentType: application/json

channels:
  # Note: Single execution visualization is handled by websocket-execution-streaming.yaml
  # with the executions channel at /executions/{execution_id}

  allExecutions:
    address: /executions
    title: All Executions Updates (v1)
    description: |
      Real-time updates for all workflow executions with subscription filtering.

      **API Version**: v1
      **Connection URL**: `ws://localhost:8000/api/v1/ws/executions`

      **Subscription Model**:
      - Client sends subscription message after connection
      - Supports filtering by workflow_id, status, labels
      - Multiple subscriptions can be active on a single connection
      - Server only sends events matching active subscriptions
      - All messages include `api_version` field for consistency

      **Version Negotiation**:
      - Client specifies preferred API version during connection
      - Subscription filters are version-specific
      - Server maintains separate subscription sets per API version
    parameters:
      session_id:
        $ref: '#/components/parameters/sessionId'
      last_event_id:
        $ref: '#/components/parameters/lastEventId'
      api_version:
        $ref: '#/components/parameters/apiVersion'
    messages:
      connectionAck:
        $ref: '#/components/messages/connectionAck'
      subscriptionConfirmation:
        $ref: '#/components/messages/subscriptionConfirmation'
      executionUpdate:
        $ref: '#/components/messages/executionUpdate'
      activityUpdate:
        $ref: '#/components/messages/activityUpdate'
      subscribeCommand:
        $ref: '#/components/messages/subscribeCommand'
      unsubscribeCommand:
        $ref: '#/components/messages/unsubscribeCommand'

  approvalNotifications:
    address: /approvals
    title: Approval Notifications (v1)
    description: |
      Real-time approval requests and status updates for the authenticated user.

      **API Version**: v1
      **Connection URL**: `ws://localhost:8000/api/v1/ws/approvals`

      **Automatic Subscription**:
      - Automatically subscribed to approvals for authenticated user
      - Receives new approval requests immediately
      - Notified of approval status changes and expirations
      - All notifications include `api_version` field

      **Version Compatibility**:
      - Approval format consistent across v1.x versions
      - Version-specific filtering and response formats
    parameters:
      session_id:
        $ref: '#/components/parameters/sessionId'
      last_event_id:
        $ref: '#/components/parameters/lastEventId'
      api_version:
        $ref: '#/components/parameters/apiVersion'
    messages:
      connectionAck:
        $ref: '#/components/messages/connectionAck'
      approvalNotification:
        $ref: '#/components/messages/approvalNotification'

operations:
  # Note: Single execution operations are defined in websocket-execution-streaming.yaml

  # All Executions Channel Operations
  receiveAllExecutionUpdates:
    action: receive
    channel:
      $ref: '#/channels/allExecutions'
    summary: Receive filtered updates for all executions
    messages:
      - $ref: '#/channels/allExecutions/messages/connectionAck'
      - $ref: '#/channels/allExecutions/messages/subscriptionConfirmation'
      - $ref: '#/channels/allExecutions/messages/executionUpdate'
      - $ref: '#/channels/allExecutions/messages/activityUpdate'

  sendSubscriptionCommands:
    action: send
    channel:
      $ref: '#/channels/allExecutions'
    summary: Manage subscriptions to execution events
    messages:
      - $ref: '#/channels/allExecutions/messages/subscribeCommand'
      - $ref: '#/channels/allExecutions/messages/unsubscribeCommand'

  # Approval Notifications Channel Operations
  receiveApprovalNotifications:
    action: receive
    channel:
      $ref: '#/channels/approvalNotifications'
    summary: Receive approval requests and status updates
    messages:
      - $ref: '#/channels/approvalNotifications/messages/connectionAck'
      - $ref: '#/channels/approvalNotifications/messages/approvalNotification'

components:
  # Import shared schemas via external reference
  schemas:
    # Core domain objects (imported from shared schemas)
    Execution:
      $ref: ./shared-schemas.yaml#/components/schemas/Execution
    ActivityExecution:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityExecution
    Approval:
      $ref: ./shared-schemas.yaml#/components/schemas/Approval
    ExecutionStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionStatus
    ActivityStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityStatus
    ApprovalStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ApprovalStatus

    # WebSocket-specific schemas (imported from shared schemas)
    WebSocketMessage:
      $ref: ./shared-schemas.yaml#/components/schemas/WebSocketMessage
    WebSocketCommand:
      $ref: ./shared-schemas.yaml#/components/schemas/WebSocketCommand
    WebSocketSubscription:
      $ref: ./shared-schemas.yaml#/components/schemas/WebSocketSubscription

    # AsyncAPI-specific message payload schemas
    ConnectionAckPayload:
      type: object
      description: Initial connection acknowledgment payload with version information
      required:
        - session_id
        - api_version
        - protocol_version
      properties:
        session_id:
          type: string
          description: Server-assigned session identifier for reconnection
          example: sess_abc123
        api_version:
          type: string
          description: API version in use for this connection
          example: v1
        protocol_version:
          type: string
          description: WebSocket protocol version
          example: 1.0.0
        supported_versions:
          type: array
          description: List of supported API versions
          items:
            type: string
          example: [v1]
        timestamp:
          type: string
          format: date-time
          example: '2025-10-10T10:00:00Z'
        server_info:
          type: object
          description: Optional server information
          example:
            server_id: workflow-engine-01
            region: us-east-1
            capabilities: [streaming, replay, subscriptions]
      example:
        session_id: sess_abc123
        api_version: v1
        protocol_version: 1.0.0
        supported_versions: [v1]
        timestamp: '2025-10-10T10:00:00Z'
        server_info:
          server_id: workflow-engine-01
          region: us-east-1

    ExecutionUpdatePayload:
      type: object
      description: Execution status update payload
      required:
        - execution_id
        - status
      properties:
        execution_id:
          type: string
          format: uuid
          example: exec-uuid-123
        status:
          $ref: '#/components/schemas/ExecutionStatus'
          example: running
        workflow_id:
          type: string
          format: uuid
          example: workflow-uuid-456
        current_activities:
          type: array
          items:
            type: object
            properties:
              activity_name:
                type: string
                example: fetch_data
              temporal_activity_id:
                type: string
                example: temp-act-001
              iteration:
                type: integer
                nullable: true
                example: 1
          example:
            - activity_name: fetch_data
              temporal_activity_id: temp-act-001
              iteration: 1
            - activity_name: process_data
              temporal_activity_id: temp-act-002
              iteration:

    ActivityUpdatePayload:
      type: object
      description: Activity execution update payload
      required:
        - execution_id
        - activity_id
        - status
      properties:
        execution_id:
          type: string
          format: uuid
          example: exec-uuid-123
        activity_id:
          type: string
          example: fetch_data
        status:
          $ref: '#/components/schemas/ActivityStatus'
          example: completed
        output_data:
          type: object
          nullable: true
          example:
            customers:
              - id: 1
                name: John Doe
                email: john@example.com
              - id: 2
                name: Jane Smith
                email: jane@example.com
            total_count: 2
        error_details:
          type: string
          nullable: true
          example:
        retry_count:
          type: integer
          example: 0

    ApprovalNotificationPayload:
      type: object
      description: Approval request or status update payload
      required:
        - approval_id
        - execution_id
        - status
      properties:
        approval_id:
          type: string
          format: uuid
          example: appr-uuid-789
        execution_id:
          type: string
          format: uuid
          example: exec-uuid-123
        activity_id:
          type: string
          example: manager_approval
        status:
          $ref: '#/components/schemas/ApprovalStatus'
          example: pending
        request_data:
          type: object
          nullable: true
          example:
            expense_amount: 500.00
            category: travel
            employee_id: emp-123
            description: Flight tickets for client meeting
            receipt_url: https://receipts.example.com/r123.pdf
        response_data:
          type: object
          nullable: true
          example:
            reason: Expense is within policy limits and properly documented
            reviewed_by: manager
            review_date: '2025-10-02'
            additional_notes: Approved for business travel
        approver_id:
          type: string
          format: uuid
          example: user-uuid-456
        requested_at:
          type: string
          format: date-time
          example: '2025-10-10T09:55:00Z'
        responded_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-10-10T10:15:00Z'
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-10-11T09:55:00Z'

    SubscriptionConfirmationPayload:
      type: object
      description: Subscription confirmation payload
      required:
        - subscription_id
      properties:
        subscription_id:
          type: string
          example: sub_001
        filter:
          type: object
          properties:
            workflow_id:
              type: string
              format: uuid
              example: workflow-uuid-456
            status:
              $ref: '#/components/schemas/ExecutionStatus'
              example: running
            labels:
              type: object
              additionalProperties:
                type: string
              example:
                environment: production
                priority: high
                team: data-platform
          example:
            workflow_id: workflow-uuid-456
            status: running
            labels:
              environment: production
              priority: high

    ExecutionCommandPayload:
      type: object
      description: Execution control command payload
      required:
        - execution_id
      properties:
        execution_id:
          type: string
          format: uuid
          example: exec-uuid-123
        reason:
          type: string
          description: Optional reason for the command
          example: Manual intervention required for data validation

    SubscriptionFilterPayload:
      type: object
      description: Subscription filter criteria payload
      properties:
        workflow_id:
          type: string
          format: uuid
          example: workflow-uuid-456
        status:
          $ref: '#/components/schemas/ExecutionStatus'
          example: running
        labels:
          type: object
          additionalProperties:
            type: string
          example:
            environment: production
            priority: high
            team: data-platform
      example:
        workflow_id: workflow-uuid-456
        status: running
        labels:
          environment: production
          priority: high

    ErrorPayload:
      type: object
      description: Error notification payload
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_FAILED
            - EXECUTION_NOT_FOUND
            - INVALID_COMMAND
            - ACTIVITY_FAILED
            - APPROVAL_EXPIRED
            - SUBSCRIPTION_FAILED
          example: ACTIVITY_FAILED
        message:
          type: string
          example: Activity execution failed after max retries
        details:
          type: object
          example:
            activity_name: process_data
            retry_count: 3
            last_error: Connection timeout to external service
            error_timestamp: '2025-10-10T10:01:30Z'
      example:
        code: ACTIVITY_FAILED
        message: Activity execution failed after max retries
        details:
          activity_name: process_data
          retry_count: 3
          last_error: Connection timeout to external service

  messages:
    connectionAck:
      name: connectionAck
      title: Connection Acknowledgment
      summary: Server acknowledges WebSocket connection with version information
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketMessage'
          - type: object
            properties:
              message_type:
                type: string
                const: connection_ack
          - $ref: '#/components/schemas/ConnectionAckPayload'
      examples:
        - name: Successful Connection
          summary: Successful WebSocket connection acknowledgment
          payload:
            message_type: connection_ack
            api_version: v1
            protocol_version: 1.0.0
            session_id: sess_abc123
            supported_versions: [v1]
            timestamp: '2025-10-10T10:00:00Z'
            server_info:
              server_id: workflow-engine-01
              region: us-east-1
              capabilities: [streaming, replay, subscriptions]

    executionUpdate:
      name: executionUpdate
      title: Execution Status Update
      summary: Workflow execution status change notification
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketMessage'
          - type: object
            properties:
              message_type:
                type: string
                const: execution_update
          - $ref: '#/components/schemas/ExecutionUpdatePayload'
      examples:
        - name: Execution Running
          summary: Workflow execution started and is running
          payload:
            message_type: execution_update
            api_version: v1
            event_id: evt_001
            session_id: sess_abc123
            execution_id: exec-uuid-123
            status: running
            workflow_id: workflow-uuid-456
            current_activities:
              - activity_name: fetch_data
                temporal_activity_id: temp-act-001
                iteration: 1
            timestamp: '2025-10-10T10:00:01Z'
        - name: Execution Completed
          summary: Workflow execution completed successfully
          payload:
            message_type: execution_update
            api_version: v1
            event_id: evt_005
            session_id: sess_abc123
            execution_id: exec-uuid-123
            status: completed
            workflow_id: workflow-uuid-456
            current_activities: []
            timestamp: '2025-10-10T10:05:30Z'

    activityUpdate:
      name: activityUpdate
      title: Activity Status Update
      summary: Individual activity execution status change
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketMessage'
          - type: object
            properties:
              message_type:
                type: string
                const: activity_update
          - $ref: '#/components/schemas/ActivityUpdatePayload'
      examples:
        - name: Activity Completed Successfully
          summary: Data fetch activity completed with results
          payload:
            message_type: activity_update
            api_version: v1
            event_id: evt_002
            session_id: sess_abc123
            execution_id: exec-uuid-123
            activity_id: fetch_data
            status: completed
            output_data:
              customers:
                - id: 1
                  name: John Doe
                  email: john@example.com
                - id: 2
                  name: Jane Smith
                  email: jane@example.com
              total_count: 2
            error_details:
            retry_count: 0
            timestamp: '2025-10-10T10:00:30Z'
        - name: Activity Failed with Retry
          summary: Activity failed but will be retried
          payload:
            message_type: activity_update
            api_version: v1
            event_id: evt_003
            session_id: sess_abc123
            execution_id: exec-uuid-123
            activity_id: process_data
            status: retrying
            output_data:
            error_details: Connection timeout to external service
            retry_count: 2
            timestamp: '2025-10-10T10:01:15Z'

    approvalNotification:
      name: approvalNotification
      title: Approval Request/Update
      summary: Human approval workflow notification
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketMessage'
          - type: object
            properties:
              message_type:
                type: string
                const: approval_notification
          - $ref: '#/components/schemas/ApprovalNotificationPayload'
      examples:
        - name: New Approval Request
          summary: New expense approval request for employee
          payload:
            message_type: approval_notification
            api_version: v1
            event_id: evt_appr_001
            session_id: sess_abc123
            approval_id: appr-uuid-789
            execution_id: exec-uuid-123
            activity_id: manager_approval
            status: pending
            request_data:
              expense_amount: 500.00
              category: travel
              employee_id: emp-123
              description: Flight tickets for client meeting
              receipt_url: https://receipts.example.com/r123.pdf
            response_data:
            approver_id: user-uuid-456
            requested_at: '2025-10-10T09:55:00Z'
            responded_at:
            expires_at: '2025-10-11T09:55:00Z'
            timestamp: '2025-10-10T09:55:00Z'
        - name: Approval Approved
          summary: Expense approval has been approved
          payload:
            message_type: approval_notification
            api_version: v1
            event_id: evt_appr_002
            session_id: sess_abc123
            approval_id: appr-uuid-789
            execution_id: exec-uuid-123
            activity_id: manager_approval
            status: approved
            request_data:
              expense_amount: 500.00
              category: travel
              employee_id: emp-123
              description: Flight tickets for client meeting
              receipt_url: https://receipts.example.com/r123.pdf
            response_data:
              reason: Expense is within policy limits and properly documented
              reviewed_by: manager
              review_date: '2025-10-02'
              additional_notes: Approved for business travel
            approver_id: user-uuid-456
            requested_at: '2025-10-10T09:55:00Z'
            responded_at: '2025-10-10T10:15:00Z'
            expires_at: '2025-10-11T09:55:00Z'
            timestamp: '2025-10-10T10:15:00Z'

    subscriptionConfirmation:
      name: subscriptionConfirmation
      title: Subscription Confirmation
      summary: Server confirms client subscription setup
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketMessage'
          - type: object
            properties:
              message_type:
                type: string
                const: subscription
          - $ref: '#/components/schemas/SubscriptionConfirmationPayload'
      examples:
        - name: Workflow-specific Subscription
          summary: Confirmation for subscribing to specific workflow events
          payload:
            message_type: subscription
            api_version: v1
            event_id: evt_sub_001
            session_id: sess_abc123
            subscription_id: sub_001
            filter:
              workflow_id: workflow-uuid-456
              status: running
              labels:
                environment: production
                priority: high
                team: data-platform
            timestamp: '2025-10-10T10:00:05Z'
        - name: Status-based Subscription
          summary: Confirmation for subscribing to failed executions only
          payload:
            message_type: subscription
            api_version: v1
            event_id: evt_sub_002
            session_id: sess_def456
            subscription_id: sub_002
            filter:
              status: failed
              labels:
                environment: production
            timestamp: '2025-10-10T10:01:00Z'

    errorNotification:
      name: errorNotification
      title: Error Notification
      summary: Server error notification
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketMessage'
          - type: object
            properties:
              message_type:
                type: string
                const: error
          - $ref: '#/components/schemas/ErrorPayload'
      examples:
        - name: Activity Failed Error
          summary: Error notification when an activity fails after retries
          payload:
            message_type: error
            api_version: v1
            event_id: evt_err_001
            session_id: sess_abc123
            code: ACTIVITY_FAILED
            message: Activity execution failed after max retries
            details:
              activity_name: process_data
              retry_count: 3
              last_error: Connection timeout to external service
              error_timestamp: '2025-10-10T10:01:30Z'
            timestamp: '2025-10-10T10:01:30Z'
        - name: Authentication Failed Error
          summary: Error when client authentication fails
          payload:
            message_type: error
            api_version: v1
            event_id: evt_err_002
            session_id: sess_invalid
            code: AUTHENTICATION_FAILED
            message: JWT token validation failed
            details:
              error_type: invalid_token
              token_expiry: '2025-10-10T09:30:00Z'
              current_time: '2025-10-10T10:00:00Z'
            timestamp: '2025-10-10T10:00:00Z'
        - name: Execution Not Found Error
          summary: Error when trying to access non-existent execution
          payload:
            message_type: error
            api_version: v1
            event_id: evt_err_003
            session_id: sess_abc123
            code: EXECUTION_NOT_FOUND
            message: Execution with specified ID does not exist
            details:
              execution_id: exec-nonexistent-123
              user_id: user-uuid-456
            timestamp: '2025-10-10T10:02:00Z'

    # Client-to-Server Commands
    pauseCommand:
      name: pauseCommand
      title: Pause Execution Command
      summary: Client requests to pause workflow execution
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketCommand'
          - type: object
            properties:
              command:
                type: string
                const: pause
          - $ref: '#/components/schemas/ExecutionCommandPayload'
      examples:
        - name: Pause with Reason
          summary: Pause execution with manual intervention reason
          payload:
            command: pause
            api_version: v1
            execution_id: exec-uuid-123
            reason: Manual intervention required for data validation
        - name: Emergency Pause
          summary: Emergency pause without detailed reason
          payload:
            command: pause
            execution_id: exec-uuid-456
            reason: Emergency stop requested by operations team

    resumeCommand:
      name: resumeCommand
      title: Resume Execution Command
      summary: Client requests to resume paused workflow execution
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketCommand'
          - type: object
            properties:
              command:
                type: string
                const: resume
          - $ref: '#/components/schemas/ExecutionCommandPayload'
      examples:
        - name: Resume After Validation
          summary: Resume execution after manual validation completed
          payload:
            command: resume
            api_version: v1
            execution_id: exec-uuid-123
            reason: Data validation completed, resuming normal execution
        - name: Simple Resume
          summary: Resume execution without specific reason
          payload:
            command: resume
            execution_id: exec-uuid-456

    cancelCommand:
      name: cancelCommand
      title: Cancel Execution Command
      summary: Client requests to cancel workflow execution
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketCommand'
          - type: object
            properties:
              command:
                type: string
                const: cancel
          - $ref: '#/components/schemas/ExecutionCommandPayload'
      examples:
        - name: Cancel with Business Reason
          summary: Cancel execution due to business requirements change
          payload:
            command: cancel
            api_version: v1
            execution_id: exec-uuid-123
            reason: Business requirements have changed, cancelling current workflow
        - name: Error-based Cancellation
          summary: Cancel execution due to unrecoverable error condition
          payload:
            command: cancel
            execution_id: exec-uuid-789
            reason: Unrecoverable error in external dependency, manual cancellation required

    subscribeCommand:
      name: subscribeCommand
      title: Subscribe to Updates
      summary: Client subscribes to filtered execution updates
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketCommand'
          - type: object
            properties:
              command:
                type: string
                const: subscribe
              subscription_filter:
                $ref: '#/components/schemas/SubscriptionFilterPayload'
      examples:
        - name: Subscribe to Production Workflows
          summary: Subscribe to all production workflow executions
          payload:
            command: subscribe
            api_version: v1
            subscription_filter:
              labels:
                environment: production
                team: data-platform
        - name: Subscribe to Specific Workflow
          summary: Subscribe to updates for a specific workflow only
          payload:
            command: subscribe
            subscription_filter:
              workflow_id: workflow-uuid-456
              status: running
        - name: Subscribe to Failed Executions
          summary: Subscribe to all failed execution notifications
          payload:
            command: subscribe
            api_version: v1
            subscription_filter:
              status: failed
              labels:
                priority: high

    unsubscribeCommand:
      name: unsubscribeCommand
      title: Unsubscribe from Updates
      summary: Client unsubscribes from specific execution updates
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/WebSocketCommand'
          - type: object
            properties:
              command:
                type: string
                const: unsubscribe
              subscription_filter:
                $ref: '#/components/schemas/SubscriptionFilterPayload'
      examples:
        - name: Unsubscribe from Production
          summary: Stop receiving production workflow updates
          payload:
            command: unsubscribe
            api_version: v1
            subscription_filter:
              labels:
                environment: production
        - name: Unsubscribe from Specific Workflow
          summary: Stop receiving updates for specific workflow
          payload:
            command: unsubscribe
            subscription_filter:
              workflow_id: workflow-uuid-456
        - name: Unsubscribe from All Failed
          summary: Stop receiving notifications for failed executions
          payload:
            command: unsubscribe
            api_version: v1
            subscription_filter:
              status: failed

  parameters:
    execution_id:
      description: Workflow execution ID to stream updates for
      schema:
        type: string
        format: uuid

    sessionId:
      description: |
        Optional session ID for WebSocket reconnection. Server provides this ID in the initial
        connection_ack message. Clients can use it to reconnect and resume their session
        after disconnection, with session state maintained in Redis.
      schema:
        type: string

    lastEventId:
      description: |
        Optional last received event ID for resuming WebSocket stream after disconnection.
        Server will replay events from this point forward, ensuring no messages are lost
        during connection interruptions.
      schema:
        type: string

    apiVersion:
      description: |
        API version to use for this connection. Defaults to latest stable version (v1).
        Server will negotiate the best compatible version if requested version is not supported.
      schema:
        type: string
        enum: [v1]
        default: v1

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token for user authentication and authorization.
        Token should include user permissions and API version access rights.

        Example usage:
        - Query parameter: `?token=eyJhbGciOiJIUzI1NiIs...`
        - Authorization header: `Authorization: Bearer eyJhbGciOiJIUzI1NiIs...`

        Token claims should include:
        - `sub`: User ID
        - `roles`: User roles array
        - `api_versions`: Allowed API versions array
        - `exp`: Token expiration
