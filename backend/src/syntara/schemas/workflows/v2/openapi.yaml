        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/versions/{version}/publish:
    post:
      summary: Publish workflow version
      description: |-
        Publish a specific workflow version.

        If publishing removes a Subworkflow Trigger that published parents invoke, it requires
        ``confirm=true``; otherwise it returns 409 with the count of affected parents (no parent details).
      operationId: publish_workflow_version
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
        - name: version
          in: path
          required: true
          schema:
            type: integer
            title: Version
          description: Version number to publish
        - name: confirm
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishVersionRequest'
      responses:
        '200':
          description: Published workflow version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishWorkflowVersionResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          description: >-
            Conflict. When publishing removes a Subworkflow Trigger invoked by published parents the
            body is a WorkflowPublishTriggerRemovalConfirmationProblem (carrying affected_count);
            resend with confirm=true. Other conflicts (version conflict, publish validation) use the
            generic problem shape.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WorkflowPublishTriggerRemovalConfirmationProblem'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/check_subworkflow_output_contract_changes:
    post:
      summary: Check for Sub-workflow output contract changes before publishing
      description: |
        Check a candidate workflow definition for Sub-workflow output contract changes.

        Compares the submitted candidate definition against the currently published version
        to detect breaking changes such as:
        - Removed outputs
        - Type changes
        - New required outputs

        This endpoint does not publish the candidate definition. It should be called before
        publishing to warn users about breaking changes that may affect parent workflows.
      operationId: check_subworkflow_output_contract_changes
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowValidateRequest'
      responses:
        '200':
          description: Sub-workflow output contract changes detection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakingChangesResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '429':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/unpublish:
    post:
      summary: Unpublish workflow
      description: Unpublish the currently published workflow version.
      operationId: unpublish_workflow
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '200':
          description: Unpublished workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/versions/{version}/restore:
    post:
      summary: Restore workflow version
      description: Restore a previous workflow version as a new draft.
      operationId: restore_workflow_version
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
        - name: version
          in: path
