          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  # Note: Approval endpoints are in a separate API
  # See: src/syntara/schemas/approvals/openapi.yaml

  /webhooks/{webhook_path}:
    post:
      summary: Receive webhook event
      description: >-
        Receive a webhook event from an external system and trigger the matching
        workflow. Requires a service account Bearer token. Only POST method is
        supported; other methods receive 405 Method Not Allowed.
      operationId: receive_webhook
      tags: [Webhooks]
      security:
        - bearerAuth: []
      x-app-permission:
        resource: null
        action: null
      parameters:
        - name: webhook_path
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
            title: Webhook Path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Payload
      responses:
        '202':
          description: Webhook accepted and workflow execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          description: Missing or invalid service account Bearer token
          content:
            application/problem+json:
              schema:
                $ref: '../../base/shared-resources.openapi.yaml#/components/schemas/ErrorData'
        '403':
          description: Service account is not authorized for this trigger
          content:
            application/problem+json:
              schema:
                $ref: '../../base/shared-resources.openapi.yaml#/components/schemas/ErrorData'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
        '413':
          description: Payload exceeds the 1 MB size limit
          content:
            application/problem+json:
              schema:
                $ref: '../../base/shared-resources.openapi.yaml#/components/schemas/ErrorData'

  /webhooks/eda/{webhook_path}:
    post:
      summary: Receive EDA webhook event
      description: >-
        Receive a webhook event from Event-Driven Ansible and trigger the
        matching workflow. Requires a service account Bearer token. Each EDA
        trigger node has its own unique webhook path. The payload can be any
        JSON structure.
      operationId: receive_eda_webhook
      tags: [Webhooks]
      security:
        - bearerAuth: []
      x-app-permission:
        resource: null
        action: null
      parameters:
        - name: webhook_path
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
            title: Webhook Path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Payload
      responses:
        '202':
          description: Webhook accepted and workflow execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          description: Missing or invalid service account Bearer token
          content:
            application/problem+json:
              schema:
                $ref: '../../base/shared-resources.openapi.yaml#/components/schemas/ErrorData'
        '403':
          description: Service account is not authorized for this trigger
          content:
            application/problem+json:
              schema:
                $ref: '../../base/shared-resources.openapi.yaml#/components/schemas/ErrorData'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
        '413':
          description: Payload exceeds the 1 MB size limit
          content:
            application/problem+json:
              schema:
                $ref: '../../base/shared-resources.openapi.yaml#/components/schemas/ErrorData'

components:
  schemas:
    # Import workflow-specific schemas
    WorkflowRead:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowRead

    WorkflowReadWithVersion:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowReadWithVersion

    PublishWorkflowVersionResponse:
      $ref: ./shared-schemas.yaml#/components/schemas/PublishWorkflowVersionResponse

    WorkflowVersionRead:
      type: object
      title: WorkflowVersionRead
      description: |-
        Schema for workflow version response (GET /workflows/{id}/versions/{version}).
        WorkflowVersion entities are read-only and managed automatically by the system.

        Note: deleted_at and deleted_by are None since soft-deleted versions are excluded from queries.
      required:
        - id
        - workflow_id
        - version
        - schema_version
        - workflow_definition
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          title: Id
        workflow_id:
          type: string
          format: uuid
          title: Workflow Id
        version:
          type: integer
          title: Version
        schema_version:
          type: string
          title: Schema Version
        workflow_definition:
          additionalProperties: true
          type: object
          title: Workflow Definition
        change_description:
          anyOf:
            - type: string
            - type: 'null'
          title: Change Description
        status:
          type: string
          default: draft
          enum:
            - draft
            - published
            - previously_published
          title: Status
        last_published_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Published At
        last_unpublished_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Unpublished At
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        created_by:
          type: string
          format: uuid
          title: Created By
        created_by_username:
          anyOf:
            - type: string
            - type: 'null'
          title: Created By Username
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Deleted At
        deleted_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Deleted By


    PublishVersionRequest:
      type: object
      title: PublishVersionRequest
      description: Request body for publishing a workflow version.
      properties:
        name:
          anyOf:
            - type: string
              maxLength: 255
            - type: 'null'
          title: Name
          description: Optional name for this version
        change_description:
          anyOf:
            - type: string
              maxLength: 1024
            - type: 'null'
          title: Change Description
          description: Description of changes in this version
        workflow_definition:
          anyOf:
            - $ref: '#/components/schemas/WorkflowDefinition'
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Workflow Definition
          description: Optional workflow definition to publish directly (skips separate save step)
        expected_version:
          anyOf:
            - type: integer
            - type: 'null'
          title: Expected Version
          description: >-
            Version the client was editing. If the server's current_version is
            higher, returns 409 Conflict.

    WorkflowVersionUpdate:
      type: object
      title: WorkflowVersionUpdate
      description: Request body for updating version metadata (PATCH /workflows/{id}/versions/{version}).
      properties:
        name:
          anyOf:
            - type: string
              maxLength: 255
            - type: 'null'
          title: Name
          description: Version name
        change_description:
          anyOf:
            - type: string
              maxLength: 1024
            - type: 'null'
          title: Change Description
          description: Description of changes

    WorkflowVersionListResponse:
      type: object
      title: WorkflowVersionListResponse
      description: Schema for workflow version list response.
      required:
        - resources
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Total
          description: Total count of resources (only when include_total=true)
        resources:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersionRead'
          maxItems: 100
          title: Resources
          description: Array of resources in current page
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    WorkflowListResponse:
      type: object
      required:
        - resources
      title: WorkflowListResponse
      description: Paginated list response for workflows.
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Total
          description: Total count of resources (only when include_total=true)
        resources:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRead'
          maxItems: 100
          title: Resources
          description: Array of resources in current page
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    # Note: Approval schemas are in src/syntara/schemas/approvals/openapi.yaml

    WorkflowCreate:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowCreate

    WorkflowUpdate:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowUpdate

    TestExecutionCreate:
      $ref: ./shared-schemas.yaml#/components/schemas/TestExecutionCreate

    PreResolvedNodeOutput:
      $ref: ./shared-schemas.yaml#/components/schemas/PreResolvedNodeOutput

    ExecutionMode:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionMode

    ExecutionRead:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionRead

    WorkflowDefinition:
      $ref: ./shared-schemas.yaml#/components/schemas/WorkflowDefinition

    # Node type schemas (referenced by WorkflowDefinition.nodes oneOf)
    AAPJobTemplateNode:
      $ref: ./shared-schemas.yaml#/components/schemas/AAPJobTemplateNode
    AAPWorkflowJobTemplateNode:
      $ref: ./shared-schemas.yaml#/components/schemas/AAPWorkflowJobTemplateNode
    HTTPRequestNode:
      $ref: ./shared-schemas.yaml#/components/schemas/HTTPRequestNode
    AgenticNode:
      $ref: ./shared-schemas.yaml#/components/schemas/AgenticNode
    ScriptNode:
      $ref: ./shared-schemas.yaml#/components/schemas/ScriptNode
    ApprovalNode:
      $ref: ./shared-schemas.yaml#/components/schemas/ApprovalNode
    ConditionNode:
      $ref: ./shared-schemas.yaml#/components/schemas/ConditionNode
    SwitchNode:
      $ref: ./shared-schemas.yaml#/components/schemas/SwitchNode
    LoopNode:
      $ref: ./shared-schemas.yaml#/components/schemas/LoopNode
    ConvergeNode:
      $ref: ./shared-schemas.yaml#/components/schemas/ConvergeNode
    WaitNode:
      $ref: ./shared-schemas.yaml#/components/schemas/WaitNode

    # Node parameter and settings schemas
    AAPJobTemplateExecutorParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/AAPJobTemplateExecutorParameters
    AAPWorkflowJobTemplateExecutorParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/AAPWorkflowJobTemplateExecutorParameters
    APIExecutorParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/APIExecutorParameters
    AgenticExecutorParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/AgenticExecutorParameters
    IntegrationConnectionConfig:
      $ref: ./shared-schemas.yaml#/components/schemas/IntegrationConnectionConfig
    ScriptExecutorParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/ScriptExecutorParameters
    ApprovalNodeParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/ApprovalNodeParameters
    ConditionNodeParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/ConditionNodeParameters
    SwitchNodeParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/SwitchNodeParameters
    SwitchCase:
      $ref: ./shared-schemas.yaml#/components/schemas/SwitchCase
    ConvergeNodeParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/ConvergeNodeParameters
    ForEachLoopParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/ForEachLoopParameters
    DoWhileLoopParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/DoWhileLoopParameters
    WaitNodeParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/WaitNodeParameters
    NodePosition:
      $ref: ./shared-schemas.yaml#/components/schemas/NodePosition
    NodeSettingsBase:
      $ref: ./shared-schemas.yaml#/components/schemas/NodeSettingsBase
    NodeSettingsCof:
      $ref: ./shared-schemas.yaml#/components/schemas/NodeSettingsCof
    NodeSettingsCofDisabled:
      $ref: ./shared-schemas.yaml#/components/schemas/NodeSettingsCofDisabled
    NodeSettingsNoRetry:
      $ref: ./shared-schemas.yaml#/components/schemas/NodeSettingsNoRetry
    NodeSettingsFull:
      $ref: ./shared-schemas.yaml#/components/schemas/NodeSettingsFull
    RetryPolicyParameters:
      $ref: ./shared-schemas.yaml#/components/schemas/RetryPolicyParameters
    HTTPMethod:
      $ref: ./shared-schemas.yaml#/components/schemas/HTTPMethod
    ScriptLanguage:
      $ref: ./shared-schemas.yaml#/components/schemas/ScriptLanguage
    ConvergeStrategy:
      $ref: ./shared-schemas.yaml#/components/schemas/ConvergeStrategy
    AAPVerbosity:
      $ref: ./shared-schemas.yaml#/components/schemas/AAPVerbosity
    AAPJobType:
      $ref: ./shared-schemas.yaml#/components/schemas/AAPJobType

    WebhookResponse:
      type: object
      title: WebhookResponse
      description: Response from webhook reception endpoint.
      required:
        - execution_id
        - message
      properties:
        execution_id:
          type: string
          format: uuid
          title: Execution Id
          description: ID of the triggered workflow execution
        message:
          type: string
          title: Message
          description: Human-readable status message

    WorkflowValidateRequest:
      type: object
      title: WorkflowValidateRequest
      description: |-
        Request body for the workflow validation endpoint.

        The definition is accepted as a raw dict so that structurally invalid
        definitions reach the application-level validator for richer error
        reporting with node-level attribution.
      required:
        - workflow_definition
      additionalProperties: false
      properties:
        workflow_definition:
          additionalProperties: true
          type: object
          title: Workflow Definition
          description: Workflow definition to validate

    ValidationSeverity:
      type: string
      title: ValidationSeverity
      description: Severity level for a validation finding.
      enum:
        - error
        - warning

    ValidationCategory:
      type: string
      title: ValidationCategory
      description: Machine-readable classification for a validation finding.
      enum:
        - schema_version
        - missing_field
        - schema_violation
        - invalid_reference
        - cycle_detected
        - orphaned_node
        - converge_configuration
        - approval_configuration

    ValidationFinding:
      type: object
      title: ValidationFinding
      description: |-
        A single structured validation finding.

        Attributes:
            severity: error or warning
            category: Machine-readable classification
            message: Human-readable description
            node_id: Related node ID, null for workflow-level issues
            field_path: Path within node config (e.g., ``config.url``)
      required:
        - severity
        - category
        - message
      additionalProperties: false
      properties:
        severity:
          $ref: '#/components/schemas/ValidationSeverity'
        category:
          $ref: '#/components/schemas/ValidationCategory'
        message:
          type: string
          title: Message
        node_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Node Id
        field_path:
          anyOf:
            - type: string
            - type: 'null'
          title: Field Path

    ValidationResult:
      type: object
      title: ValidationResult
      description: |-
        Structured validation result with flat findings list and computed counts.

        Attributes:
            is_valid: True when error_count == 0
            error_count: Count of error-severity findings
            warning_count: Count of warning-severity findings
            findings: All findings, errors first
      required:
        - is_valid
        - error_count
        - warning_count
      additionalProperties: false
      properties:
        is_valid:
          type: boolean
          title: Is Valid
        error_count:
          type: integer
          title: Error Count
        warning_count:
          type: integer
          title: Warning Count
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationFinding'
          title: Findings

    DetailedValidationProblemDetail:
      type: object
      title: DetailedValidationProblemDetail
      description: |-
        RFC 9457 Problem Details with a ``ValidationResult`` extension.

        Attributes:
            type: URI reference identifying the problem type
            title: Short, human-readable summary
            detail: Human-readable explanation specific to this occurrence
            code: Machine-readable error code
            instance: Optional URI reference identifying the specific occurrence
            validation_result: Structured validation findings
      required:
        - type
        - title
        - detail
        - code
        - validation_result
      additionalProperties: false
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        detail:
          type: string
          title: Detail
        code:
          type: string
          title: Code
        instance:
          anyOf:
            - type: string
            - type: 'null'
          title: Instance
        validation_result:
          $ref: '#/components/schemas/ValidationResult'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
