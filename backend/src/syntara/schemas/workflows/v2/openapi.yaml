---
openapi: 3.1.0
info:
  title: Workflow Engine API (v2)
  description: |
    API for managing graph-based (DAG) workflows with agentic and non-agentic tasks.

    ## V2 Workflow Model

    V2 workflows use a directed acyclic graph (DAG) structure with explicit nodes and edges,
    replacing the V1 tree-based activity model. Key concepts:

    - **Triggers**: Entry points that initiate workflow execution (e.g., manual_trigger)
    - **Nodes**: Execution units (script, http_request, agentic, aap_job_template, approval)
      and control flow (condition, loop, converge)
    - **Edges**: Directed connections between nodes with optional port-based routing
      (e.g., condition true/false, loop iterate/complete)
    - **Implicit parallelism**: Multiple edges from the same node execute concurrently
      (no dedicated parallel node needed)

    ## Schema Composition

    This API uses schema composition to reduce duplication:

    ```
    BaseResource (id, labels, created_at, updated_at)
    +-- NamedResource (+ name, description)
        +-- Workflow (+ SoftDeletableResource + UserOwnedResource)
            +-- WorkflowWithVersion (+ version details)

    UserOwnedResource (created_by)
    ```

    Note: Approval resources are in a separate API. See `/api/v1/approvals`.

    ## Labels

    All resources support key-value labels for categorization and filtering:
    - Format: `{"key": "value"}` (both key and value must be strings)
    - Use cases: environment tags, team ownership, priority levels, cost centers
    - Queryable: Filter resources by label selectors in list endpoints

    ## Node Type Catalog

    Available node types and their configuration schemas are defined in the
    [Node Type Catalog](./catalog/node_type_catalog.json). Individual node schemas
    (config and result) are in the `executors/`, `control-nodes/`, and `triggers/` directories.
  version: 2.0.0
  contact:
    name: Syntara Team
servers:
  - url: /api/v1
    description: API server (relative path)
tags:
  - name: Workflows
    description: Workflow CRUD, versioning, and publishing
  - name: Webhooks
    description: Inbound webhook event receivers
paths:
  /workflows:
    get:
      summary: List workflows
      description: "List workflows the current user has read access to.\n\nSupports filtering using query parameters with standard operators:\n- created_by: Filter by creator user ID (created_by=uuid)\n- is_enabled: Filter by enabled status (is_enabled=true|false)\n- labels: Filter by labels using bracket notation (labels[environment]=production)\n\nUses cursor-based pagination for scalability and consistency."
      operationId: list_workflows
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    post:
      summary: Create workflow
      description: Create a new workflow with initial version.
      operationId: create_workflow
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/validate:
    post:
      summary: Validate workflow definition
      description: |
        Validate a workflow definition without saving it.

        Requires authentication but no specific workflow/project permission:
        validation is a stateless, side-effect-free check of caller-supplied
        data with no workflow_id or project_id in scope to authorize against.
      operationId: validate_workflow_definition
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: null
        action: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowValidateRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DetailedValidationProblemDetail'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}:
    get:
      summary: Get workflow
      description: Get a workflow by ID including its current active version.
      operationId: get_workflow
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadWithVersion'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    patch:
      summary: Update workflow
      description: "Update workflow.\n\nSupports both metadata-only updates and workflow definition updates:\n- Metadata only (name, description, labels): Updates without creating new version\n- With workflow_definition: Validates definition, compares with current version, creates new WorkflowVersion\n  only if definition differs (change detection optimization)"
      operationId: update_workflow
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadWithVersion'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    delete:
      summary: Delete workflow
      description: |-
        Permanently delete a workflow and cascade-delete all its versions and executions.

        If the workflow is referenced by published parents, deletion requires ``confirm=true``;
        otherwise it returns 409 with the count of referencing parents (no parent details).
      operationId: delete_workflow
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: delete
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
        - name: confirm
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Confirm
      responses:
        '204':
          description: Workflow deleted
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          description: >-
            Conflict. When the workflow is referenced by published parents the body is a
            WorkflowReferencedConfirmationProblem (carrying referencing_count); resend with
            confirm=true to delete. Other conflicts (for example active executions blocking
            deletion) use the generic problem shape.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WorkflowReferencedConfirmationProblem'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/invocation_schema:
    get:
      summary: Get workflow invocation schema
      description: Get the latest published Subworkflow Trigger schemas for a workflow.
      operationId: get_workflow_invocation_schema
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '200':
          description: Published Subworkflow Trigger schemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInvocationSchemaRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/test:
    post:
      summary: Test a single node in a workflow
      description: Test a single node in a workflow with mocked predecessor outputs.
      operationId: test_workflow_node
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestExecutionCreate'
      responses:
        '201':
          description: Test execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/versions:
    get:
      summary: List workflow versions
      description: List versions for a workflow with cursor-based pagination.
      operationId: list_workflow_versions
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            exclusiveMinimum: 0
            maximum: 100
            title: Limit
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Cursor
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^-?[a-z][a-z0-9_]*$
              - type: 'null'
            title: Sort
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Include Total
      responses:
        '200':
          description: Workflow version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionListResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/used_by_counts:
    get:
      summary: Batch Used-By totals for multiple workflows
      description: >-
        Return the Used-By total for each requested workflow the caller may read.


        Totals count distinct published parents across all projects (matching the
        Used-By badge), so a workflow list can show per-row counts with one request
        instead of one call per row.
      operationId: get_workflow_used_by_counts
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_ids
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 100
            title: Workflow Ids
      responses:
        '200':
          description: Used-By totals for the requested workflows the caller may read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowUsedByCountsResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '429':
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/used_by:
    get:
      summary: List published workflows that reference this workflow
      description: >-
        List published workflows whose published version references this workflow
        (Used-By).


        ``referencing_parent_count`` is every distinct published parent across all projects;
        ``resources`` is the page of parents the caller may view. Access requires
        read permission on this workflow.
      operationId: list_workflow_used_by
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            exclusiveMinimum: 0
            maximum: 100
            title: Limit
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Cursor
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^-?[a-z][a-z0-9_]*$
              - type: 'null'
            title: Sort
        - name: trigger_node_ids
          in: query
          required: false
          schema:
            anyOf:
              - type: array
                items:
                  type: string
                maxItems: 50
              - type: 'null'
            x-query-param: true
            title: Trigger Node Ids
      responses:
        '200':
          description: Published parent workflows that reference this workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowUsedByResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '429':
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
  /workflows/{workflow_id}/versions/{version}:
    get:
      summary: Get workflow version
      description: Get a specific workflow version.
      operationId: get_workflow_version
      tags:
        - Workflows
      security:
