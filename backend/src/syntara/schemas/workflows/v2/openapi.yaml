          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    patch:
      summary: Update workflow
      description: "Update workflow.\n\nSupports both metadata-only updates and workflow definition updates:\n- Metadata only (name, description, labels): Updates without creating new version\n- With workflow_definition: Validates definition, compares with current version, creates new WorkflowVersion\n  only if definition differs (change detection optimization)"
