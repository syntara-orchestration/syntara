      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: update
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReadWithVersion'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    delete:
      summary: Delete workflow
      description: Soft delete a workflow.
      operationId: delete_workflow
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: delete
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Workflow Id
      responses:
        '204':
          description: Workflow deleted
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

