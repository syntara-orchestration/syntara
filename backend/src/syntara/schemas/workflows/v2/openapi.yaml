---
openapi: 3.1.0
info:
  title: Workflow Engine API (v2)
  description: |
    API for managing graph-based (DAG) workflows with agentic and non-agentic tasks.

    ## V2 Workflow Model

    V2 workflows use a directed acyclic graph (DAG) structure with explicit nodes and edges,
    replacing the V1 tree-based activity model. Key concepts:

    - **Triggers**: Entry points that initiate workflow execution (e.g., manual_trigger)
    - **Nodes**: Execution units (script, http_request, agentic, aap_job_template, approval)
      and control flow (condition, loop, converge)
    - **Edges**: Directed connections between nodes with optional port-based routing
      (e.g., condition true/false, loop iterate/complete)
    - **Implicit parallelism**: Multiple edges from the same node execute concurrently
      (no dedicated parallel node needed)

    ## Schema Composition

    This API uses schema composition to reduce duplication:

    ```
    BaseResource (id, labels, created_at, updated_at)
    +-- NamedResource (+ name, description)
        +-- Workflow (+ SoftDeletableResource + UserOwnedResource)
            +-- WorkflowWithVersion (+ version details)

    SoftDeletableResource (deleted_at, deleted_by)
    UserOwnedResource (created_by)
    ```

    Note: Approval resources are in a separate API. See `/api/v1/approvals`.

    ## Labels

    All resources support key-value labels for categorization and filtering:
    - Format: `{"key": "value"}` (both key and value must be strings)
    - Use cases: environment tags, team ownership, priority levels, cost centers
    - Queryable: Filter resources by label selectors in list endpoints

    ## Node Type Catalog

    Available node types and their configuration schemas are defined in the
    [Node Type Catalog](./catalog/node_type_catalog.json). Individual node schemas
    (config and result) are in the `executors/`, `control-nodes/`, and `triggers/` directories.
  version: 2.0.0
  contact:
    name: Orchestrator Team

servers:
  - url: /api/v1
    description: API server (relative path)

tags:
  - name: Workflows
    description: Workflow CRUD, versioning, and publishing
  - name: Webhooks
    description: Inbound webhook event receivers

paths:
  /workflows:
    get:
      summary: List workflows
      description: "List workflows the current user has read access to.\n\nSupports filtering using query parameters with standard operators:\n- created_by: Filter by creator user ID (created_by=uuid)\n- is_enabled: Filter by enabled status (is_enabled=true|false)\n- labels: Filter by labels using bracket notation (labels[environment]=production)\n\nUses cursor-based pagination for scalability and consistency."
      operationId: list_workflows
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: read
      parameters:
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
    post:
      summary: Create workflow
      description: Create a new workflow with initial version.
      operationId: create_workflow
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: workflow
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  /workflows/validate:
    post:
      summary: Validate workflow definition
      description: |
        Validate a workflow definition without saving it.

        Requires authentication but no specific workflow/project permission:
        validation is a stateless, side-effect-free check of caller-supplied
        data with no workflow_id or project_id in scope to authorize against.
      operationId: validate_workflow_definition
      tags:
        - Workflows
      security:
        - bearerAuth: []
      x-app-permission:
        resource: null
        action: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowValidateRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DetailedValidationProblemDetail'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

