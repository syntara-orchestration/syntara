---
openapi: 3.1.0
info:
  title: Workflow Executions API (v2)
  description: |
    API for executing and managing v2 graph-based workflow executions.

    ## Schema Composition

    This API uses schema composition to reduce duplication:

    ```
    BaseResource (id, labels, created_at, updated_at)
    +-- Execution (+ workflow execution fields)
    +-- ActivityExecution (+ activity execution fields)
    ```

    Note: Approval resources are in a separate API. See `/api/v1/approvals`.

    ## Labels

    All resources support key-value labels for categorization and filtering:
    - Format: `{"key": "value"}` (both key and value must be strings)
    - Use cases: environment tags, team ownership, priority levels, cost centers
    - Queryable: Filter resources by label selectors in list endpoints
  version: 2.0.0
  contact:
    name: Orchestrator Team

servers:
  - url: /api/v1
    description: API server (relative path)

tags:
  - name: Executions
    description: Workflow execution lifecycle management

paths:
  /executions:
    get:
      summary: List executions
      description: Retrieve executions with filtering, sorting, and cursor-based pagination.
      operationId: list_executions
      tags:
        - Executions
      security:
        - bearerAuth: []
      x-app-permission:
        resource: execution
        action: read
      parameters:
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionListResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
        '429':
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
    post:
      summary: Create execution
      description: Start a new workflow execution.
      operationId: create_execution
      tags:
        - Executions
      security:
        - bearerAuth: []
      x-app-permission:
        resource: null
        action: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
        '429':
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

  /executions/{execution_id}:
    get:
      summary: Get execution
      description: Retrieve details of a specific execution with optional includes.
      operationId: get_execution
      tags:
        - Executions
      security:
        - bearerAuth: []
      x-app-permission:
        resource: execution
        action: read
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Execution Id
        - name: include
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Include
            description: "Comma-separated list of related data to include. Valid values: workflow_definition, activities"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
        '429':
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

  /executions/{execution_id}/cancel:
    post:
      summary: Cancel execution
      description: Request cancellation of a running workflow execution. The status update to CANCELLED happens asynchronously.
      operationId: cancel_execution
      tags:
        - Executions
      security:
        - bearerAuth: []
      x-app-permission:
        resource: execution
        action: run
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Execution Id
      responses:
        '202':
          description: Cancellation request accepted
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
        '429':
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

  /executions/{execution_id}/retry:
    post:
      summary: Retry execution
      description: Retry a completed workflow execution. Creates a new execution using the same workflow version, inputs, and trigger as the original.
      operationId: retry_execution
      tags:
        - Executions
      security:
        - bearerAuth: []
      x-app-permission:
        resource: execution
        action: run
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Execution Id
      responses:
        '201':
          description: New execution created from retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRead'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        "429":
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'

  /executions/{execution_id}/activities:
    get:
      summary: List activity executions
      description: Retrieve activity executions for a workflow execution.
      operationId: list_execution_activities
      tags:
        - Executions
      security:
        - bearerAuth: []
      x-app-permission:
        resource: execution
        action: read
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Execution Id
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityExecutionListResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
        '429':
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

  /executions/{execution_id}/activities/{activity_id}/signal:
    post:
      summary: Send signal to activity in workflow
      description: Send a signal to a specific activity within a running workflow execution.
      operationId: signal_activity
      tags:
        - Executions
      security:
        - bearerAuth: []
      x-app-permission:
        resource: execution
        action: run
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Execution Id
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
            title: Activity Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivitySignalPayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '400':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ConflictError'
        '422':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../../base/shared-resources.openapi.yaml#/components/responses/InternalServerError'
        '429':
          $ref: "../../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

  # Note: Approval endpoints are in a separate API
  # See: src/syntara/schemas/approvals/openapi.yaml

components:
  schemas:
    ExecutionRead:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionRead

    ActivityExecution:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityExecution

    ActivityData:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityData

    ActivityStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityStatus

    NodeType:
      $ref: ./shared-schemas.yaml#/components/schemas/NodeType

    CurrentActivity:
      $ref: ./shared-schemas.yaml#/components/schemas/CurrentActivity

    ExecutionListResponse:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionListResponse

    ActivityExecutionListResponse:
      $ref: ./shared-schemas.yaml#/components/schemas/ActivityExecutionListResponse

    # Note: Approval schemas are in src/syntara/schemas/approvals/openapi.yaml

    ExecutionStatus:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionStatus

    ExecutionCreate:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionCreate

    TestExecutionCreate:
      $ref: ./shared-schemas.yaml#/components/schemas/TestExecutionCreate

    ExecutionMode:
      $ref: ./shared-schemas.yaml#/components/schemas/ExecutionMode

    SignalResponse:
      type: object
      title: Signal Response
      description: Response confirming a signal was sent to a workflow
      required:
        - status
      properties:
        status:
          type: string
          pattern: ^signal_sent$
          title: Status
          description: Confirmation that the signal was successfully sent
        message:
          anyOf:
            - type: string
            - type: "null"
          title: Message
          description: Human-readable confirmation message

    ActivitySignalPayload:
      type: object
      title: Activity Signal Payload
      description: Generic signal payload for sending arbitrary data to a specific activity within a running workflow execution.
      required:
        - signal_data
      properties:
        signal_data:
          type: object
          additionalProperties: true
          title: Signal Data
          description: Arbitrary JSON data to send to the activity. The structure depends on what the activity expects to receive.
          examples:
            - action: resume
              result:
                value: 42
              status: completed

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
