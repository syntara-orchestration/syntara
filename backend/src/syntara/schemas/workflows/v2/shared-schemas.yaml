              - $ref: '#/components/schemas/TFEUpdateWorkspaceNode'
              - $ref: '#/components/schemas/TFEDeleteWorkspaceNode'
              - $ref: '#/components/schemas/TFEFetchStateOutputsNode'
              - $ref: '#/components/schemas/TFEAddVariableNode'
              - $ref: '#/components/schemas/TFEListVariablesNode'
              - $ref: '#/components/schemas/TFEUpdateVariableNode'
              - $ref: '#/components/schemas/TFEDeleteVariableNode'
              - $ref: '#/components/schemas/TFEUploadConfigurationVersionNode'
              - $ref: '#/components/schemas/TFETriggerRunNode'
              - $ref: '#/components/schemas/TFEGetRunStatusNode'
              - $ref: '#/components/schemas/TFEApplyRunNode'
              - $ref: '#/components/schemas/TFEDiscardRunNode'
              - $ref: '#/components/schemas/TFECancelRunNode'
              - $ref: '#/components/schemas/TFEForceCancelRunNode'
              - $ref: '#/components/schemas/TFEListRunsNode'
              - $ref: '#/components/schemas/TFEAddRunCommentNode'
              - $ref: '#/components/schemas/TFEListGitHubInstallationsNode'
              - $ref: '#/components/schemas/TFEGetGitHubInstallationNode'
              - $ref: '#/components/schemas/TFELinkVCSNode'
              - $ref: '#/components/schemas/TFECreateProjectNode'
              - $ref: '#/components/schemas/TFEListProjectsNode'
              - $ref: '#/components/schemas/TFEGetProjectNode'
              - $ref: '#/components/schemas/TFEUpdateProjectNode'
              - $ref: '#/components/schemas/TFEDeleteProjectNode'
              - $ref: '#/components/schemas/TFEMoveWorkspaceToProjectNode'
              - $ref: '#/components/schemas/TFEAssignTeamPermissionsNode'
            discriminator:
              propertyName: type
              mapping:
                aap_job_template: '#/components/schemas/AAPJobTemplateNode'
