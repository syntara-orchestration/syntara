                loop: '#/components/schemas/LoopNode'
                script: '#/components/schemas/ScriptNode'
                switch: '#/components/schemas/SwitchNode'
                tfe_add_run_comment: '#/components/schemas/TFEAddRunCommentNode'
                tfe_add_variable: '#/components/schemas/TFEAddVariableNode'
                tfe_apply_run: '#/components/schemas/TFEApplyRunNode'
                tfe_assign_team_permissions: '#/components/schemas/TFEAssignTeamPermissionsNode'
                tfe_cancel_run: '#/components/schemas/TFECancelRunNode'
