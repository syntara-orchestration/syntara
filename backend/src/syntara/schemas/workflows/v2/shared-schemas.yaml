    WorkflowDefinition:
      properties:
        schema_version:
          type: string
          const: 2.0.0
          title: Schema Version
          description: Schema version that this workflow definition conforms to
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Workflow name
        description:
          anyOf:
            - type: string
              maxLength: 1000
              minLength: 1
            - type: 'null'
          title: Description
          description: Human-readable description of the workflow's purpose
        triggers:
          items:
            additionalProperties: true
            type: object
          type: array
          minItems: 1
          title: Triggers
          description: Trigger nodes that define how the workflow is initiated. Must contain at least one trigger. Trigger nodes must be graph entry points (no incoming edges) — enforced by application-level validation.
        nodes:
          items:
            oneOf:
              - $ref: '#/components/schemas/AAPJobTemplateNode'
              - $ref: '#/components/schemas/AAPWorkflowJobTemplateNode'
              - $ref: '#/components/schemas/HTTPRequestNode'
              - $ref: '#/components/schemas/AgenticNode'
              - $ref: '#/components/schemas/ScriptNode'
              - $ref: '#/components/schemas/ApprovalNode'
              - $ref: '#/components/schemas/ConditionNode'
              - $ref: '#/components/schemas/SwitchNode'
              - $ref: '#/components/schemas/LoopNode'
              - $ref: '#/components/schemas/ConvergeNode'
              - $ref: '#/components/schemas/WaitNode'
            discriminator:
              propertyName: type
              mapping:
                aap_job_template: '#/components/schemas/AAPJobTemplateNode'
                aap_workflow_job_template: '#/components/schemas/AAPWorkflowJobTemplateNode'
                agentic: '#/components/schemas/AgenticNode'
                approval: '#/components/schemas/ApprovalNode'
                condition: '#/components/schemas/ConditionNode'
                converge: '#/components/schemas/ConvergeNode'
                http_request: '#/components/schemas/HTTPRequestNode'
                loop: '#/components/schemas/LoopNode'
                script: '#/components/schemas/ScriptNode'
                switch: '#/components/schemas/SwitchNode'
                wait: '#/components/schemas/WaitNode'
          type: array
          title: Nodes
          description: Execution and control nodes in the workflow graph
        edges:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Edges
          description: List of directed edges connecting triggers and nodes in the workflow graph
      additionalProperties: false
