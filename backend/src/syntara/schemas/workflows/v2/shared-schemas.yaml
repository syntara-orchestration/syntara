    AAPJobType:
      type: string
      enum:
        - run
        - check
      title: AAPJobType
      description: Ansible Automation Platform job type values.
    HTTPMethod:
      type: string
      enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - HEAD
        - OPTIONS
        - CONNECT
        - TRACE
      title: HTTPMethod
      description: Supported HTTP methods for API requests.
