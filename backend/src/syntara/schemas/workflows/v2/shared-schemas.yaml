                tfe_get_github_installation: '#/components/schemas/TFEGetGitHubInstallationNode'
                tfe_get_project: '#/components/schemas/TFEGetProjectNode'
                tfe_get_run_status: '#/components/schemas/TFEGetRunStatusNode'
                tfe_link_vcs: '#/components/schemas/TFELinkVCSNode'
                tfe_list_github_installations: '#/components/schemas/TFEListGitHubInstallationsNode'
                tfe_list_projects: '#/components/schemas/TFEListProjectsNode'
                tfe_list_runs: '#/components/schemas/TFEListRunsNode'
                tfe_list_variables: '#/components/schemas/TFEListVariablesNode'
                tfe_list_workspaces: '#/components/schemas/TFEListWorkspacesNode'
