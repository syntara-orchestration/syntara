                tfe_create_workspace: '#/components/schemas/TFECreateWorkspaceNode'
                tfe_delete_project: '#/components/schemas/TFEDeleteProjectNode'
                tfe_delete_variable: '#/components/schemas/TFEDeleteVariableNode'
                tfe_delete_workspace: '#/components/schemas/TFEDeleteWorkspaceNode'
                tfe_discard_run: '#/components/schemas/TFEDiscardRunNode'
