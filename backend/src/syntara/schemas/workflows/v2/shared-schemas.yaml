        scm_branch:
          anyOf:
            - type: string
            - type: 'null'
          title: Scm Branch
          description: SCM branch override for projects in workflow
      type: object
      title: AAPWorkflowJobTemplateExecutorParameters
      description: "Parameters for Ansible Automation Platform Workflow Job Template executor.\n\nInherits common Ansible Automation Platform fields from AAPResourceReferenceMixin (credential_id, organization,\ninventory, extra_vars, limit, tags, skip_tags, labels, timeout)."
    APIExecutorParameters:
      properties:
        method:
          $ref: '#/components/schemas/HTTPMethod'
          description: HTTP method
        url:
          anyOf:
            - type: string
            - type: 'null'
          title: Url
          description: Request URL (optional when a Secret URL credential provides it)
        headers:
          additionalProperties: true
          type: object
          title: Headers
        body:
          anyOf:
            - additionalProperties: true
              type: object
            - type: string
            - type: 'null'
          title: Body
        query_params:
          additionalProperties: true
          type: object
          title: Query Params
        credential_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Credential Id
          description: Syntara credential UUID for authentication or Secret URL.
      type: object
      required:
        - method
      title: APIExecutorParameters
      description: Parameters for API executor (http_request activity).
    AgenticExecutorParameters:
      properties:
        prompt:
          type: string
          title: Prompt
          description: Prompt template for the agent
        agent:
          anyOf:
            - type: string
            - type: 'null'
          title: Agent
        llm_model_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Llm Model Id
          description: UUID of the LLMModel record identifying the provider integration and model.
        credential_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Credential Id
          description: Syntara credential UUID for LLM provider authentication
        file_ids:
          items:
            type: string
          type: array
          maxItems: 10
          title: File Ids
          description: File IDs for agent context
        responseSchema:
          anyOf:
            - additionalProperties: true
              type: object
            - type: string
            - type: 'null'
          title: Responseschema
          description: JSON Schema for structured output. When defined, agent output conforms to this schema.
        integration_connections:
          anyOf:
            - items:
                $ref: '#/components/schemas/IntegrationConnectionConfig'
              type: array
            - type: 'null'
          description: Per-integration execution credentials. Each entry overrides the management credential for that integration. Integrations not listed fall back to their management credential.
          title: Integration Connections
        tool_selection_strategy:
          anyOf:
            - enum:
                - ALL
                - NONE
                - SELECTED
              type: string
            - type: 'null'
          description: ALL (all enabled tools), NONE (no tools), or SELECTED (specific tools from tool_selections)
          title: Tool Selection Strategy
        tool_selections:
          items:
            type: string
          type: array
          description: Tool UUIDs to make available when tool_selection_strategy is SELECTED
          title: Tool Selections
      type: object
      required:
        - prompt
      title: AgenticExecutorParameters
      description: Parameters for agentic executor.
    IntegrationConnectionConfig:
      properties:
        integration_id:
          type: string
          title: Integration Id
          description: UUID of the integration
        credential_id:
          type: string
          title: Credential Id
          description: Syntara credential UUID for execution calls (distinct from management credential)
      type: object
      required:
        - integration_id
        - credential_id
      title: IntegrationConnectionConfig
      description: "Execution credential override for one integration.\n\n\nWhen included in AgenticExecutorParameters.integration_connections, this credential\n\nis used for calls against that integration instead of the integration's\n\nmanagement credential."
    ScriptExecutorParameters:
      properties:
        language:
          $ref: '#/components/schemas/ScriptLanguage'
        code:
          type: string
          minLength: 1
          title: Code
          description: Script code to execute
        environment:
          additionalProperties:
            type: string
          type: object
          title: Environment
          description: Environment variables
        credential_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Credential Id
          description: Syntara credential UUID for credential scrubbing
      type: object
      required:
        - language
        - code
      title: ScriptExecutorParameters
      description: Parameters for script executor.
    ApprovalNodeParameters:
      properties:
        credential_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Credential Id
          description: Syntara credential UUID
        approver_users:
          anyOf:
            - items:
                type: string
              type: array
              maxItems: 100
            - type: 'null'
          title: Approver Users
          description: Usernames who can approve
        approver_groups:
          anyOf:
            - items:
                type: string
              type: array
              maxItems: 50
            - type: 'null'
          title: Approver Groups
          description: Group names whose members can approve
        prompt:
          anyOf:
            - type: string
            - type: 'null'
          title: Prompt
          description: Message to display to approvers
        fallback_decision:
          anyOf:
            - type: string
              enum:
                - approve
                - reject
            - type: 'null'
          title: Fallback Decision
          description: Decision when approval times out with continue_on_failure
        decision_window:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Decision Window
          description: Response timeout in seconds
      type: object
      title: ApprovalNodeParameters
      description: Parameters for approval gate nodes.
    ConditionNodeParameters:
      properties:
        condition:
          type: string
          minLength: 1
          title: Condition
          description: Expression that evaluates to boolean
      type: object
      required:
        - condition
      title: ConditionNodeParameters
      description: Parameters for condition (if/then/else) control nodes.
    SwitchNodeParameters:
      properties:
        cases:
          items:
            $ref: '#/components/schemas/SwitchCase'
          type: array
          minItems: 1
          title: Cases
          description: Ordered list of cases
        default_port:
          anyOf:
            - type: string
            - type: 'null'
          title: Default Port
          description: Port to route to when no case matches
      type: object
      required:
        - cases
      title: SwitchNodeParameters
      description: Parameters for switch (multi-branch) control nodes.
    SwitchCase:
      properties:
        port:
          type: string
          minLength: 1
          title: Port
          description: Port identifier for this case
        label:
          type: string
          minLength: 1
          title: Label
          description: Display label for this case
        condition:
          type: string
          minLength: 1
          title: Condition
          description: Boolean expression to evaluate
      type: object
      required:
        - port
        - label
        - condition
      title: SwitchCase
      description: A single case in a switch node.
    ConvergeNodeParameters:
      properties:
        strategy:
          anyOf:
            - $ref: '#/components/schemas/ConvergeStrategy'
            - type: 'null'
          description: Convergence strategy
        n_required:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: N Required
          description: Branches required when strategy is 'any'
        wait_duration:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Wait Duration
          description: Wait timeout in seconds
      type: object
      title: ConvergeNodeParameters
      description: Parameters for converge (synchronization) control nodes.
    ForEachLoopParameters:
      properties:
        type:
          type: string
          const: for_each
          title: Type
        items:
          type: string
          minLength: 1
          title: Items
          description: Array expression to iterate over
        max_iterations:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Max Iterations
          description: Maximum items to process
      type: object
      required:
        - type
        - items
      title: ForEachLoopParameters
      description: Parameters for for_each loop nodes.
    DoWhileLoopParameters:
      properties:
        type:
          type: string
          const: do_while
          title: Type
        condition:
          type: string
          minLength: 1
          title: Condition
          description: Boolean expression evaluated after each iteration
        max_iterations:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Max Iterations
          description: Maximum iterations
      type: object
      required:
        - type
        - condition
      title: DoWhileLoopParameters
      description: Parameters for do_while loop nodes.
    WaitNodeParameters:
      properties:
        duration:
          type: integer
          minimum: 1.0
          title: Duration
          description: Wait duration in seconds
      type: object
      required:
        - duration
      title: WaitNodeParameters
      description: Parameters for wait (delay) control nodes.
    NodePosition:
      properties:
        x:
          type: number
          title: X
        y:
          type: number
          title: Y
      type: object
      required:
        - x
        - y
      title: NodePosition
      description: UI position hint for a workflow node.
    NodeSettingsBase:
      properties: {}
      additionalProperties: false
      type: object
      title: NodeSettingsBase
      description: Base node settings — no user-configurable fields.
    NodeSettingsCof:
      properties:
        continue_on_failure:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Continue On Failure
      additionalProperties: false
      type: object
      title: NodeSettingsCof
      description: Settings with continue_on_failure only (converge, loop).
    NodeSettingsCofDisabled:
      properties:
        continue_on_failure:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Continue On Failure
        disabled:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Disabled
      additionalProperties: false
      type: object
      title: NodeSettingsCofDisabled
      description: Settings with disabled and continue_on_failure (wait).
    NodeSettingsNoRetry:
      properties:
        continue_on_failure:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Continue On Failure
        disabled:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Disabled
        timeout:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Timeout
      additionalProperties: false
      type: object
      title: NodeSettingsNoRetry
      description: Settings with disabled, continue_on_failure, and timeout (script, agentic, approval).
    NodeSettingsFull:
      properties:
        continue_on_failure:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Continue On Failure
        disabled:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Disabled
        timeout:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Timeout
        retry_policy:
          anyOf:
            - $ref: '#/components/schemas/RetryPolicyParameters'
            - type: 'null'
      additionalProperties: false
      type: object
      title: NodeSettingsFull
      description: Full settings with retry_policy (http_request, aap_job_template, aap_workflow_job_template).
    RetryPolicyParameters:
      properties:
        max_retries:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Max Retries
          description: Retries after initial attempt. 0 = no retry.
        initial_interval:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Initial Interval
          description: Initial retry interval in seconds.
        max_interval:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Max Interval
          description: Maximum retry interval in seconds.
        backoff_coefficient:
          anyOf:
            - type: number
              minimum: 1.0
            - type: 'null'
          title: Backoff Coefficient
          description: Multiplier per retry. 1.0 = fixed, >1.0 = exponential.
      type: object
      title: RetryPolicyParameters
      description: "Retry policy parameters for a node.\n\nOnly applies to nodes whose settings class is NodeSettingsFull\n(http_request, aap_job_template, aap_workflow_job_template).\n\nAll fields default to None — the engine merges with global catalog values\n(workflow_engine.retry_*) for any unset field. Set max_retries=0 to\nexplicitly disable retry, overriding global defaults."
    ScriptLanguage:
      type: string
      enum:
        - bash
        - python
      title: ScriptLanguage
      description: Supported script languages for script executor.
    ConvergeStrategy:
      type: string
      enum:
        - all
        - any
      title: ConvergeStrategy
      description: Convergence strategies for converge nodes.
    AAPVerbosity:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
      title: AAPVerbosity
