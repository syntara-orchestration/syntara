---
openapi: 3.1.0
info:
  title: Orchestrator Forms API
  version: 1.0.0
  description: |
    Form prompts API for the Orchestrator platform.

    Minimal internal-facing implementation for workflow engine integration.
    AAP-91889 will extend with full filtering/sorting/enrichment.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Form Prompts
    description: Form prompt management for workflow human-in-the-loop gates

paths:
  /form_prompts:
    get:
      summary: List form prompts
      description: List form prompts filtered by execution ID. Internal endpoint for expire/cancel activities.
      operationId: list_form_prompts
      tags:
        - Form Prompts
      x-app-permission:
        resource: form_prompt
        action: read
      parameters:
        - name: execution_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
            title: Execution Id
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/FormPromptStatus"
              - type: 'null'
            title: Status
      responses:
        "200":
          description: List of form prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormPromptListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []
    post:
      summary: Create form prompt
      description: Create a new form prompt. Internal service-to-service endpoint for workflow engine.
      operationId: create_form_prompt
      tags:
        - Form Prompts
      x-app-permission:
        resource: form_prompt
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormPromptCreateRequest"
      responses:
        "201":
          description: Form prompt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormPromptSummary"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      security:
        - bearerAuth: []

  /form_prompts/batch:
    post:
      summary: Batch update form prompt statuses
      description: Batch update form prompt statuses. Internal endpoint for expire/cancel activities.
      operationId: batch_update_form_prompts
      tags:
        - Form Prompts
      x-app-permission:
        resource: form_prompt
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchFormPromptRequest"
      responses:
        "200":
          description: Batch update results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpdateResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

components:
  schemas:
    # Form definition schemas (from original spec)
    FormDefinition:
      type: object
      title: FormDefinition
      description: Complete form definition with fields and metadata.
      additionalProperties: false
      required:
        - fields
      properties:
        fields:
          type: array
          title: Fields
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/TextField'
              - $ref: '#/components/schemas/TextAreaField'
              - $ref: '#/components/schemas/MaskedTextField'
              - $ref: '#/components/schemas/EmailField'
              - $ref: '#/components/schemas/NumberField'
              - $ref: '#/components/schemas/CheckboxField'
              - $ref: '#/components/schemas/DateField'
              - $ref: '#/components/schemas/DropdownField'
              - $ref: '#/components/schemas/MultiSelectField'
            discriminator:
              propertyName: type
              mapping:
                text: '#/components/schemas/TextField'
                textarea: '#/components/schemas/TextAreaField'
                masked_text: '#/components/schemas/MaskedTextField'
                email: '#/components/schemas/EmailField'
                number: '#/components/schemas/NumberField'
                checkbox: '#/components/schemas/CheckboxField'
                date: '#/components/schemas/DateField'
                dropdown: '#/components/schemas/DropdownField'
                multi_select: '#/components/schemas/MultiSelectField'

    TextField:
      type: object
      title: TextField
      description: Text field.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
        type:
          type: string
          const: text
          title: Type
        default:
          anyOf:
            - type: string
            - type: 'null'
          title: Default

    TextAreaField:
      type: object
      title: TextAreaField
      description: Text area field.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
        type:
          type: string
          const: textarea
          title: Type
        default:
          anyOf:
            - type: string
            - type: 'null'
          title: Default

    MaskedTextField:
      type: object
      title: MaskedTextField
      description: Masked text field.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
        type:
          type: string
          const: masked_text
          title: Type
        default:
          anyOf:
            - type: string
            - type: 'null'
          title: Default

    EmailField:
      type: object
      title: EmailField
      description: Email field.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
        type:
          type: string
          const: email
          title: Type
        default:
          anyOf:
            - type: string
            - type: 'null'
          title: Default

    NumberField:
      type: object
      title: NumberField
      description: Numeric field supporting int or float.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
        type:
          type: string
          const: number
          title: Type
        default:
          anyOf:
            - type: number
            - type: integer
            - type: 'null'
          title: Default

    CheckboxField:
      type: object
      title: CheckboxField
      description: Boolean checkbox field.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
          description: When true the checkbox must be checked to submit, for example a terms of service or acknowledgment. An unchecked required checkbox fails with error code 'must_be_checked'.
        type:
          type: string
          const: checkbox
          title: Type
        default:
          type: boolean
          title: Default
          default: false

    DateField:
      type: object
      title: DateField
      description: Date field.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
        type:
          type: string
          const: date
          title: Type
        default:
          anyOf:
            - type: string
            - type: 'null'
          title: Default

    DropdownField:
      type: object
      title: DropdownField
      description: Dropdown field.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
        - options
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
        type:
          type: string
          const: dropdown
          title: Type
        options:
          title: Options
          oneOf:
            - $ref: '#/components/schemas/StaticOptions'
            - $ref: '#/components/schemas/DynamicOptions'
          discriminator:
            propertyName: source
            mapping:
              static: '#/components/schemas/StaticOptions'
              dynamic: '#/components/schemas/DynamicOptions'
        default:
          anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: 'null'
          title: Default

    MultiSelectField:
      type: object
      title: MultiSelectField
      description: Multi-select field.
      additionalProperties: false
      required:
        - value_name
        - label
        - type
        - options
      properties:
        value_name:
          type: string
          title: Value Name
          maxLength: 64
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        label:
          type: string
          title: Label
          minLength: 1
          maxLength: 200
        placeholder:
          anyOf:
            - type: string
            - type: 'null'
          title: Placeholder
        help_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Help Text
        required:
          type: boolean
          title: Required
          default: false
        type:
          type: string
          const: multi_select
          title: Type
        options:
          title: Options
          oneOf:
            - $ref: '#/components/schemas/StaticOptions'
            - $ref: '#/components/schemas/DynamicOptions'
          discriminator:
            propertyName: source
            mapping:
              static: '#/components/schemas/StaticOptions'
              dynamic: '#/components/schemas/DynamicOptions'
        default:
          anyOf:
            - type: array
              items: {}
            - type: 'null'
          title: Default

    StaticOptions:
      type: object
      title: StaticOptions
      description: Static option list for dropdown or multi-select.
      additionalProperties: false
      required:
        - source
        - values
      properties:
        source:
          type: string
          const: static
          title: Source
        values:
          type: array
          title: Values
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/StaticOption'

    StaticOption:
      type: object
      title: StaticOption
      description: A single static option for dropdown or multi-select.
      additionalProperties: false
      required:
        - display_label
        - value
      properties:
        display_label:
          type: string
          title: Display Label
          minLength: 1
          maxLength: 200
        value:
          anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
          title: Value

    DynamicOptions:
      type: object
      title: DynamicOptions
      description: Dynamic option list resolved from upstream node output.
      additionalProperties: false
      required:
        - source
        - expression
      properties:
        source:
          type: string
          const: dynamic
          title: Source
        expression:
          type: string
          title: Expression
        value_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Value Key
        label_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Label Key

    # Form prompt schemas (new for workflow engine integration)
    FormPromptSummary:
      type: object
      title: FormPromptSummary
      description: |-
        Minimal form prompt response for internal workflow engine endpoints.

        Contains only the 8 documented fields used by expire/cancel activities
        and workflow lifecycle management. Does not expose user-submitted form data
        or rendering configuration fields (those will appear in FormPromptRead for
        user-facing endpoints in AAP-91889).
      required:
        - id
        - execution_id
        - project_id
        - prompt_node_id
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Form prompt unique identifier
        execution_id:
          type: string
          format: uuid
          title: Execution Id
          description: Parent workflow execution ID
        project_id:
          type: string
          format: uuid
          title: Project Id
          description: Project ID (denormalized from execution)
        prompt_node_id:
          type: string
          title: Prompt Node Id
          description: Canvas node ID from the workflow definition
        name:
          type: string
          title: Name
          description: Display name for the form prompt
        status:
          $ref: "#/components/schemas/FormPromptStatus"
          description: Current prompt status
        loop_iteration_path:
          type: array
          title: Loop Iteration Path
          description: Enclosing-loop indices, outermost first
          items:
            type: integer
        temporal_activity_id:
          anyOf:
            - type: string
            - type: "null"
          title: Temporal Activity Id
          description: Temporal activity ID for async completion

    FormPromptListResponse:
      type: object
      title: FormPromptListResponse
      description: |-
        Paginated list response for form prompts.

        Uses FormPromptSummary (8 documented fields) for internal workflow engine endpoints.
        AAP-91889 will add user-facing list endpoints using FormPromptRead.
      required:
        - resources
      properties:
        next:
          anyOf:
            - type: string
            - type: "null"
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: "null"
          title: Prev
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: "null"
          title: Total
          description: Total count of resources (only when include_total=true)
        resources:
          type: array
          maxItems: 100
          title: Resources
          description: Array of resources in current page
          items:
            $ref: "#/components/schemas/FormPromptSummary"
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    FormPromptStatus:
      type: string
      title: FormPromptStatus
      description: Form prompt status enumeration.
      enum:
        - pending
        - submitted
        - expired
        - cancelled

    FormPromptCreateRequest:
      type: object
      title: FormPromptCreateRequest
      description: |-
        Request payload for creating a form prompt.

        This is an internal schema used by the Workflows component.
      required:
        - execution_id
        - project_id
        - prompt_node_id
        - name
        - form_definition
      properties:
        execution_id:
          type: string
          format: uuid
          title: Execution Id
          description: Parent workflow execution ID
        project_id:
          type: string
          format: uuid
          title: Project Id
          description: Project ID (denormalized from execution)
        prompt_node_id:
          type: string
          title: Prompt Node Id
          description: Canvas node ID from the workflow definition
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Display name for the form prompt
        message:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Message
          description: Resolved message shown above the form
        loop_iteration_path:
          type: array
          title: Loop Iteration Path
          description: Enclosing-loop indices, outermost first (empty when not inside a loop)
          items:
            type: integer
        temporal_activity_id:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
          title: Temporal Activity Id
          description: Temporal activity ID to signal on submit (defaults to prompt_node_id)
        timeout_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Timeout At
          description: When this prompt expires (null = no timeout)
        form_definition:
          $ref: "#/components/schemas/FormDefinition"
          description: Form schema defining fields to collect
        submit_label:
          anyOf:
            - type: string
              maxLength: 64
            - type: "null"
          title: Submit Label
          description: Submit button label
        success_message:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
          title: Success Message
          description: Success message after submit
        timezone:
          anyOf:
            - type: string
              maxLength: 64
            - type: "null"
          title: Timezone
          description: IANA timezone for date fields
        css_override:
          anyOf:
            - type: string
              maxLength: 10000
            - type: "null"
          title: Css Override
          description: Custom CSS for form rendering
        responder_user_ids:
          anyOf:
            - type: array
              maxItems: 1000
              items:
                type: string
                format: uuid
            - type: "null"
          title: Responder User Ids
          description: User IDs who can respond (null = any user with form_prompt:submit permission)
        responder_group_ids:
          anyOf:
            - type: array
              maxItems: 1000
              items:
                type: string
                format: uuid
            - type: "null"
          title: Responder Group Ids
          description: Group IDs whose members can respond

    BatchFormPromptStatus:
      type: string
      title: BatchFormPromptStatus
      description: |-
        Status values that can be submitted in batch form prompt updates.

        This is a system-actionable subset of FormPromptStatus.
      enum:
        - expired
        - cancelled

    BatchFormPromptUpdate:
      type: object
      title: BatchFormPromptUpdate
      description: Single update within a batch form prompt request.
      required:
        - prompt_id
        - status
      properties:
        prompt_id:
          type: string
          format: uuid
          title: Prompt Id
          description: ID of the form prompt
        status:
          $ref: "#/components/schemas/BatchFormPromptStatus"
          description: Status to set
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Notes
          description: Optional notes explaining the status change

    BatchFormPromptRequest:
      type: object
      title: BatchFormPromptRequest
      description: Request payload for batch updating form prompt statuses.
      required:
        - updates
      properties:
        updates:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BatchFormPromptUpdate"
          title: Updates
          description: List of form prompt status updates to apply

    BatchUpdateResult:
      type: object
      title: BatchUpdateResult
      description: Single result within a batch update response.
      required:
        - prompt_id
        - success
      properties:
        prompt_id:
          type: string
          title: Prompt Id
          description: ID of the form prompt
        success:
          type: boolean
          title: Success
          description: Whether the update succeeded
        message:
          anyOf:
            - type: string
            - type: "null"
          title: Message
          description: Success message if applicable
        error:
          anyOf:
            - type: string
            - type: "null"
          title: Error
          description: Error message if update failed

    BatchUpdateResponse:
      type: object
      title: BatchUpdateResponse
      description: Response payload for batch form prompt updates.
      required:
        - results
        - total_success
        - total_failed
      properties:
        results:
          type: array
          title: Results
          description: Individual update results
          items:
            $ref: "#/components/schemas/BatchUpdateResult"
        total_success:
          type: integer
          minimum: 0.0
          title: Total Success
          description: Count of successful updates
        total_failed:
          type: integer
          minimum: 0.0
          title: Total Failed
          description: Count of failed updates

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
