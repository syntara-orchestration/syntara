---
openapi: 3.1.0
info:
  title: Internal Metrics API
  description: |-
    Internal performance-testing endpoints for in-memory metrics data.

    Note: This API intentionally uses offset-based pagination (limit/offset) rather
    than the standard cursor-based pagination. This is an internal debug API not
    exposed to external consumers.
  version: 1.0.0
servers:
  - url: /
    description: Service root
paths:
  /_internal/metrics/summary:
    get:
      tags:
        - Internal Metrics
      summary: Metrics store summary
      description: Return a lightweight summary of the in-memory metrics store.
      operationId: get_internal_metrics_summary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsStoreSummary'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      x-app-permission:
        resource: null
        action: null
  /_internal/metrics/records:
    get:
      tags:
        - Internal Metrics
      summary: Metrics store records
      description: Return raw metric records with optional filtering and pagination.
      operationId: get_internal_metrics_records
      parameters:
        - name: metric_type
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by metric type value
            title: Metric Type
          description: Filter by metric type value
        - name: category
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/MetricsCategoryType'
              - type: 'null'
            description: Filter by category
            title: Category
          description: Filter by category
        - name: labels
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Label filter as JSON, e.g. {"component":"api_service"}
            title: Labels
          description: Label filter as JSON, e.g. {"component":"api_service"}
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 10000
            minimum: 1
            description: Page size
            default: 1000
            title: Limit
          description: Page size
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            description: Offset
            default: 0
            title: Offset
          description: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsRecordPage'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      x-app-permission:
        resource: null
        action: null
  /_internal/metrics/kpis:
    get:
      tags:
        - Internal Metrics
      summary: Metrics store KPIs
      description: "Return a computed KPI dashboard covering all Nexus components.\n\nMaps metrics to the KPIs defined in the Nexus KPI documents:\n- Nexus Key Performance Indicators (KPIs)\n- Nexus LLM/Agent Performance KPIs"
      operationId: get_internal_metrics_kpis
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPIDashboard'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      x-app-permission:
        resource: null
        action: null
  /_internal/metrics/kpis/{component}:
    get:
      tags:
        - Internal Metrics
      summary: Metrics store component KPIs
      description: Return KPIs for a single component.
      operationId: get_internal_metrics_component_kpis
      parameters:
        - name: component
          in: path
          required: true
          schema:
            type: string
            title: Component
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentKPISummary'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      x-app-permission:
        resource: null
        action: null
  /_internal/metrics/reset:
    post:
      tags:
        - Internal Metrics
      summary: Metrics store reset
      description: |-
        Clear all in-memory metrics (useful between test runs).

        Also clears the emission deduplication tracker and running counters to
        prevent the completion poller from re-emitting metrics for old executions
        that fall back into its lookback window.
      operationId: reset_internal_metrics_store
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Reset Internal Metrics Store
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      x-app-permission:
        resource: null
        action: null
tags:
  - name: Internal Metrics
    description: Internal metrics store for usage tracking and KPI reporting
components:
  schemas:
    ComponentKPISummary:
      properties:
        component:
          type: string
          title: Component
          description: Component identifier
        metrics:
          additionalProperties:
            anyOf:
              - $ref: '#/components/schemas/PercentileStats'
              - additionalProperties:
                  type: integer
                type: object
              - type: number
              - type: integer
          type: object
          title: Metrics
          description: Metric name → stats, scalar value, or distribution map
      additionalProperties: false
      type: object
      required:
        - component
      title: ComponentKPISummary
      description: KPI summary for a single Nexus component.
    KPIDashboard:
      properties:
        generated_at:
          type: string
          format: date-time
          title: Generated At
          description: Timestamp of generation
        components:
          items:
            $ref: '#/components/schemas/ComponentKPISummary'
          type: array
          title: Components
      additionalProperties: false
      type: object
      required:
        - generated_at
      title: KPIDashboard
      description: Full KPI dashboard covering all Nexus components.
    MetricRecord:
      description: "Lightweight in-memory metric data point.\n\n\n  Uses a slotted dataclass instead of SQLModel to reduce per-instance\n\n  memory from ~4.1KB to ~72 bytes.  This record never touches a database."
      properties:
        metric_type:
          $ref: '#/components/schemas/MetricType'
        value:
          type: number
          title: Value
        unit:
          type: string
          title: Unit
          default: ''
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - metric_type
        - value
      title: MetricRecord
    MetricType:
      type: string
      enum:
        - llm_duration_ms
        - llm_tokens_input
        - llm_tokens_output
        - llm_ttft_ms
        - llm_status
        - cache_hit
        - cache_miss
        - cache_lookup_ms
        - cache_utilization_ratio
        - workflow_duration_ms
        - workflow_status
        - activity_duration_ms
        - agent_routing_ms
        - agent_invocation_ms
        - agent_status
        - request_duration_ms
        - context_duration_ms
        - error
        - api_response_time_ms
        - api_error_rate
        - api_throughput_rps
        - workflow_creation_success_rate
        - workflow_serialization_duration_ms
        - workflow_validation_duration_ms
        - temporal_queue_depth
        - activity_execution_success_rate
        - workflow_start_latency_ms
        - workflow_completion_rate
        - temporal_execution_service_duration_ms
        - scheduled_trigger_fires_total
        - scheduled_trigger_latency_ms
        - tool_execution_duration_ms
        - tool_execution_status
        - database_query_response_time_ms
        - database_connection_pool_utilization_ratio
        - database_transaction_rate_tps
        - system_uptime_seconds
        - system_e2e_latency_ms
        - system_error_rate
        - auth_failure
        - authz_duration_ms
        - opa_request_duration_ms
      title: MetricType
      description: "Categories of metrics recorded by Nexus.\n\nEach value corresponds to a specific measurable quantity exposed via the\nmetrics REST API and (where applicable) Prometheus endpoint."
    MetricsCategoryType:
      type: string
      enum:
        - llm
        - cache
        - workflow
        - agent
        - error
        - system_overhead
        - api
        - workflow_engine
        - temporal_worker
        - execution_service
        - database
        - tool
        - system_wide
        - authorization
      title: MetricsCategoryType
      description: Metric category names used to group :class:`MetricType` members.
    MetricsRecordPage:
      properties:
        records:
          items:
            $ref: '#/components/schemas/MetricRecord'
          type: array
          title: Records
        total:
          type: integer
          title: Total
          description: Total matching records (before pagination)
        limit:
          type: integer
          title: Limit
          description: Page size used
        offset:
          type: integer
          title: Offset
          description: Offset used
      additionalProperties: false
      type: object
      required:
        - total
        - limit
        - offset
      title: MetricsRecordPage
      description: Paginated list of raw metric records.
    MetricsStoreSummary:
      properties:
        total_records:
          type: integer
          title: Total Records
          description: Total records currently stored
        retention_seconds:
          type: integer
          title: Retention Seconds
          description: Configured retention in seconds
        max_records:
          type: integer
          title: Max Records
          description: Configured capacity limit
        counters:
          additionalProperties:
            type: integer
          type: object
          title: Counters
          description: Internal named counters (requests, errors, cache_hits, …)
        metric_type_counts:
          additionalProperties:
            type: integer
          type: object
          title: Metric Type Counts
          description: Record count per MetricType
        oldest_record_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Oldest Record At
          description: Timestamp of the oldest stored record
        newest_record_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Newest Record At
          description: Timestamp of the newest stored record
      additionalProperties: false
      type: object
      required:
        - total_records
        - retention_seconds
        - max_records
      title: MetricsStoreSummary
      description: High-level summary of the in-memory metrics store.
    PercentileStats:
      properties:
        count:
          type: integer
          title: Count
          description: Number of observations
        min:
          type: number
          title: Min
          description: Minimum value
        max:
          type: number
          title: Max
          description: Maximum value
        mean:
          type: number
          title: Mean
          description: Arithmetic mean
        median:
          type: number
          title: Median
          description: 50th percentile (p50)
        p90:
          type: number
          title: P90
          description: 90th percentile
        p95:
          type: number
          title: P95
          description: 95th percentile
        p99:
          type: number
          title: P99
          description: 99th percentile
        sum:
          type: number
          title: Sum
          description: Sum of all values
      additionalProperties: false
      type: object
      required:
        - count
        - min
        - max
        - mean
        - median
        - p90
        - p95
        - p99
        - sum
      title: PercentileStats
      description: Percentile breakdown for a collection of values.
