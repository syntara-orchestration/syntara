---
openapi: 3.1.0
info:
  title: Syntara Approvals API
  version: 1.0.0
  description: |
    Human-in-the-loop approval API for the Syntara platform.

    This API provides endpoints for managing approval requests that pause
    automated processes pending human authorization. Approvals can be
    triggered by workflow approval nodes.

    ## Key Features
    - Create approval requests (internal, triggered by workflow engine)
    - List and filter pending approval requests
    - View approval details with full context
    - Submit approval decisions (approve/reject)
    - Batch approval for multiple requests

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Approvals
    description: Human-in-the-loop approval request management

paths:
  /approvals:
    get:
      summary: List approval requests
      description: |-
        List approval requests with filtering, sorting, and pagination.

        Supports filtering using query parameters with standard operators:
        - status: Filter by approval status (status=pending)
        - execution_id: Filter by parent execution ID (execution_id=uuid)

        Uses cursor-based pagination for scalability and consistency.
      operationId: list_approvals
      tags:
        - Approvals
      x-app-permission:
        resource: approval
        action: read
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/ApprovalRequestStatus"
              - type: 'null'
            title: Status
        - name: execution_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Execution Id
      responses:
        "200":
          description: List of approval requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []
    post:
      summary: Create approval request
      description: |-
        Create a new approval request.

        This is an internal endpoint called by the Workflows component when
        a workflow execution reaches an approval node. It should not be called
        directly by end users.
      operationId: create_approval
      tags:
        - Approvals
      x-app-permission:
        resource: approval
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreateRequest"
      responses:
        "201":
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

  /approvals/{approval_id}:
    get:
      summary: Get approval request
      description: |-
        Get an approval request by ID.

        The response includes:
        - Full request context (workflow inputs, completed step outputs)
        - Next steps for both approval and rejection paths
        - Decision history if already decided
      operationId: get_approval
      tags:
        - Approvals
      x-app-permission:
        resource: approval
        action: read
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Approval Id
      responses:
        "200":
          description: Approval request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

    patch:
      summary: Submit approval decision
      description: |-
        Submit an approval decision (approve or reject).

        Only pending approval requests can be decided. Attempting to modify an approval
        that is already approved, rejected, expired, or cancelled will return an error.

        When a decision is submitted:
        1. The approval request status is updated
        2. The decided_by, decided_at, and decision_notes fields are populated
        3. A signal is sent to the workflow to resume execution on the appropriate path
      operationId: decide_approval
      tags:
        - Approvals
      x-app-permission:
        resource: approval
        action: decide
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Approval Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Updated approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

    delete:
      summary: Delete a pending approval request
      description: |-
        Delete a pending approval request.

        Only pending approval requests can be deleted. Attempting to delete an
        already-decided approval returns 409 Conflict.
      operationId: delete_approval
      tags:
        - Approvals
      x-app-permission:
        resource: approval
        action: delete
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Approval Id
      responses:
        "204":
          description: Successful Response
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

  /approvals/batch:
    post:
      summary: Batch approve/reject multiple requests
      description: |-
        Submit decisions for multiple approval requests at once.

        Authorization is validated per-approval: Each approval is checked for project-scoped
        approval:decide permission AND approver list membership. Users with project-scoped
        permissions can batch approve requests within their authorized projects.

        This endpoint processes each decision independently. If some decisions fail due to
        authorization or validation errors, the successful ones are still recorded. The
        response includes detailed results for each decision.

        Use cases:
        - Approving multiple related requests at once
        - Bulk rejection of stale or irrelevant requests
      operationId: batch_decide_approvals
      tags:
        - Approvals
      x-app-permission:
        resource: null
        action: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchApprovalRequest"
      responses:
        "200":
          description: Batch decision results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchApprovalResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

components:
  schemas:
    ApprovalRequestRead:
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: ApprovalRequestRead
          description: |-
            ApprovalRequest API response model with typed nested fields.

            Overrides the JSONB dict fields from BaseApprovalRequest with typed models
            so API consumers get proper validation and type safety. Pydantic coerces
            the raw dicts from the database into these typed models during serialization.
          required:
            - project_id
            - name
            - execution_id
            - approval_node_id
            - next_step_approved
            - workflow_context
          properties:
            project_id:
              type: string
              format: uuid
              description: Project this approval belongs to (denormalized from execution)
              title: Project Id
            execution_id:
              type: string
              format: uuid
              description: Parent execution ID
              title: Execution Id
            approval_node_id:
              type: string
              maxLength: 255
              minLength: 1
              description: Activity ID from workflow definition
              title: Approval Node Id
            name:
              type: string
              maxLength: 255
              minLength: 1
              description: Human-readable name for the approval request
              title: Name
            status:
              $ref: "#/components/schemas/ApprovalRequestStatus"
              default: pending
              description: Current approval status
            timeout_at:
              anyOf:
                - format: date-time
                  type: string
                - type: "null"
              description: When this request expires
              title: Timeout At
            next_step_approved:
              $ref: "#/components/schemas/ActivitySummary"
              description: First activity that executes if approved
            next_step_rejected:
              anyOf:
                - $ref: "#/components/schemas/ActivitySummary"
                - type: "null"
              description: First activity that executes if rejected
            workflow_context:
              $ref: "#/components/schemas/WorkflowContext"
              description: Workflow inputs and previous step output
            approver_users:
              type: array
              items:
                $ref: "#/components/schemas/ApproverUserSummary"
              title: Approver Users
              description: Users who can approve this request (empty = any user with permission)
            approver_groups:
              type: array
              items:
                $ref: "#/components/schemas/ApproverGroupSummary"
              title: Approver Groups
              description: Groups whose members can approve this request
            decided_by:
              anyOf:
                - $ref: "#/components/schemas/UserReference"
                - type: "null"
              description: User who made the decision
            decided_at:
              anyOf:
                - format: date-time
                  type: string
                - type: "null"
              description: When decision was made
              title: Decided At
            decision_notes:
              anyOf:
                - maxLength: 2000
                  type: string
                - type: "null"
              description: Notes provided with decision
              title: Decision Notes
            signal_delivery_error:
              anyOf:
                - type: string
                - type: "null"
              description: Error if the workflow signal failed after a decision. Only present in the decide response; null on subsequent reads.
              title: Signal Delivery Error

    ApprovalRequestStatus:
      type: string
      title: ApprovalRequestStatus
      description: Approval request status enumeration.
      enum:
        - pending
        - approved
        - rejected
        - expired
        - cancelled

    ActivitySummary:
      type: object
      title: ActivitySummary
      additionalProperties: true
      description: |-
        Activity summary for workflow context.

        Passed through from the workflow engine as-is. Contains at minimum
        ``id``, ``name``, ``type``, and usually ``config`` with the full
        activity parameters so approvers can see what the step will do.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          title: Id
          description: Activity ID from workflow definition
        name:
          type: string
          title: Name
          description: Human-readable activity name
        type:
          type: string
          title: Type
          description: Activity type (script, approval, agentic, etc.)

    ApprovalCreateRequest:
      type: object
      title: ApprovalCreateRequest
      description: |-
        Request payload for creating an approval request.

        This is an internal schema used by the Workflows component.
      required:
        - execution_id
        - project_id
        - approval_node_id
        - name
        - next_step_approved
        - workflow_context
      properties:
        execution_id:
          type: string
          format: uuid
          title: Execution Id
          description: Parent workflow execution ID
        project_id:
          type: string
          format: uuid
          title: Project Id
          description: Project ID (denormalized from execution)
        approval_node_id:
          type: string
          title: Approval Node Id
          description: Activity ID from workflow definition
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Display name for the approval request
        timeout_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Timeout At
          description: When this request expires (null = no timeout)
        next_step_approved:
          $ref: "#/components/schemas/ActivitySummary"
          description: First activity that executes if approved
        next_step_rejected:
          anyOf:
            - $ref: "#/components/schemas/ActivitySummary"
            - type: "null"
          description: First activity that executes if rejected
        workflow_context:
          $ref: "#/components/schemas/WorkflowContext"
          description: Workflow execution context
        approver_user_ids:
          anyOf:
            - type: array
              maxItems: 1000
              items:
                type: string
                format: uuid
            - type: "null"
          title: Approver User Ids
          description: User IDs who can approve (null = any user with approval:decide permission)
        approver_group_ids:
          anyOf:
            - type: array
              maxItems: 1000
              items:
                type: string
                format: uuid
            - type: "null"
          title: Approver Group Ids
          description: Group IDs whose members can approve

    WorkflowContext:
      type: object
      title: WorkflowContext
      description: |-
        Workflow Context for approvers.

        Essential context for approvers to make a decision.
        Contains workflow identification, inputs, and the output from the immediately
        preceding activity.
      required:
        - workflow_name
        - inputs
      properties:
        workflow_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: ID of the workflow
          title: Workflow Id
        workflow_version:
          anyOf:
            - type: integer
            - type: 'null'
          description: Integer version number of the workflow version executed
          title: Workflow Version
        workflow_name:
          type: string
          description: Name of the workflow
          title: Workflow Name
        inputs:
          type: object
          description: Original workflow input parameters (structure varies per workflow)
          additionalProperties: true
          title: Inputs
        previous_step:
          anyOf:
            - $ref: "#/components/schemas/PreviousStepContext"
            - type: 'null'
          description: Previous step context and output

    PreviousStepContext:
      type: object
      title: PreviousStepContext
      description: |-
        Previous Step Context for workflow execution.

        The activity that immediately preceded this approval node, including its output.
        Null if the approval node is the first activity in the workflow.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          title: Id
          description: Activity ID from workflow definition
        name:
          type: string
          title: Name
          description: Human-readable activity name
        type:
          type: string
          title: Type
          description: Activity type (task, approval, parallel, etc.)
        output:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          title: Output
          description: Output from the activity (structure varies per activity type)

    ApprovalDecisionStatus:
      type: string
      title: ApprovalDecisionStatus
      description: |-
        Status values for approval decisions.

        This is a subset of ApprovalRequestStatus representing only the
        values that can be submitted in decision requests.
      enum:
        - approved
        - rejected

    ApprovalDecisionRequest:
      type: object
      title: ApprovalDecisionRequest
      description: |-
        Request payload for submitting an approval decision.

        Status values:
        - approved: Approver grants the request, workflow continues on approval path
        - rejected: Approver denies the request, workflow continues on rejection path
        - cancelled: Internal use only - set by workflow engine when parent workflow is cancelled
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/ApprovalDecisionStatus"
          description: Decision status
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Notes
          description: Optional notes explaining the decision

    BatchApprovalDecisionStatus:
      type: string
      title: BatchApprovalDecisionStatus
      description: |-
        Status values that can be submitted in batch approval decisions.

        This is a subset of ApprovalRequestStatus containing only system-actionable values.
      enum:
        - approved
        - rejected
        - expired
        - cancelled

    BatchApprovalDecision:
      type: object
      title: BatchApprovalDecision
      description: Single decision within a batch approval request.
      required:
        - approval_id
        - status
      properties:
        approval_id:
          type: string
          format: uuid
          title: Approval Id
          description: ID of the approval request
        status:
          $ref: "#/components/schemas/BatchApprovalDecisionStatus"
          description: Decision status
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Notes
          description: Optional notes explaining the decision

    BatchApprovalRequest:
      type: object
      title: BatchApprovalRequest
      description: Request payload for submitting multiple approval decisions at once.
      required:
        - decisions
      properties:
        decisions:
          type: array
          minItems: 1
          maxItems: 100
          title: Decisions
          items:
            $ref: "#/components/schemas/BatchApprovalDecision"
          description: List of approval decisions to submit

    BatchApprovalResult:
      type: object
      title: BatchApprovalResult
      description: Confirmation for a single approval within a batch response.
      required:
        - approval_id
        - success
      properties:
        approval_id:
          type: string
          format: uuid
          title: Approval Id
          description: ID of the approval request
        success:
          type: boolean
          title: Success
          description: Whether the decision was successfully recorded
        status:
          anyOf:
            - $ref: "#/components/schemas/ApprovalRequestStatus"
            - type: "null"
          description: New status after the decision (if successful)
        decided_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Decided At
          description: When decision was recorded (if successful)
        decided_by:
          anyOf:
            - $ref: "#/components/schemas/UserReference"
            - type: "null"
          description: User who made the decision (if successful)
        decision_notes:
          anyOf:
            - type: string
            - type: "null"
          title: Decision Notes
          description: Notes provided with the decision (echoed back from request)
        error:
          anyOf:
            - type: string
            - type: "null"
          title: Error
          description: Error message if the decision failed

    BatchApprovalResponse:
      type: object
      title: BatchApprovalResponse
      description: Response for batch approval submission.
      required:
        - results
        - total_success
        - total_failed
      properties:
        results:
          type: array
          title: Results
          items:
            $ref: "#/components/schemas/BatchApprovalResult"
          description: Individual results for each decision
        total_success:
          type: integer
          minimum: 0.0
          title: Total Success
          description: Number of successfully processed decisions
        total_failed:
          type: integer
          minimum: 0.0
          title: Total Failed
          description: Number of failed decisions

    ApprovalListResponse:
      type: object
      title: ApprovalListResponse
      description: Paginated list response for approval requests.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ
      required:
        - resources
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Total
          description: Total count of resources (only when include_total=true)
        resources:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ApprovalRequestRead"
          title: Resources
          description: Array of resources in current page

    UserReference:
      $ref: "../base/shared-resources.openapi.yaml#/components/schemas/UserReference"

    ApproverUserSummary:
      type: object
      title: ApproverUserSummary
      description: |-
        Summary of a user authorized to approve a request.

        Similar to UserReference but represents an approver rather than a decider.
        Used in API responses to show who can approve a request.
      required:
        - id
        - username
      properties:
        id:
          type: string
          format: uuid
          description: User's unique identifier
          title: Id
        username:
          type: string
          description: User's username
          title: Username

    ApproverGroupSummary:
      type: object
      title: ApproverGroupSummary
      description: |-
        Summary of a group whose members are authorized to approve a request.

        Represents a group of users who can collectively approve a request.
        Used in API responses to show which groups have approval authority.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Group's unique identifier
          title: Id
        name:
          type: string
          description: Group's name
          title: Name

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
