---
openapi: 3.1.0
info:
  title: Syntara Users & Groups API
  version: 1.0.0
  description: |
    User and group management endpoints for the Syntara platform.

    ## Key Features
    - User CRUD (local user account management)
    - Group CRUD and membership management

servers:
  - url: /api/v1
    description: API server (relative path)

tags:
  - name: Users
    description: Local user account management
  - name: Groups
    description: Group CRUD and membership management
  - name: Users Directory
    description: Lightweight user directory lookups
  - name: Groups Directory
    description: Lightweight group directory lookups

paths:
  # ── Users ───────────────────────────────────────────────────────────
  /users:
    get:
      summary: List users
      description: |-
        List users with visibility filtering and pagination.

        Users with ``user:read:any`` see all users.
        Users with ``user:read:self`` see only themselves.
      operationId: list_users
      x-app-permission:
        resource: user
        action: read
      tags:
        - Users
      parameters:
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - name: username
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Username
          description: "Filter by username (username=exact, username[contains]=substring, username[starts_with]=prefix)"
        - name: first_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: First Name
        - name: last_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Last Name
        - name: auth_type
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/AuthType'
              - type: 'null'
            title: Auth Type
        - name: auth_source
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Auth Source
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    post:
      summary: Create user
      description: Create a new local user.
      operationId: create_user
      x-app-permission:
        resource: user
        action: create
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /users/me:
    get:
      summary: Get current user profile
      description: Return information about the currently authenticated user.
      operationId: get_current_user_profile
      tags:
        - Users
      x-app-permission:
        resource: null
        action: null
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []
  /users/{user_id}:
    get:
      summary: Get user
      description: Get a user by ID.
      operationId: get_user
      x-app-permission:
        resource: user
        action: read
      tags:
        - Users
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
            title: User Id
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    patch:
      summary: Update user
      description: |-
        Update a user.

        Supports partial updates - only provided fields are updated.
      operationId: update_user
      x-app-permission:
        resource: user
        action: update
      tags:
        - Users
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
            title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    delete:
      summary: Delete user
      description: Soft delete a user.
      operationId: delete_user
      x-app-permission:
        resource: user
        action: delete
      tags:
        - Users
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
            title: User Id
      responses:
        '204':
          description: User deleted
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /users/{user_id}/groups:
    get:
      summary: List user groups
      description: List groups that a user belongs to.
      operationId: list_user_groups
      x-app-permission:
        resource: user
        action: read
      tags:
        - Users
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
            title: User Id
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      responses:
        '200':
          description: List of groups the user belongs to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    put:
      summary: Set user groups
      description: |-
        Set a user's group memberships declaratively.

        Replace all current memberships with the provided list of group IDs.
        An empty list removes the user from all groups.
      operationId: set_user_groups
      x-app-permission:
        resource: user
        action: update
      tags:
        - Users
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
            title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupsSet'
      responses:
        '200':
          description: Updated group memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

  # ── User Identities ────────────────────────────────────────────────
  /users/{user_id}/identities:
    get:
      summary: List user identities
      description: List federated identities for a user.
      operationId: list_user_identities
      x-app-permission:
        resource: user_identity
        action: read
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdentityListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

    post:
      summary: Attach user identity
      description: Attach a federated identity from another user to this user.
      operationId: attach_user_identity
      x-app-permission:
        resource: user_identity
        action: attach
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdentityAttach'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdentityRead'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

  /users/{user_id}/identities/{identity_id}:
    delete:
      summary: Detach user identity
      description: Detach (hard-delete) a federated identity from a user.
      operationId: detach_user_identity
      x-app-permission:
        resource: user_identity
        action: detach
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: User Id
        - name: identity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Identity Id
      responses:
        '204':
          description: Successful Response
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

  # ── Users Directory ─────────────────────────────────────────────────
  /users/directory:
    get:
      summary: List users directory
      description: Return a lightweight directory of users (id + username only).
      operationId: list_users_directory
      x-app-permission:
        resource: user-directory
        action: read
      tags:
        - Users Directory
      parameters:
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - name: username
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by username (username=exact, username[contains]=substring, username[starts_with]=prefix)
            title: Username
          description: "Filter by username (username=exact, username[contains]=substring, username[starts_with]=prefix)"
      responses:
        '200':
          description: Lightweight list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcesResponse_UserDirectoryEntry_'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

  # ── Groups Directory ───────────────────────────────────────────────
  /groups/directory:
    get:
      summary: List groups directory
      description: Return a lightweight directory of groups (id + name only).
      operationId: list_groups_directory
      x-app-permission:
        resource: group-directory
        action: read
      tags:
        - Groups Directory
      parameters:
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by group name (name=exact, name[contains]=substring, name[starts_with]=prefix)
            title: Name
          description: "Filter by group name (name=exact, name[contains]=substring, name[starts_with]=prefix)"
      responses:
        '200':
          description: Lightweight list of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcesResponse_GroupDirectoryEntry_'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

  # ── Groups ──────────────────────────────────────────────────────────
  /groups:
    get:
      summary: List groups
      description: |-
        Retrieve list of groups with visibility filtering.

        Users with ``group:read:any`` see all groups.
        Users with ``group:read:self`` see only their own groups.
      operationId: list_groups
      x-app-permission:
        resource: group
        action: read
      tags:
        - Groups
      parameters:
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/limitParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/cursorParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/sortParam
        - $ref: ../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    post:
      summary: Create group
      description: Create a new group for organizing users.
      operationId: create_group
      x-app-permission:
        resource: group
        action: create
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRead'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
