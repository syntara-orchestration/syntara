components:
  schemas:
    # ── User schemas ────────────────────────────────────────────────
    UserCreate:
      type: object
      title: UserCreate
      description: |-
        Schema for creating a new local user (POST /users).

        Excludes auto-generated fields: id, created_at, updated_at, last_login, preferences.
      required:
        - username
        - first_name
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique username
          title: Username
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 255
            - type: 'null'
          description: Email address
          title: Email
        first_name:
          type: string
          minLength: 1
          maxLength: 255
          description: User's first name
          title: First Name
        last_name:
          anyOf:
            - type: string
              maxLength: 255
            - type: 'null'
          description: User's last name
          title: Last Name
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 14
          description: Plaintext password (will be hashed)
          title: Password
        is_enabled:
          type: boolean
          default: true
          description: Whether the user account is enabled
          title: Is Enabled
        group_names:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          description: Groups to assign the user to. Omit to use the default (users group). Pass an empty list to skip group assignment.
          title: Group Names

    UserUpdate:
      type: object
      title: UserUpdate
      description: |-
        Schema for updating a user (PATCH /users/{id}).

        All fields are optional for partial updates.
      properties:
        username:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: 'null'
          description: Update username
          title: Username
        first_name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: 'null'
          description: Update first name
          title: First Name
        last_name:
          anyOf:
            - type: string
              maxLength: 255
            - type: 'null'
          description: Update last name
          title: Last Name
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 255
            - type: 'null'
          description: Update email address
          title: Email
        password:
          anyOf:
            - type: string
              format: password
              minLength: 14
              writeOnly: true
            - type: 'null'
          description: New password (will be hashed). Omit to keep current password.
          title: Password
        is_enabled:
          anyOf:
            - type: boolean
            - type: 'null'
          description: Enable or disable user account
          title: Is Enabled

    AuthType:
      type: string
      enum:
        - local
        - federated
      title: AuthType
      description: Authentication type for users.

    UserRead:
      type: object
      title: UserRead
      description: |-
        Schema for user response (GET /users/{id}).

        Includes all user fields except sensitive data (password_hash, preferences).
      required:
        - id
        - username
        - first_name
        - is_enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          title: Id
        username:
          type: string
          title: Username
        email:
          anyOf:
            - type: string
            - type: 'null'
          title: Email
        first_name:
          type: string
          title: First Name
        last_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Last Name
        is_enabled:
          type: boolean
          title: Is Enabled
        is_builtin:
          type: boolean
          default: false
          title: Is Builtin
        auth_type:
          $ref: '#/components/schemas/AuthType'
          default: local
        auth_sources:
          type: array
          items:
            type: string
          default: []
          title: Auth Sources
        last_login:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Login
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At

    UserListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/UserRead'
              title: Resources
              description: Array of resources in current page
      title: UserListResponse
      description: Paginated list response for users.

    UserGroupsSet:
      type: object
      title: UserGroupsSet
      description: |-
        Schema for declaratively setting a user's group memberships (PUT /users/{id}/groups).

        The provided list replaces all current memberships. An empty list removes
        the user from all groups.
      properties:
        group_ids:
          type: array
