          description: "Source type: 'manual' or 'idp'"
        provider_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Provider Name
          description: IdP name if source is 'idp'
        provider_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Provider Id
          description: IdP ID if source is 'idp'

