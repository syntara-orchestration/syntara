      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Group name
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          description: Group description
          title: Description

    GroupUpdate:
      type: object
      title: GroupUpdate
      description: |-
        Schema for updating a group (PATCH /groups/{id}).

        All fields are optional for partial updates.
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: 'null'
          description: Update group name
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          description: Update group description
          title: Description

    GroupRead:
      title: GroupRead
      additionalProperties: false
      description: |-
