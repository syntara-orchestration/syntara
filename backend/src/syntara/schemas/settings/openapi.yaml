---
openapi: 3.1.0
info:
  title: Orchestrator Settings API
  version: 1.0.0
  description: |
    Runtime settings API for the Orchestrator platform.

    Provides endpoints for listing, reading, and updating
    database-backed runtime configuration settings. Settings are identified
    by dot-namespaced keys (e.g. `context_manager.max_total_tokens`) and
    support optimistic locking via version numbers.

    All endpoints require the ADMINISTRATOR role.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Settings
    description: Runtime settings management

paths:
  /settings:
    get:
      summary: List settings
      description: |-
        List all runtime settings with pagination, filtering, and sorting.
      operationId: list_settings
      x-app-permission:
        resource: setting
        action: read
      tags:
        - Settings
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: category
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Category
        - name: group
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Group
      responses:
        "200":
          description: Paginated list of runtime settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    patch:
      summary: Bulk update settings
      description: |-
        Update multiple settings in a single request.
      operationId: bulk_update_settings
      x-app-permission:
        resource: setting
        action: write
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingBulkUpdateRequest"
      responses:
        "200":
          description: All settings updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /settings/categories:
    get:
      summary: List categories
      description: |-
        List all setting categories with their group names.
      operationId: list_categories
      x-app-permission:
        resource: setting
        action: read
      tags:
        - Settings
      responses:
        "200":
          description: List of setting categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /settings/{key}:
    get:
      summary: Get setting
      description: |-
        Get a single runtime setting by its dot-namespaced key.
      operationId: get_setting
      x-app-permission:
        resource: setting
        action: read
      tags:
        - Settings
      parameters:
        - name: key
          in: path
          required: true
          schema:
            title: Key
            type: string
          description: Dot-namespaced setting key (e.g. `context_manager.max_total_tokens`)
      responses:
        "200":
          description: Setting details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSettingRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    patch:
      summary: Update setting
      description: |-
        Update a runtime setting value with optimistic locking.
      operationId: update_setting
      x-app-permission:
        resource: setting
        action: write
      tags:
        - Settings
      parameters:
        - name: key
          in: path
          required: true
          schema:
            title: Key
            type: string
          description: Dot-namespaced setting key (e.g. `context_manager.max_total_tokens`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: Setting updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSettingRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
components:
  schemas:
    SettingValueType:
      type: string
      title: SettingValueType
      description: Expected value type for a runtime setting, used for UI rendering and validation.
      enum:
        - string
        - integer
        - float
        - boolean
        - json

    RuntimeSettingRead:
      title: RuntimeSettingRead
      description: Read schema for a single runtime setting.
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: RuntimeSettingRead
          required:
            - key
            - name
            - description
            - helper_text
            - depends_on
            - category
            - group
            - value
            - default_value
            - effective_value
            - value_type
            - requires_restart
            - cache_ttl_seconds
            - validation_schema
            - version
          properties:
            key:
              type: string
              title: Key
            name:
              type: string
              title: Name
            description:
              anyOf:
                - type: string
                - type: "null"
              title: Description
            helper_text:
              anyOf:
                - type: string
                - type: "null"
              title: Helper Text
            depends_on:
              anyOf:
                - type: string
                - type: "null"
              title: Depends On
            category:
              type: string
              title: Category
            group:
              anyOf:
                - type: string
                - type: "null"
              title: Group
            value:
              title: Value
            default_value:
              title: Default Value
            effective_value:
              title: Effective Value
            value_type:
              $ref: "#/components/schemas/SettingValueType"
            requires_restart:
              type: boolean
              title: Requires Restart
            cache_ttl_seconds:
              anyOf:
                - type: integer
                - type: "null"
              title: Cache Ttl Seconds
            validation_schema:
              anyOf:
                - type: object
                  additionalProperties: true
                - type: "null"
              title: Validation Schema
            version:
              type: integer
              title: Version

    SettingUpdate:
      type: object
      title: SettingUpdate
      description: Request body for PATCH /settings/{key}.
      required:
        - value
      properties:
        value:
          title: Value
        expected_version:
          anyOf:
            - type: integer
            - type: "null"
          title: Expected Version

    SettingBulkUpdateItem:
      type: object
      title: SettingBulkUpdateItem
      description: A single setting update within a bulk request.
      required:
        - key
        - value
      properties:
        key:
          type: string
          title: Key
        value:
          title: Value
        expected_version:
          anyOf:
            - type: integer
            - type: "null"
          title: Expected Version

    SettingBulkUpdateRequest:
      type: object
      title: SettingBulkUpdateRequest
      description: Request body for PATCH /settings (bulk update).
      required:
        - updates
      properties:
        updates:
          type: array
          maxItems: 500
          title: Updates
          items:
            $ref: "#/components/schemas/SettingBulkUpdateItem"

    SettingCategoryRead:
      type: object
      title: SettingCategoryRead
      description: Read schema for a setting category.
      required:
        - slug
        - name
        - description
        - group_names
      properties:
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        display_order:
          type: integer
          title: Display Order
          default: 0
        group_names:
          type: array
          items:
            type: string
          title: Group Names

    SettingsListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/RuntimeSettingRead'
              title: Resources
              description: Array of resources in current page
      title: SettingsListResponse
      description: Paginated list response for runtime settings.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    CategoriesListResponse:
      type: object
      title: CategoriesListResponse
      description: Response schema for listing setting categories.
      required:
        - resources
      properties:
        resources:
          type: array
          title: Resources
          items:
            $ref: "#/components/schemas/SettingCategoryRead"
