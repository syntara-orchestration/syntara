---
openapi: 3.1.0
info:
  title: Syntara Service Accounts API
  description: REST API for managing OAuth 2.0 service accounts for machine-to-machine authentication.
  version: 1.0.0
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Service Accounts
    description: Service account CRUD operations
  - name: Service Account Credentials
    description: Service account credential lifecycle management
paths:
  /service_accounts:
    post:
      tags:
        - Service Accounts
      summary: Create service account
      description: Create a new service account.
      operationId: create_service_account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountCreate'
      responses:
        '201':
          description: Service account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountRead'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      x-app-permission:
        resource: service_account
        action: create
    get:
      tags:
        - Service Accounts
      summary: List service accounts
      description: List service accounts with project-scoped visibility and pagination.
      operationId: list_service_accounts
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            exclusiveMinimum: 0
            description: Maximum number of results per page
            default: 20
            title: Limit
          description: Maximum number of results per page
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Pagination cursor from previous response
            title: Cursor
          description: Pagination cursor from previous response
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - pattern: ^-?[a-z][a-z0-9_]*$
                type: string
              - type: 'null'
            description: Sort parameter (e.g., 'name', '-created_at')
            title: Sort
          description: Sort parameter (e.g., 'name', '-created_at')
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            description: Include total count in response (expensive)
            default: false
            title: Include Total
          description: Include total count in response (expensive)
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/ServiceAccountStatus'
              - type: 'null'
            description: Filter by status
            title: Status
          description: Filter by status
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by name
            title: Name
          description: Filter by name
      responses:
        '200':
          description: List of service accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      x-app-permission:
        resource: service_account
        action: read
  /service_accounts/{service_account_id}:
    get:
      tags:
        - Service Accounts
      summary: Get service account
      description: Get a service account by ID (secret is never included).
      operationId: get_service_account
      security:
        - bearerAuth: []
      parameters:
        - name: service_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Service Account Id
      responses:
