        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      x-app-permission:
        resource: service_account
        action: read
    patch:
      tags:
        - Service Accounts
      summary: Update service account
      description: Update a service account's name and/or description.
      operationId: update_service_account
      security:
        - bearerAuth: []
      parameters:
        - name: service_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Service Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountUpdate'
      responses:
        '200':
          description: Updated service account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountRead'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      x-app-permission:
        resource: service_account
        action: update
    delete:
      tags:
        - Service Accounts
      summary: Delete service account
      description: Soft-delete a service account.
      operationId: delete_service_account
      security:
        - bearerAuth: []
      parameters:
        - name: service_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Service Account Id
      responses:
        '204':
          description: Service account deleted
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
      x-app-permission:
        resource: service_account
        action: delete
  /service_accounts/{service_account_id}/disable:
    post:
      tags:
        - Service Accounts
      summary: Disable service account
      description: Set a service account's status to disabled.
      operationId: disable_service_account
