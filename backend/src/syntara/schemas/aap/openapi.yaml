components:
  schemas:
    AAPOrganization:
      type: object
      title: AAPOrganization
      description: Ansible Automation Platform organization resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name

    AAPJobTemplate:
      type: object
      title: AAPJobTemplate
      description: Ansible Automation Platform job template resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description

    AAPWorkflowJobTemplate:
      type: object
      title: AAPWorkflowJobTemplate
      description: Ansible Automation Platform workflow job template resource.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description

    AAPSummaryField:
      type: object
      title: AAPSummaryField
      description: Summary field with id and name from Ansible Automation Platform summary_fields.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name

    AAPJobType:
      type: string
      title: AAPJobType
      description: Ansible Automation Platform job type values.
      enum:
        - run
        - check

    AAPJobTemplateDetail:
      type: object
      title: AAPJobTemplateDetail
      description: Ansible Automation Platform job template with prompt-on-launch capabilities and default values.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        url:
          anyOf:
            - type: string
            - type: "null"
          title: Url
          description: Link to the job template in Ansible Automation Platform Controller UI
        ask_job_type_on_launch:
          type: boolean
          default: false
          title: Ask Job Type On Launch
        ask_inventory_on_launch:
          type: boolean
          default: false
          title: Ask Inventory On Launch
        ask_credential_on_launch:
          type: boolean
          default: false
          title: Ask Credential On Launch
        ask_variables_on_launch:
          type: boolean
          default: false
          title: Ask Variables On Launch
        ask_limit_on_launch:
          type: boolean
          default: false
          title: Ask Limit On Launch
        ask_tags_on_launch:
          type: boolean
          default: false
          title: Ask Tags On Launch
        ask_skip_tags_on_launch:
          type: boolean
          default: false
          title: Ask Skip Tags On Launch
        ask_verbosity_on_launch:
          type: boolean
          default: false
          title: Ask Verbosity On Launch
        ask_diff_mode_on_launch:
          type: boolean
          default: false
          title: Ask Diff Mode On Launch
        ask_forks_on_launch:
          type: boolean
          default: false
          title: Ask Forks On Launch
        ask_job_slice_count_on_launch:
          type: boolean
          default: false
          title: Ask Job Slice Count On Launch
        ask_execution_environment_on_launch:
          type: boolean
          default: false
          title: Ask Execution Environment On Launch
        ask_instance_groups_on_launch:
          type: boolean
          default: false
          title: Ask Instance Groups On Launch
        ask_labels_on_launch:
          type: boolean
          default: false
          title: Ask Labels On Launch
        ask_timeout_on_launch:
          type: boolean
          default: false
          title: Ask Timeout On Launch
        ask_scm_branch_on_launch:
          type: boolean
          default: false
          title: Ask Scm Branch On Launch
        survey_enabled:
          type: boolean
          default: false
          title: Survey Enabled
        default_inventory:
          anyOf:
            - $ref: "#/components/schemas/AAPSummaryField"
            - type: "null"
          title: Default Inventory
          description: Default inventory from job template summary_fields
        default_execution_environment:
          anyOf:
            - $ref: "#/components/schemas/AAPSummaryField"
            - type: "null"
          title: Default Execution Environment
          description: Default execution environment from job template summary_fields
        default_credentials:
          type: array
          title: Default Credentials
          description: Default credentials from job template summary_fields
          items:
            $ref: "#/components/schemas/AAPSummaryField"
        default_labels:
          type: array
          title: Default Labels
          description: Default labels from job template summary_fields
          items:
            $ref: "#/components/schemas/AAPSummaryField"
        job_type:
          anyOf:
            - $ref: "#/components/schemas/AAPJobType"
            - type: "null"
          description: Default job type - "run" or "check"
        verbosity:
          anyOf:
            - type: integer
              minimum: 0.0
              maximum: 5.0
            - type: "null"
          title: Verbosity
          description: Default verbosity level (0-5)
        forks:
          anyOf:
            - type: integer
              minimum: 0.0
              maximum: 10000.0
