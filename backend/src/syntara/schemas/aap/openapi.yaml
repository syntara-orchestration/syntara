---
openapi: 3.1.0
info:
  title: Syntara Ansible Automation Platform Proxy API
  version: 1.0.0
  description: |
    Backend-for-Frontend proxy that forwards requests to a configured
    Ansible Automation Platform Controller instance.

    Enables the workflow-builder UI to browse Ansible Automation Platform resources
    (organizations, job templates, inventories) via cascading dropdowns
    without direct Ansible Automation Platform Controller access.

    Authentication to the Ansible Automation Platform Controller is resolved server-side from
    environment variables (`APP_AAP_BASE_URL`, `APP_AAP_TOKEN`).

    Note: This API intentionally diverges from standard Nexus response conventions.
    As a BFF proxy, it mirrors the upstream Ansible Automation Platform API shape (count/results, page_size)
    rather than the standard ResourcesResponseBase format.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Ansible Automation Platform
    description: Ansible Automation Platform resource proxy

paths:
  /aap/organizations:
    get:
      summary: List organizations
      description: List Ansible Automation Platform organizations.
      operationId: list_aap_organizations
      x-app-permission:
        resource: null
        action: null
      tags:
        - Ansible Automation Platform
      parameters:
        - in: query
          name: search
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
            title: Search
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            title: Page Size
        - $ref: "#/components/parameters/credentialId"
        - $ref: "#/components/parameters/integrationId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AAPListResponse_AAPOrganization_"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

