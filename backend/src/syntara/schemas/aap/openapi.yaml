  parameters:
    credentialId:
      in: query
      name: credential_id
      required: false
      schema:
        anyOf:
          - type: string
            format: uuid
          - type: "null"
        title: Credential Id
      description: |
        Optional Nexus credential ID for Ansible Automation Platform Controller authentication.
        If provided, the credential is decrypted and used instead of environment variables.
        Credential must be of type "Ansible Automation Platform".
    integrationId:
      in: query
      name: integration_id
      required: false
      schema:
        anyOf:
          - type: string
            format: uuid
          - type: "null"
        title: Integration Id
      description: |
        Optional Ansible Automation Platform Gateway integration ID for connection URL resolution.
        When provided, the integration's configured URL is used instead of environment variables.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
