---
openapi: 3.1.0
info:
  title: Tool Metrics API
  description: API for monitoring tool usage metrics and rate limiting
  version: 1.0.0

servers:
  - url: /api/v1
    description: API server (relative path)

tags:
  - name: Tool Metrics
    description: Tool usage metrics and execution history

# Reference shared resource schemas
x-shared-contracts:
  - path: ../base/shared-resources.openapi.yaml
    namespace: shared

paths:
  /tool_manager/metrics/tools:
    get:
      operationId: get_tool_metrics
      x-app-permission:
        resource: null
        action: null
      summary: Get tool metrics summary
      description: |-
        Return aggregated per-tool metrics summary.

        Supports filtering by namespaced_name and time range.
        Uses UsageCounter for unfiltered queries (fast path) and SQL aggregation
        for time-filtered queries (flexible path).
      parameters:
        - name: namespaced_name
          in: query
          description: Filter by tool namespaced name
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by tool namespaced name
            title: Namespaced Name
        - name: start_time
          in: query
          description: Start of time range (ISO 8601)
          required: false
          schema:
            anyOf:
              - type: string
                format: date-time
              - type: 'null'
            description: Start of time range (ISO 8601)
            title: Start Time
        - name: end_time
          in: query
          description: End of time range (ISO 8601)
          required: false
          schema:
            anyOf:
              - type: string
                format: date-time
              - type: 'null'
            description: End of time range (ISO 8601)
            title: End Time
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolMetricsToolSummaryListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
      tags:
        - Tool Metrics
  /tool_manager/metrics/executions:
    get:
      operationId: get_tool_executions
      x-app-permission:
        resource: null
        action: null
      summary: List tool executions
      description: |-
        Return paginated tool execution history.

        Supports filtering by namespaced_name, status, and time range.
        Uses cursor-based pagination consistent with other Nexus list endpoints.
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: namespaced_name
          in: query
          description: Filter by tool namespaced name
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by tool namespaced name
            title: Namespaced Name
        - name: status
          in: query
          description: Filter by execution status
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/ToolExecutionStatus'
              - type: 'null'
            description: Filter by execution status
            title: Status
        - name: start_time
          in: query
          description: Start of time range (ISO 8601)
          required: false
          schema:
            anyOf:
              - type: string
                format: date-time
              - type: 'null'
            description: Start of time range (ISO 8601)
            title: Start Time
        - name: end_time
          in: query
          description: End of time range (ISO 8601)
          required: false
          schema:
            anyOf:
              - type: string
                format: date-time
              - type: 'null'
            description: End of time range (ISO 8601)
            title: End Time
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecutionListResponse'
        '400':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        '401':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        '403':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        '404':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        '409':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        '422':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        '500':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        '429':
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
      tags:
        - Tool Metrics
components:
  schemas:
    ToolExecutionStatus:
      type: string
      title: ToolExecutionStatus
      description: Status of a tool execution.
      enum:
        - running
        - success
        - error
        - timeout

    ToolExecutionListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ToolExecution'
      title: ToolExecutionListResponse
      description: Paginated list response for tool executions.

    ToolMetricsToolSummary:
      type: object
      title: ToolMetricsToolSummary
      additionalProperties: false
      description: Per-tool aggregated metrics summary for the metrics/tools endpoint.
      required:
        - namespaced_name
        - total_executions
        - success_count
        - error_count
        - timeout_count
        - success_rate
        - avg_duration_ms
      properties:
        namespaced_name:
          type: string
          title: Namespaced Name
          description: Tool identifier (e.g., 'provider::tool')
        total_executions:
          type: integer
          title: Total Executions
          description: Total execution count
        success_count:
          type: integer
          title: Success Count
          description: Successful executions
        error_count:
          type: integer
          title: Error Count
          description: Error executions
        timeout_count:
          type: integer
          title: Timeout Count
          description: Timeout executions
        success_rate:
          type: number
          title: Success Rate
          description: Success rate (0.0 to 1.0)
        avg_duration_ms:
          type: number
          title: Avg Duration Ms
          description: Average execution duration in milliseconds
        last_execution_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Execution At
          description: Timestamp of most recent execution

    ToolMetricsToolSummaryListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ToolMetricsToolSummary'
              description: Array of resources in current page
              title: Resources
      title: ToolMetricsToolSummaryListResponse
      description: Paginated list response for tool metrics summaries.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ

    ToolExecution:
      allOf:
        - $ref: '../base/shared-resources.openapi.yaml#/components/schemas/UserOwnedResource'
        - type: object
          required:
            - user_id
            - execution_start
            - status
            - input_parameters
          properties:
            tool_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Tool Id
              description: Foreign key to Tool
            integration_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              title: Integration Id
              description: Foreign key to Integration (denormalized from tool)
            user_id:
              type: string
              format: uuid
              title: User Id
              description: Identifier of executing user/agent
            execution_start:
              type: string
              format: date-time
              title: Execution Start
              description: Execution start timestamp
            execution_end:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              title: Execution End
              description: Execution completion timestamp
            duration_ms:
              anyOf:
                - type: integer
                  minimum: 0
                - type: 'null'
              title: Duration Ms
              description: Execution duration in milliseconds
            status:
              $ref: '#/components/schemas/ToolExecutionStatus'
              description: Execution status
            input_parameters:
              type: object
              additionalProperties: true
              title: Input Parameters
              description: Tool input parameters
            output_data:
              anyOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
              title: Output Data
              description: Tool output data
            error_message:
              anyOf:
                - type: string
                - type: 'null'
              title: Error Message
              description: Error description for failed executions
            error_code:
              anyOf:
                - type: string
                  maxLength: 100
                - type: 'null'
              title: Error Code
              description: Structured error code
      additionalProperties: false
      title: ToolExecution
      description: |-
        Tool execution records stored in database.

        Records individual Tool executions for performance monitoring and analysis.
        This model matches the ToolExecution schema from the metrics contract.

        Inherits from UserOwnedResource:
            id: UUID primary key
            created_at: Creation timestamp
            updated_at: Last update timestamp
            created_by: UUID of user who created the resource
            updated_by: Optional UUID of user who last updated the resource
            labels: Optional key-value metadata
