---
openapi: 3.0.3
info:
  title: Orchestrator Admin API
  version: 1.0.0
  description: |
    Administrative operations for the Orchestrator platform.

    Provides endpoints for global session revocation, per-user session
    revocation, and per-identity-provider session revocation.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Admin
    description: Administrative revocation operations

paths:
  /admin/revocation:
    get:
      summary: Get global revocation timestamp
      description: Read the current global revocation timestamp. Returns null fields if no revocation has been performed.
      operationId: get_global_revocation_timestamp
      x-app-permission:
        resource: admin:revocation
        action: read
      tags:
        - Admin
      responses:
        "200":
          description: Current global revocation timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalRevocationTimestampRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []
    post:
      summary: Revoke all sessions
      description: Set the global revocation timestamp to the current time. All tokens issued before this time will be rejected.
      operationId: revoke_all_sessions
      x-app-permission:
        resource: admin:revocation
        action: execute
      tags:
        - Admin
      responses:
        "200":
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

  /admin/revocation/users/{username}:
    post:
      summary: Revoke sessions for a user
      description: Revoke all active sessions for a specific user. The user will need to re-authenticate.
      operationId: revoke_user_sessions
      x-app-permission:
        resource: admin:revocation
        action: execute
      tags:
        - Admin
      parameters:
        - name: username
          in: path
          required: true
          schema:
            title: Username
            type: string
          description: Username of the user whose sessions should be revoked
      responses:
        "200":
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          description: User not found
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

  /admin/revocation/identity_providers/{idp_name}:
    post:
      summary: Revoke sessions for an identity provider
      description: Revoke all active sessions authenticated via a specific identity provider. Users who authenticated via this provider will need to re-authenticate.
      operationId: revoke_idp_sessions
      x-app-permission:
        resource: admin:revocation
        action: execute
      tags:
        - Admin
      parameters:
        - name: idp_name
          in: path
          required: true
          schema:
            title: Idp Name
            type: string
          description: Name of the identity provider whose sessions should be revoked
      responses:
        "200":
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          description: Identity provider not found
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
      security:
        - bearerAuth: []

components:
  schemas:
    GlobalRevocationTimestampRead:
      type: object
      title: GlobalRevocationTimestampRead
      description: Response schema for reading the global revocation timestamp.
      properties:
        revoked_before:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Revoked Before
        updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Updated At
        updated_by:
          anyOf:
            - type: string
            - type: "null"
          title: Updated By

    RevocationResponse:
      type: object
      title: RevocationResponse
      description: Response schema for revocation operations.
      required:
        - message
      properties:
        message:
          type: string
          title: Message
        sessions_revoked:
          anyOf:
            - type: integer
            - type: "null"
          title: Sessions Revoked
