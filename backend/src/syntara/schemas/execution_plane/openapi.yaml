---
openapi: 3.1.0
info:
  title: Execution Plane API
  description: Execution Plane operator endpoints — observe execution targets and work items.
  version: 0.1.0
paths:
  /api/execution_plane/v1/execution_targets:
    get:
      tags:
        - Execution Plane
      summary: List execution targets
      description: Retrieve registered execution targets.
      operationId: list_execution_targets
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            exclusiveMinimum: 0
            description: Maximum number of results per page
            default: 20
            title: Limit
          description: Maximum number of results per page
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Pagination cursor from previous response
            title: Cursor
          description: Pagination cursor from previous response
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^-?[a-z][a-z0-9_]*$
              - type: 'null'
            description: Sort parameter (e.g., 'name', '-created_at')
            title: Sort
          description: Sort parameter (e.g., 'name', '-created_at')
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            description: Include total count in response (expensive)
            default: false
            title: Include Total
          description: Include total count in response (expensive)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTargetListResponse'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: execution_target
        action: read
  /api/execution_plane/v1/work_items:
    get:
      tags:
        - Execution Plane
      summary: List work items
      description: Retrieve work items.
      operationId: list_work_items
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            exclusiveMinimum: 0
            description: Maximum number of results per page
            default: 20
            title: Limit
          description: Maximum number of results per page
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Pagination cursor from previous response
            title: Cursor
          description: Pagination cursor from previous response
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^-?[a-z][a-z0-9_]*$
              - type: 'null'
            description: Sort parameter (e.g., 'name', '-created_at')
            title: Sort
          description: Sort parameter (e.g., 'name', '-created_at')
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            description: Include total count in response (expensive)
            default: false
            title: Include Total
          description: Include total count in response (expensive)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemListResponse'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: work_item
        action: read
  /api/execution_plane/v1/events:
    post:
      tags:
        - Execution Plane
      summary: Accept an Execution Plane completion command
      description: Authenticate a completion command and acknowledge it after Temporal delivery.
      operationId: accept_execution_plane_event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageEnvelope'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportReceipt'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: null
        action: null
components:
  schemas:
    Command:
      properties:
        command_id:
          type: string
          format: uuid
          title: Command Id
        parent_command_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Parent Command Id
        command_type:
          type: string
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          title: Command Type
        command_revision:
          type: integer
          exclusiveMinimum: 0.0
          title: Command Revision
        payload:
          additionalProperties: true
          type: object
          title: Payload
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
      additionalProperties: false
      type: object
      required:
        - command_id
        - command_type
        - command_revision
        - payload
        - occurred_at
      title: Command
      description: One versioned operation; participants persist only its domain effects.
    CommandScope:
      properties:
        client_id:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Client Id
      additionalProperties: false
      type: object
      required:
        - client_id
      title: CommandScope
      description: Initiating service client; project authorization belongs to the caller.
    ExecutionTargetFacadeRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        cluster_id:
          type: string
          format: uuid
          title: Cluster Id
        name:
          type: string
          title: Name
        backend_type:
          type: string
          title: Backend Type
        endpoint:
          type: string
          title: Endpoint
        placement:
          oneOf:
            - $ref: '#/components/schemas/KubernetesPlacement'
            - $ref: '#/components/schemas/RHELPlacement'
          title: Placement
          discriminator:
            propertyName: type
            mapping:
              kubernetes: '#/components/schemas/KubernetesPlacement'
              rhel: '#/components/schemas/RHELPlacement'
        status:
          type: string
          title: Status
        enabled:
          type: boolean
          title: Enabled
        is_default:
          type: boolean
          title: Is Default
        status_message:
          anyOf:
            - type: string
            - type: 'null'
          title: Status Message
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
        created_at:
          type: string
          format: date-time
          title: Created At
        last_ran_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Ran At
      type: object
      required:
        - id
        - cluster_id
        - name
        - backend_type
        - endpoint
        - placement
        - status
        - enabled
        - is_default
        - labels
        - created_at
      title: ExecutionTargetFacadeRead
      description: Safe target fields available to AO's authorized management API.
    ExecutionTargetListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ExecutionTargetFacadeRead'
          type: array
          title: Resources
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
        total:
          anyOf:
            - type: integer
            - type: 'null'
          title: Total
      type: object
      required:
        - resources
      title: ExecutionTargetListResponse
      description: Paginated list response for ExecutionTarget.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KubernetesPlacement:
      properties:
        type:
          type: string
          const: kubernetes
          title: Type
        namespace:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          title: Namespace
        node_selectors:
          items:
            type: string
          type: array
          title: Node Selectors
        tolerations:
          items:
            type: string
          type: array
          title: Tolerations
      type: object
      required:
        - type
        - namespace
      title: KubernetesPlacement
      description: Kubernetes scheduling metadata returned by the Execution Plane.
    MessageEnvelope:
      properties:
        message_id:
          type: string
          format: uuid
          title: Message Id
        message_type:
          type: string
          const: command.submit
          title: Message Type
          default: command.submit
        command_id:
          type: string
          format: uuid
          title: Command Id
        sequence:
          type: integer
          minimum: 0.0
          title: Sequence
          default: 0
        source_id:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Source Id
        destination_id:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Destination Id
        scope:
          $ref: '#/components/schemas/CommandScope'
        command:
          $ref: '#/components/schemas/Command'
      additionalProperties: false
      type: object
      required:
        - message_id
        - command_id
        - source_id
        - destination_id
        - scope
        - command
      title: MessageEnvelope
      description: Participant identity around one logical command.
    RHELPlacement:
      properties:
        type:
          type: string
          const: rhel
          title: Type
      type: object
      required:
        - type
      title: RHELPlacement
      description: RHEL placement marker returned by the Execution Plane.
    ResourceReference:
      properties:
        kind:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Kind
        resource_id:
          type: string
          format: uuid
          title: Resource Id
        resource_key:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Resource Key
        revision:
          anyOf:
            - type: integer
              exclusiveMinimum: 0.0
            - type: 'null'
          title: Revision
      additionalProperties: false
      type: object
      required:
        - kind
        - resource_id
      title: ResourceReference
      description: Safe reference from a command to a participant-owned resource.
    TransportReceipt:
      properties:
        received:
          type: boolean
          const: true
          title: Received
          default: true
        message_id:
          type: string
          format: uuid
          title: Message Id
        resource:
          anyOf:
            - $ref: '#/components/schemas/ResourceReference'
            - type: 'null'
      additionalProperties: false
      type: object
      required:
        - message_id
      title: TransportReceipt
      description: Receipt of a handled request, without a persisted command record.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    WorkItemFacadeRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          type: string
          title: Status
        result:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Result
        created_at:
          type: string
          format: date-time
          title: Created At
        claimed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Claimed At
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Completed At
      type: object
      required:
        - id
        - status
        - created_at
      title: WorkItemFacadeRead
      description: Safe work state; internal tokens and storage metadata stay private.
    WorkItemListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/WorkItemFacadeRead'
          type: array
          title: Resources
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
        total:
          anyOf:
            - type: integer
            - type: 'null'
          title: Total
      type: object
      required:
        - resources
      title: WorkItemListResponse
      description: Paginated list response for WorkItem.
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT token authentication
      scheme: bearer
      bearerFormat: JWT
