---
openapi: 3.1.0
info:
  title: Execution Plane API
  description: Execution Plane operator endpoints — observe execution targets and work items.
  version: 0.1.0
paths:
  /api/execution_plane/v1/execution_targets:
    get:
      tags:
        - Execution Plane
      summary: List execution targets
      description: Retrieve registered execution targets.
      operationId: list_execution_targets
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTargetListResponse'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: execution_target
        action: read
  /api/execution_plane/v1/work_items:
    get:
      tags:
        - Execution Plane
      summary: List work items
      description: Retrieve work items.
      operationId: list_work_items
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemListResponse'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: work_item
        action: read
  /api/execution_plane/v1/submit:
    post:
      tags:
        - Execution Plane
      summary: Submit a cold-start execution-plane work item
      description: Queue a JSONL task for execution on a matching registered target.
      operationId: submit_execution_plane_work_item
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemSubmit'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemRead'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearerAuth: []
      x-app-permission:
        resource: work_item
        action: create
components:
  schemas:
    BackendType:
      type: string
      enum:
        - vanilla_k8s
        - openshell
      title: BackendType
      description: Supported execution target backends.
    ExecutionTarget:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        backend_type:
          $ref: '#/components/schemas/BackendType'
        endpoint:
          type: string
          title: Endpoint
        namespace:
          type: string
          title: Namespace
        credential_ref:
          additionalProperties: true
          type: object
          title: Credential Ref
          default: {}
        status:
          $ref: '#/components/schemas/TargetStatus'
          default: registering
        enabled:
          type: boolean
          title: Enabled
          default: true
        labels:
          additionalProperties: true
          type: object
          title: Labels
          default: {}
        created_at:
          type: string
          format: date-time
          title: Created At
        last_ran_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Ran At
      type: object
      required:
        - name
        - backend_type
        - endpoint
        - namespace
        - created_at
      title: ExecutionTarget
      description: A registered compute environment where worker pods run.
    ExecutionTargetListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ExecutionTarget'
          type: array
          title: Resources
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
        total:
          anyOf:
            - type: integer
            - type: 'null'
          title: Total
      type: object
      required:
        - resources
      title: ExecutionTargetListResponse
      description: Paginated list response for ExecutionTarget.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TargetStatus:
      type: string
      enum:
        - registering
        - validating
        - bootstrapping
        - active
        - degraded
        - failed
      title: TargetStatus
      description: Lifecycle states of an execution target.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    WorkItemListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/WorkItemRead'
          type: array
          title: Resources
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
        total:
          anyOf:
            - type: integer
            - type: 'null'
          title: Total
      type: object
      required:
        - resources
      title: WorkItemListResponse
      description: Paginated list response for WorkItem.
    WorkItemRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        work_correlation_id:
          type: string
          format: uuid
          title: Work Correlation Id
        status:
          $ref: '#/components/schemas/WorkItemStatus'
        execution_target_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Execution Target Id
        payload:
          additionalProperties: true
          type: object
          title: Payload
        result:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Result
        created_at:
          type: string
          format: date-time
          title: Created At
        claimed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Claimed At
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Completed At
        signaled_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Signaled At
      type: object
      required:
        - id
        - work_correlation_id
        - status
        - payload
        - created_at
      title: WorkItemRead
      description: Public work-item representation that excludes execution inputs and task tokens.
    WorkItemStatus:
      type: string
      enum:
        - pending
        - claimed
        - dispatched
        - completed
        - failed
        - cancelled
      title: WorkItemStatus
      description: Lifecycle states of a dispatched work item.
    WorkItemSubmit:
      properties:
        work_correlation_id:
          type: string
          format: uuid
          title: Work Correlation Id
        activity_handle:
          anyOf:
            - type: string
            - type: 'null'
          title: Activity Handle
        target_selector:
          additionalProperties: true
          type: object
          title: Target Selector
        task_definition:
          $ref: '#/components/schemas/WorkerTaskDefinition'
      type: object
      required:
        - task_definition
      title: WorkItemSubmit
      description: Direct Task Executor submission request.
    WorkerTaskDefinition:
      properties:
        image:
          type: string
          maxLength: 512
          minLength: 1
          title: Image
        pod_command:
          anyOf:
            - items:
                type: string
              type: array
              maxItems: 32
              minItems: 1
            - type: 'null'
          title: Pod Command
        command:
          items:
            type: string
          type: array
          maxItems: 32
          minItems: 1
          title: Command
        input:
          additionalProperties: true
          type: object
          title: Input
        timeout_seconds:
          type: integer
          maximum: 3600.0
          minimum: 1.0
          title: Timeout Seconds
          default: 120
        image_pull_policy:
          type: string
          title: Image Pull Policy
          default: IfNotPresent
      type: object
      required:
        - image
        - command
        - input
      title: WorkerTaskDefinition
      description: OCI image and JSONL invocation used for a cold-start worker.
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT token authentication
      scheme: bearer
      bearerFormat: JWT
