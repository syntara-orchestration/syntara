        - bearerAuth: []

components:
  parameters:
    projectIdParam:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        title: Project Id
      description: Project UUID
    roleIdParam:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        title: Role Id
      description: Role UUID
    policyIdParam:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        title: Policy Id
      description: Policy UUID
    credentialIdParam:
      name: credential_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        title: Credential Id
      description: Credential UUID

  schemas:
    ProjectCreate:
      type: object
      title: ProjectCreate
      description: Request body for creating a project.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[a-zA-Z0-9]([a-zA-Z0-9:_-]*[a-zA-Z0-9])?$"
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          type: object
          default: {}
          additionalProperties: true
          title: Labels

    ProjectUpdate:
      type: object
      title: ProjectUpdate
      description: Request body for updating a project.
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
              pattern: "^[a-zA-Z0-9]([a-zA-Z0-9:_-]*[a-zA-Z0-9])?$"
            - type: "null"
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        labels:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          title: Labels

    ProjectRead:
      title: ProjectRead
      description: Response body for a project.
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: ProjectRead
          required:
            - name
          properties:
            name:
              type: string
              title: Name
            description:
              anyOf:
                - type: string
                - type: "null"
              title: Description
            is_default:
              type: boolean
              default: false
              title: Is Default
            is_builtin:
              type: boolean
              default: false
              title: Is Builtin


    ProjectListResponse:
      title: ProjectListResponse
      description: Paginated list response for projects.
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              title: Resources
              items:
                $ref: "#/components/schemas/ProjectRead"
              maxItems: 100
              description: Array of resources in current page

    ProjectRoleCreate:
      type: object
      title: ProjectRoleCreate
      description: Request body for creating a project-scoped role (project_id comes from URL path).
      required:
        - name
        - policies
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        policies:
          type: array
          minItems: 1
          items:
            type: string
          title: Policies
        labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          title: Labels

    ProjectPolicyCreate:
      type: object
      title: ProjectPolicyCreate
      description: Request body for creating a project-scoped policy (project_id comes from URL path).
      required:
        - name
        - statements
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        statements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PolicyStatementSchema"
          title: Statements
        labels:
          type: object
          default: {}
          additionalProperties:
            type: string
          title: Labels

    PolicyStatementSchema:
      $ref: "../authz/policy.openapi.yaml#/components/schemas/PolicyStatementSchema"

    PolicyRead:
      $ref: "../authz/policy.openapi.yaml#/components/schemas/PolicyRead"
    PolicyUpdate:
      $ref: "../authz/policy.openapi.yaml#/components/schemas/PolicyUpdate"
    PolicyListResponse:
      $ref: "../authz/policy.openapi.yaml#/components/schemas/PolicyListResponse"
    RoleRead:
      $ref: "../authz/role.openapi.yaml#/components/schemas/RoleRead"
    RoleUpdate:
      $ref: "../authz/role.openapi.yaml#/components/schemas/RoleUpdate"
    RoleListResponse:
      $ref: "../authz/role.openapi.yaml#/components/schemas/RoleListResponse"
      description: Paginated list response for roles.

    WorkflowListResponse:
      $ref: "../workflows/v2/openapi.yaml#/components/schemas/WorkflowListResponse"

    ApprovalListResponse:
      $ref: "../approvals/openapi.yaml#/components/schemas/ApprovalListResponse"

    ApprovalRequestStatus:
      $ref: "../approvals/openapi.yaml#/components/schemas/ApprovalRequestStatus"

    RoleAssignmentCreate:
      $ref: "../authz/role_assignment.openapi.yaml#/components/schemas/RoleAssignmentCreate"
    RoleAssignmentRead:
      $ref: "../authz/role_assignment.openapi.yaml#/components/schemas/RoleAssignmentRead"
    RoleAssignmentListResponse:
      $ref: "../authz/role_assignment.openapi.yaml#/components/schemas/RoleAssignmentListResponse"

    ProjectCredentialCreate:
      type: object
      title: ProjectCredentialCreate
      description: Schema for creating a credential via a project-scoped endpoint (project_id from URL path).
      required:
        - name
        - credential_type_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          title: Name
          description: Human-readable credential name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          title: Description
          description: Optional description
        credential_type_id:
          type: string
          format: uuid
          title: Credential Type Id
          description: ID of the credential type
        inputs:
          type: object
          additionalProperties: true
          title: Inputs
          description: Field values validated against type schema
        labels:
          type: object
          additionalProperties:
            type: string
          title: Labels
          description: Key-value labels

    CredentialRead:
      $ref: "../credentials/openapi.yaml#/components/schemas/CredentialRead"
    CredentialUpdate:
      $ref: "../credentials/openapi.yaml#/components/schemas/CredentialUpdate"
    CredentialListResponse:
      $ref: "../credentials/openapi.yaml#/components/schemas/CredentialListResponse"
    CredentialWorkflowRef:
      $ref: "../credentials/openapi.yaml#/components/schemas/CredentialWorkflowRef"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
