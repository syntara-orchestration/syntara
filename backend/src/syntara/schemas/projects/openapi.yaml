---
openapi: 3.1.0
info:
  title: Syntara Projects API
  version: 1.0.0
  description: |
    Project management and project-scoped resource access for the Syntara platform.

    Projects provide multi-tenant isolation for workflows, approvals, and other
    resources. Each project has its own role assignments for users and groups,
    and supports project-scoped roles and policies.

    ## Key Features
    - Project CRUD with soft deletion
    - Project-scoped workflow and approval listing
    - User role assignments (project-admin, project-user, project-auditor)
    - Group role assignments with inherited membership
    - Project-scoped role and policy CRUD

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Projects
    description: Project CRUD and project-scoped resource operations

paths:
  # ── Project CRUD ─────────────────────────────────────────────────────
  /projects:
    post:
      summary: Create project
      description: |
        Create a new project.

        The creator is automatically assigned the project-admin role.

        Requires: project:create permission.
      operationId: create_project
      x-app-permission:
        resource: project
        action: create
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    get:
      summary: List projects
      description: |-
        List projects the current user has read access to.
      operationId: list_projects
      x-app-permission:
        resource: project
        action: read
      tags:
        - Projects
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Name
          description: Filter by project name
        - name: is_default
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Is Default
          description: Filter by default project status
        - name: is_builtin
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Is Builtin
          description: Filter by built-in project status
      responses:
        "200":
          description: Paginated list of accessible projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /projects/{project_id}:
    get:
      summary: Get project
      description: Get a project by ID.
      operationId: get_project
      x-app-permission:
        resource: project
        action: read
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    patch:
      summary: Update project
      description: |-
        Patch a project. Requires: project:update permission scoped to this project.
      operationId: update_project
      x-app-permission:
        resource: project
        action: update
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    put:
      summary: Replace project
      description: |-
        Replace a project. Requires: project:update permission scoped to this project.
      operationId: replace_project
      x-app-permission:
        resource: project
        action: update
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    delete:
      summary: Delete project
      description: |-
        Delete a project (soft-delete). Requires: project:delete permission scoped to this project.
      operationId: delete_project
      x-app-permission:
        resource: project
        action: delete
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      responses:
        "204":
          description: Project deleted
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

  # ── Project Workflows ────────────────────────────────────────────────
  /projects/{project_id}/workflows:
    get:
      summary: List project workflows
      description: |-
        List workflows belonging to a specific project.

        Returns only workflows with project_id matching the given project.
        Requires: workflow:read permission scoped to this project.
      operationId: list_project_workflows
      x-app-permission:
        resource: workflow
        action: read
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
      responses:
        "200":
          description: Paginated list of workflows in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

  # ── Project Approvals ────────────────────────────────────────────────
  /projects/{project_id}/approvals:
    get:
      summary: List project approvals
      description: |-
        List approval requests belonging to a specific project.

        Returns only approvals with project_id matching the given project.
        Requires: approval:read permission scoped to this project.
      operationId: list_project_approvals
      x-app-permission:
        resource: approval
        action: read
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/ApprovalRequestStatus"
              - type: 'null'
            title: Status
          description: Filter by approval status
        - name: execution_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Execution Id
          description: Filter by parent workflow execution ID
      responses:
        "200":
          description: Paginated list of approvals in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

  # ── Project Role Assignments ─────────────────────────────────────────
  /projects/{project_id}/role_assignments:
    post:
      summary: Create project role assignment
      description: |-
        Assign a role to a user or group within a project.
      operationId: create_project_role_assignment
      x-app-permission:
        resource: role-assignment
        action: assign
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentCreate"
      responses:
        "201":
          description: Role assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    get:
      summary: List project role assignments
      description: |-
        List role assignments for a project with policy-driven visibility.

        Users with ``role-assignment:read:any`` see all assignments in the project.
        Users with ``role-assignment:read:project`` for this project see all.
        Users with ``role-assignment:read:self`` see only their own (direct and via groups).
      operationId: list_project_role_assignments
      x-app-permission:
        resource: role-assignment
        action: read
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: principal_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Principal Id
          description: Filter by principal ID (user or service account)
        - name: group_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Group Id
          description: Filter by group ID
        - name: principal_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Principal Name
        - name: role_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Role Name
      responses:
        "200":
          description: List of role assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /projects/{project_id}/role_assignments/{assignment_id}:
    delete:
      summary: Delete project role assignment
      description: |-
        Remove a role assignment from a project.
      operationId: delete_project_role_assignment
      x-app-permission:
        resource: role-assignment
        action: revoke
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Assignment Id
          description: Assignment UUID
      responses:
        "204":
          description: Assignment removed
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []

  # ── Project Roles (CRUD) ────────────────────────────────────────────
  /projects/{project_id}/roles:
    post:
      summary: Create project role
      description: |-
        Create a role scoped to this project. Requires: role:create permission.
      operationId: create_project_role
      x-app-permission:
        resource: role
        action: create
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRoleCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    get:
      summary: List project roles
      description: |-
        List roles visible within this project.

        Includes project-owned roles and global roles with scope "project".
      operationId: list_project_roles
      x-app-permission:
        resource: role
        action: read
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            anyOf:
              - format: uuid
                type: string
              - type: 'null'
            title: Project Id
          description: Project UUID
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Name
          description: Filter by role name
        - name: is_builtin
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Is Builtin
          description: Filter by builtin status
        - name: scope
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Scope
          description: Filter by scope
        - name: policy_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Policy Name
          description: Filter by policy name
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /projects/{project_id}/roles/{role_id}:
    get:
      summary: Get project role
      description: Get a single role, verifying it belongs to this project.
      operationId: get_project_role
      x-app-permission:
        resource: role
        action: read
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/projectIdParam"
        - $ref: "#/components/parameters/roleIdParam"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
