    InitialModelSelection:
      $ref: ./openapi.yaml#/components/schemas/InitialModelSelection
    InitialToolSelection:
      $ref: ./openapi.yaml#/components/schemas/InitialToolSelection
    IntegrationCreateV2:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Human-readable name for the integration
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          title: Description
          description: Detailed description of the integration
        integration_type:
          $ref: '#/components/schemas/IntegrationTypeV2'
          description: Type of external integration
        configuration:
          oneOf:
            - $ref: '#/components/schemas/MCPServerConfigurationInput'
            - $ref: '#/components/schemas/LLMProviderConfiguration'
            - $ref: '#/components/schemas/AAPConfiguration'
            - $ref: '#/components/schemas/KafkaConfiguration'
          title: Configuration
          description: Integration-specific configuration
          discriminator:
            propertyName: integration_type
            mapping:
              ansible_automation_platform: '#/components/schemas/AAPConfiguration'
              kafka: '#/components/schemas/KafkaConfiguration'
              llm_provider: '#/components/schemas/LLMProviderConfiguration'
              mcp_server: '#/components/schemas/MCPServerConfigurationInput'
        management_credential_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Management Credential Id
          description: Optional credential for admin operations
        enabled:
          type: boolean
          title: Enabled
          description: Whether the integration is active
          default: true
        scope:
          $ref: '#/components/schemas/IntegrationScope'
          description: 'Visibility scope: global or project'
          default: global
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Key-value labels
        discovered_tools:
          anyOf:
            - items:
                $ref: '#/components/schemas/InitialToolSelection'
              type: array
              maxItems: 200
            - type: 'null'
          title: Discovered Tools
          description: Tools discovered during setup with enabled/disabled selections
        discovered_models:
          anyOf:
            - items:
                $ref: '#/components/schemas/InitialModelSelection'
              type: array
            - type: 'null'
          title: Discovered Models
          description: Models discovered during setup with enabled/disabled selections
      additionalProperties: false
      type: object
      required:
        - name
        - integration_type
        - configuration
      title: IntegrationCreateV2
      description: Schema for creating a new integration.
    IntegrationListResponseV2:
      properties:
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
          description: Cursor for next page of results
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
          description: Cursor for previous page of results
        total:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Total
          description: Total count of resources (only when include_total=true)
        resources:
          items:
            $ref: '#/components/schemas/IntegrationReadV2'
          type: array
          maxItems: 100
          title: Resources
          description: Array of resources in current page
      type: object
      required:
        - resources
      title: IntegrationListResponseV2
      description: Paginated list response for integrations.
      examples:
        - next: eyJpZCI6InV1aWQifQ
          total: 150
        - next: eyJpZCI6Im5leHQifQ
          prev: eyJpZCI6InByZXYifQ
