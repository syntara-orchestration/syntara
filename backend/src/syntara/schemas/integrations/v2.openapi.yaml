        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: update
  /integrations/{integration_id}/projects:
    get:
      tags:
        - Integrations
      summary: List integration projects
      description: List project assignments for an integration.
      operationId: v2_list_integration_projects
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
