---
openapi: 3.1.0
info:
  title: Syntara Integrations API v2
  version: 2.0.0
servers:
  - url: /api/v2
paths:
  /integrations:
    post:
      tags:
        - Integrations
      summary: Create integration
      description: Create a new integration.
      operationId: v2_create_integration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCreateV2'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationReadV2'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: create
    get:
      tags:
        - Integrations
      summary: List integrations
      description: List integrations with filtering and pagination.
      operationId: v2_list_integrations
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            exclusiveMinimum: 0
            description: Maximum number of results per page
            default: 20
            title: Limit
          description: Maximum number of results per page
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Pagination cursor from previous response
            title: Cursor
          description: Pagination cursor from previous response
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^-?[a-z][a-z0-9_]*$
              - type: 'null'
            description: Sort parameter (e.g., 'name', '-created_at')
            title: Sort
          description: Sort parameter (e.g., 'name', '-created_at')
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            description: Include total count in response (expensive)
            default: false
            title: Include Total
          description: Include total count in response (expensive)
        - name: integration_type
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/IntegrationTypeV2'
              - type: 'null'
            description: Filter by integration type
            title: Integration Type
          description: Filter by integration type
        - name: validation_status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/IntegrationStatus'
              - type: 'null'
            description: Filter by validation status
            title: Validation Status
          description: Filter by validation status
        - name: enabled
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            description: Filter by enabled status
            title: Enabled
          description: Filter by enabled status
        - name: scope
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/IntegrationScope'
              - type: 'null'
            description: Filter by visibility scope
            title: Scope
          description: Filter by visibility scope
        - name: management_credential_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            description: Filter by management credential ID
            title: Management Credential Id
          description: Filter by management credential ID
        - name: project_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            description: Filter to integrations that are global or assigned to this project. Restricted to projects the user has RBAC access to; querying inaccessible projects returns only global integrations.
            title: Project Id
          description: Filter to integrations that are global or assigned to this project. Restricted to projects the user has RBAC access to; querying inaccessible projects returns only global integrations.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationListResponseV2'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: read
  /integrations/{integration_id}:
    get:
      tags:
        - Integrations
      summary: Get integration
      description: Get an integration by ID.
      operationId: v2_get_integration
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationReadV2'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: read
    patch:
      tags:
        - Integrations
      summary: Update integration
      description: Update an integration.
      operationId: v2_update_integration
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationUpdateV2'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationReadV2'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: update
    delete:
      tags:
        - Integrations
      summary: Delete integration
      description: Delete an integration.
      operationId: v2_delete_integration
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      responses:
        '204':
          description: Successful Response
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: delete
  /integrations/discover:
    post:
      tags:
        - Integrations
      summary: Discover integration connection
      description: |-
        Test a connection and discover resources without saving an integration.

        Accepts integration configuration and a credential ID, resolves the
        credential, runs the adapter's discover() method, and returns the result
        including discovered tools (with parameters) or models. No integration
        is persisted.
      operationId: v2_discover_integration_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationTestConnectionV2'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverResult'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      security:
        - bearerAuth: []
      x-app-permission:
        resource: integration
        action: discover
  /integrations/{integration_id}/validate:
    post:
      tags:
        - Integrations
      summary: Validate integration
      description: |-
        Validate a saved integration with a lightweight connectivity ping.

        Resolves the management credential, dispatches to the type-specific
        adapter's validate() method, updates the integration's status fields,
        and returns the result. No tool sync is performed.
      operationId: v2_validate_integration
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResult'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: validate
  /integrations/{integration_id}/refresh:
    post:
      tags:
        - Integrations
      summary: Refresh resources
      description: |-
        Sync resources (tools) for a saved integration from the external service.

        Connects to the MCP server, fetches the current tool list, and upserts
        Tool records in the database. Updates refresh_status and last_refreshed_at
        on the integration. Only supported for mcp_server integration types.
      operationId: v2_refresh_resources
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: refresh
  /integrations/{integration_id}/projects/{project_id}:
    post:
      tags:
        - Integrations
      summary: Assign integration project
      description: Assign a project to a project-scoped integration.
      operationId: v2_assign_integration_project
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationProjectAssignmentRead'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/NotFoundError
        '409':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ConflictError
        '422':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ValidationError
        '429':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/RateLimitError
        '500':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/InternalServerError
      x-app-permission:
        resource: integration
        action: update
    delete:
      tags:
        - Integrations
      summary: Unassign integration project
      description: Remove a project assignment from an integration.
      operationId: v2_unassign_integration_project
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      responses:
        '204':
          description: Successful Response
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError
        '404':
