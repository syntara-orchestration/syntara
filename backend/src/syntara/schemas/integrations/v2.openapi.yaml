        resource: llm_model
        action: read
  /integrations/{integration_id}/models/bulk_update:
    patch:
      tags:
        - Integrations
      summary: Bulk update integration models
      description: Bulk enable/disable LLM models.
      operationId: v2_bulk_update_integration_models
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMModelBulkUpdate'
      responses:
        '200':
