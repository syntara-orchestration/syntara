            - type: 'null'
          description: 'Visibility scope: global or project'
        labels:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: 'null'
          title: Labels
          description: Key-value labels
      additionalProperties: false
      type: object
      title: IntegrationUpdateV2
      description: Schema for partially updating an integration (user-facing).
    KafkaConfiguration:
      properties:
        allow_http:
          type: boolean
          title: Allow Http
          description: Allow HTTP (unencrypted) connections. Loopback addresses are always permitted over HTTP.
          default: false
        insecure_skip_tls_verify:
          type: boolean
          title: Insecure Skip Tls Verify
          description: Disable TLS certificate verification for connections to this integration.
          default: false
        ca_certificate:
          anyOf:
            - type: string
            - type: 'null'
          title: Ca Certificate
          description: PEM-encoded CA certificate to trust for this integration's TLS connections.
        integration_type:
          type: string
          const: kafka
          title: Integration Type
          default: kafka
        bootstrap_servers:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 1
          title: Bootstrap Servers
          description: Kafka bootstrap servers as host:port (or [ipv6]:port) values.
        security_protocol:
          $ref: '#/components/schemas/KafkaSecurityProtocol'
          description: 'Kafka transport: SASL_SSL, SSL, or explicitly opted-in PLAINTEXT.'
          default: SASL_SSL
        allow_plaintext:
          type: boolean
          title: Allow Plaintext
          description: Explicitly allow unauthenticated, unencrypted PLAINTEXT connections.
          default: false
        sasl_mechanism:
          $ref: '#/components/schemas/KafkaSaslMechanism'
          description: SASL mechanism for the username and password on the linked credential.
          default: SCRAM-SHA-256
      additionalProperties: false
      type: object
      required:
        - bootstrap_servers
      title: KafkaConfiguration
      description: |-
        Configuration for a Kafka cluster integration.

        Broker addresses live here. The username and password stay on the
        linked Kafka credential when SASL_SSL is selected. Unauthenticated SSL
        and explicitly opted-in PLAINTEXT do not require a credential.
    KafkaSaslMechanism:
      type: string
      enum:
        - PLAIN
        - SCRAM-SHA-256
        - SCRAM-SHA-512
      title: KafkaSaslMechanism
      description: |-
        SASL mechanism used with the Kafka credential username and password.

        Cloud brokers such as Aiven use SCRAM-SHA-256. PLAIN remains available
        for clusters that authenticate that way.
    KafkaSecurityProtocol:
      type: string
      enum:
        - PLAINTEXT
        - SSL
        - SASL_SSL
      title: KafkaSecurityProtocol
      description: Transport modes that decide whether a Kafka credential is required.
