          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Pagination cursor from previous response
            title: Cursor
          description: Pagination cursor from previous response
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^-?[a-z][a-z0-9_]*$
              - type: 'null'
            description: Sort parameter (e.g., 'name', '-created_at')
            title: Sort
          description: Sort parameter (e.g., 'name', '-created_at')
        - name: include_total
          in: query
          required: false
          schema:
