            - type: string
              maxLength: 255
              minLength: 1
            - type: 'null'
          title: Name
          description: Human-readable name for the integration
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          title: Description
          description: Detailed description of the integration
        configuration:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/MCPServerConfigurationInput'
                - $ref: '#/components/schemas/LLMProviderConfiguration'
                - $ref: '#/components/schemas/AAPConfiguration'
                - $ref: '#/components/schemas/KafkaConfiguration'
              discriminator:
                propertyName: integration_type
                mapping:
                  ansible_automation_platform: '#/components/schemas/AAPConfiguration'
                  kafka: '#/components/schemas/KafkaConfiguration'
                  llm_provider: '#/components/schemas/LLMProviderConfiguration'
                  mcp_server: '#/components/schemas/MCPServerConfigurationInput'
            - type: 'null'
          title: Configuration
          description: Integration-specific configuration
        management_credential_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
