        action: update
  /integrations/{integration_id}/models/{model_id}:
    get:
      tags:
        - Integrations
      summary: Get integration model
      description: Get an LLM model by ID.
      operationId: v2_get_integration_model
      security:
        - bearerAuth: []
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Integration Id
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMModelRead'
        '400':
