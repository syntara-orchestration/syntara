        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Pagination cursor from previous response
            title: Cursor
          description: Pagination cursor from previous response
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^-?[a-z][a-z0-9_]*$
              - type: 'null'
            description: Sort parameter (e.g., 'created_at', '-created_at')
            title: Sort
          description: Sort parameter (e.g., 'created_at', '-created_at')
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
            description: Include total count in response (expensive)
            default: false
            title: Include Total
          description: Include total count in response (expensive)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationProjectAssignmentListResponse'
        '400':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/BadRequestError
        '401':
          $ref: ../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError
        '403':
