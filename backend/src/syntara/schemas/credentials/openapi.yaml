---
openapi: 3.1.0
info:
  title: Syntara Credentials API
  description: |
    REST API for managing Credentials and Credential Types.

    Credentials are encrypted authentication resources used by workflows,
    chat, and agentic orchestration. Each credential references a Credential
    Type that defines its field schema and injection patterns.

    ## Key Features
    - CRUD operations for Credentials with AES-256-GCM encryption at rest
    - Read-only access to preseeded Credential Types (GA)
    - Secret field masking ($encrypted$) in API responses
    - Partial updates with $encrypted$ sentinel preservation
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Credentials
    description: Encrypted credential management

paths:
  /credentials:
    get:
      summary: List credentials
      description: |-
        List Credentials with filtering and pagination. Metadata only, no secrets.

        When for_action=use, returns only credentials the user has credential:use
        permission on (for workflow builder credential selection).
      operationId: list_credentials
      tags:
        - Credentials
      x-app-permission:
        resource: credential
        action: read
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: credential_type_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            description: Filter by credential type ID
            title: Credential Type Id
          description: Filter by credential type ID
        - name: enabled
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            description: Filter by enabled status
            title: Enabled
          description: Filter by enabled status
        - name: for_action
          in: query
          required: false
          schema:
            anyOf:
              - const: use
                type: string
              - type: "null"
            title: For Action
          description: "Filter by permission action. When 'use', returns only credentials with credential:use permission."
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    post:
      summary: Create credential
      description: |-
        Create a new Credential with encrypted inputs.
      operationId: create_credential
      tags:
        - Credentials
      x-app-permission:
        resource: credential
        action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /credentials/{credential_id}:
    get:
      summary: Get credential
      description: |-
        Get a Credential. Secret fields masked as $encrypted$.
      operationId: get_credential
      tags:
        - Credentials
      x-app-permission:
        resource: credential
        action: read
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Credential Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    patch:
      summary: Update credential
      description: |-
        Update a Credential. Fields set to $encrypted$ retain existing values.
      operationId: update_credential
      tags:
        - Credentials
      x-app-permission:
        resource: credential
        action: update
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Credential Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdate"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
    delete:
      summary: Delete credential
      description: Delete a Credential.
      operationId: delete_credential
      tags:
        - Credentials
      x-app-permission:
        resource: credential
        action: delete
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Credential Id
      responses:
        "204":
          description: Successful Response
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /credentials/{credential_id}/workflows:
    get:
      summary: Get credential workflows
      description: |-
        Get workflows that reference this credential.

        Returns workflows with nodes that have credential_id in their executor configs.
      operationId: get_credential_workflows
      tags:
        - Credentials
      x-app-permission:
        resource: credential
        action: read
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Credential Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialWorkflowListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /credential_types:
    get:
      summary: List credential types
      description: |-
        List all Credential Types including preseeded managed types.

        Each type includes a credential_count of credentials using it.
      operationId: list_credential_types
      tags:
        - Credentials
      x-app-permission:
        resource: null
        action: null
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialTypeListResponse"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
  /credential_types/{credential_type_id}:
    get:
      summary: Get credential type
      description: |-
        Get a single Credential Type with credential_count.
      operationId: get_credential_type
      tags:
        - Credentials
      x-app-permission:
        resource: null
        action: null
      parameters:
        - name: credential_type_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Credential Type Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialTypeRead"
        "400":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "500":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
        "429":
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"

      security:
        - bearerAuth: []
components:
  schemas:
    CredentialListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/CredentialRead'
              title: Resources
              description: Array of resources in current page
      title: CredentialListResponse
      description: Paginated list response for credentials.

    CredentialTypeListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/CredentialTypeRead'
              title: Resources
              description: Array of resources in current page
      title: CredentialTypeListResponse
      description: Paginated list response for credential types.

    CredentialWorkflowListResponse:
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ResourcesResponseBase"
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/CredentialWorkflowRef'
              title: Resources
              description: Array of resources in current page
      title: CredentialWorkflowListResponse
      description: Paginated list response for credential workflow references.

    CredentialCreate:
      description: Schema for creating a new credential.
      properties:
        credential_type_id:
          description: ID of the credential type
          format: uuid
          title: Credential Type Id
          type: string
        description:
          anyOf:
            - maxLength: 2000
              type: string
            - type: "null"
          description: Optional description
          title: Description
        inputs:
          additionalProperties: true
          description: Field values validated against type schema
          title: Inputs
          type: object
        labels:
          additionalProperties:
            type: string
          description: Key-value labels
          title: Labels
          type: object
        name:
          description: Human-readable credential name
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        project_id:
          description: Project to assign credential to
          format: uuid
          title: Project Id
          type: string
      required:
        - name
        - credential_type_id
        - project_id
      title: CredentialCreate
      type: object

    CredentialUpdate:
      description: Schema for partially updating a credential. $encrypted$ preserves existing values.
      properties:
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        enabled:
          anyOf:
            - type: boolean
            - type: "null"
          title: Enabled
        inputs:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Inputs
        labels:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: "null"
          title: Labels
        name:
          anyOf:
            - maxLength: 255
              minLength: 1
              type: string
            - type: "null"
          title: Name
        project_id:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          description: Project ID (immutable after creation; rejected if different from stored value)
          title: Project Id
      title: CredentialUpdate
      type: object

    CredentialRead:
      description: Schema for credential API responses. Secret fields masked as $encrypted$.
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/NamedResource"
        - type: object
          title: CredentialRead
          required:
            - credential_type_id
            - project_id
          properties:
            created_by:
              anyOf:
                - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/UserReference"
                - type: "null"
              description: User who created the credential
              readOnly: true
              title: Created By
            updated_by:
              anyOf:
                - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/UserReference"
                - type: "null"
              description: User who last modified the credential
              readOnly: true
              title: Updated By
            credential_type_id:
              format: uuid
              title: Credential Type Id
              type: string
            enabled:
              default: true
              title: Enabled
              type: boolean
            inputs:
              additionalProperties: true
              title: Inputs
              type: object
            project_id:
              format: uuid
              title: Project Id
              type: string
            workflow_count:
              default: 0
              description: Number of workflows referencing this credential
              title: Workflow Count
              type: integer
            integration_count:
              default: 0
              description: Number of integrations using this credential
              title: Integration Count
              type: integer

    CredentialTypeRead:
      description: Read schema for credential type API responses.
      additionalProperties: false
      allOf:
        - $ref: "../base/shared-resources.openapi.yaml#/components/schemas/BaseResource"
        - type: object
          title: CredentialTypeRead
          required:
            - name
          properties:
            name:
              title: Name
              type: string
            description:
              anyOf:
                - type: string
                - type: "null"
              title: Description
            credential_count:
              default: 0
              description: Number of credentials using this type
              title: Credential Count
              type: integer
            injectors:
              additionalProperties: true
              title: Injectors
              type: object
            inputs:
              additionalProperties: true
              title: Inputs
              type: object
            managed:
              default: false
              title: Managed
              type: boolean

    CredentialWorkflowRef:
      description: Reference to a workflow that uses a credential.
      properties:
        created_by:
          anyOf:
            - type: string
            - format: uuid
              type: string
            - type: "null"
          description: Username or UUID of the workflow creator
          title: Created By
        created_at:
          anyOf:
            - format: date-time
              type: string
            - type: "null"
          description: Timestamp when the workflow was created
          title: Created At
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        last_execution_at:
          anyOf:
            - format: date-time
              type: string
            - type: "null"
          description: Timestamp of the most recent execution
          title: Last Execution At
        last_execution_status:
          anyOf:
            - type: string
            - type: "null"
          description: Status of the most recent execution
          title: Last Execution Status
        name:
          title: Name
          type: string
        node_names:
          description: Names of nodes using this credential
          items:
            type: string
          title: Node Names
          type: array
      required:
        - id
        - name
      title: CredentialWorkflowRef
      type: object

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - bearerAuth: []
