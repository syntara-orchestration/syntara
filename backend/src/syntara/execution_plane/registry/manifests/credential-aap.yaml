---
apiVersion: syntara.io/v1alpha1
kind: CredentialRecipe
metadata:
  name: aap-credential
  displayName: AAP Integration Credential
  description: Token or basic authentication for the AAP gateway.
spec:
  id: syntara.aap.credential
  integrationType: syntara.aap
  # The accepted credential shapes mirror the in-process adapter's
  # resolve_aap_auth / get_aap_auth_from_credentials (oauth token, or
  # username + password — token wins over basic auth). The final recipe is
  # coordinated with the step-types compatibility work before release.
  credentialSchema:
    kind: inline
    value:
      type: object
      oneOf:
        - required: [token]
        - required: [username, password]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          description: Bearer or OAuth token for the AAP gateway.
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
  secretFields: [token, password]
  issuance:
    kind: static-bearer.v1
