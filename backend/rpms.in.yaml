---
contentOrigin:
  repofiles:
    - repositories/ubi-9.repo
packages:
  - name: libatomic
  - name: python3.12
  - name: python3.12-pip
  - name: python3.12-cffi
  - name: openblas-serial
  - name: libgomp
context:
  containerfile:
    file: containers/syntara/Containerfile
arches:
  - x86_64
  - aarch64
upgradePackages:
  - name: libatomic
    arches:
      only:
        - aarch64
installWeakDeps: false
