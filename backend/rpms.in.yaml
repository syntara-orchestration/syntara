---
contentOrigin:
  repofiles:
    - repositories/ubi-9.repo
packages:
  - name: libatomic
  - name: python3.12
  - name: python3.12-pip
  - name: python3.12-cffi
  - name: openblas-serial
  - name: libgomp
context:
  containerfile:
    file: containers/syntara/Containerfile
arches:
  - x86_64
  - aarch64
# NOTE: do not add libatomic (or anything else that is absent from the
# ubi9/ubi-minimal base image) to `upgradePackages`. rpm-lockfile-prototype
# resolves the context from the *last* stage of the Containerfile, and
# `upgradePackages` maps to `dnf upgrade`, which raises
# PackagesNotInstalledError for packages the base image does not already have.
# The `packages:` entry above is enough to pin libatomic on both arches.
installWeakDeps: false
