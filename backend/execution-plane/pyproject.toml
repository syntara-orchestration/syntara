[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execution-plane"
version = "0.1.0"
description = "Syntara Execution Plane — Task Executor service and worker management"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.135.0",
    "sqlmodel>=0.0.22",
    "structlog>=24.0.0",
    "temporalio>=1.7.0",
    "uvicorn[standard]>=0.47.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/execution_plane"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/execution_plane",
    "README.md",
]

[project.scripts]
execution-plane-worker = "execution_plane.worker:main"

[tool.uv.sources]
# no cross-package deps yet; add syntara here if needed for credential resolution
