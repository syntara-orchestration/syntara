---
schema_version: "2.0.0"
name: data-pipeline
description: Data transformation pipeline with mixed executors

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_data
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/data

  - id: process_data
    type: script
    parameters:
      language: python
      environment:
        INPUT_RAW_DATA: ${fetch_data.body}
      code: |
        import json
        import os

        raw_data = os.getenv('INPUT_RAW_DATA', '{}')
        processed = {"processed": True, "original": raw_data}
        print(json.dumps(processed))

  - id: validate_data
    type: script
    parameters:
      language: bash
      environment:
        INPUT_VALIDATED: ${process_data.stdout_json.processed}
      code: |
        # Validation check
        if [ "${INPUT_VALIDATED}" = "true" ]; then
          echo "Validation passed"
          exit 0
        else
          echo "Validation passed anyway"
          exit 0
        fi

  - id: send_results
    type: http_request
    parameters:
      method: POST
      url: http://test-api.example.com/api/create
      body:
        validated: true
        data: ${process_data.stdout_json.processed}
edges:
  - from: fetch_data
    to: process_data
  - from: process_data
    to: validate_data
  - from: validate_data
    to: send_results
