---
schema_version: "2.0.0"
name: loop-mixed-types
description: Loop execution with alternating executor types

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: process_items
    type: loop
    loop:
      type: forEach
      items: ${trigger.items}
      itemVariable: item
      indexVariable: index

  - id: process_item
    type: script
    parameters:
      language: python
      code: |
        import os
        item = os.getenv('INPUT_ITEM', '')
        index = os.getenv('INPUT_INDEX', '0')
        print(f"Processing item {item} at index {index}")
edges:
  - from: process_items
    to: process_item
    port: body
