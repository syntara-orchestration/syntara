---
schema_version: "2.0.0"
name: parallel-mixed-types
description: Parallel execution with bash, python, and api activities

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: parallel_mixed_fork
    type: fork

  - id: bash_branch
    type: script
    parameters:
      language: bash
      code: |
        echo "Bash branch executed"

  - id: python_branch
    type: script
    parameters:
      language: python
      code: |
        print("Python branch executed")

  - id: api_branch
    type: http_request
    parameters:
      method: GET
      url: http://test-api.example.com/api/data

  - id: parallel_mixed_join
    type: join
edges:
  - from: parallel_mixed_fork
    to: bash_branch
  - from: parallel_mixed_fork
    to: python_branch
  - from: parallel_mixed_fork
    to: api_branch
  - from: bash_branch
    to: parallel_mixed_join
  - from: python_branch
    to: parallel_mixed_join
  - from: api_branch
    to: parallel_mixed_join
