---
schema_version: "2.0.0"
name: multi-branch-condition-test
description: Test condition with multiple activities in then/else branches

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: score_evaluation
    name: Evaluate Score
    type: condition
    condition: ${trigger.score} >= 60

  - id: pass_notification
    name: Pass Notification
    type: script
    parameters:
      language: bash
      code: |
        echo "Congratulations! You passed the test."

  - id: certificate
    name: Generate Certificate
    type: script
    parameters:
      language: bash
      code: |
        echo "Certificate generated"
        echo "Grade: PASS"

  - id: fail_notification
    name: Fail Notification
    type: script
    parameters:
      language: bash
      code: |
        echo "Sorry, you did not pass the test."

  - id: retry_info
    name: Retry Information
    type: script
    parameters:
      language: bash
      code: |
        echo "You can retake the test after 30 days"
        echo "Study materials: /path/to/materials"
edges:
  - from: score_evaluation
    to: pass_notification
    port: then
  - from: pass_notification
    to: certificate
  - from: score_evaluation
    to: fail_notification
    port: else
  - from: fail_notification
    to: retry_info
