---
schema_version: "2.0.0"
name: basic-condition-test
description: Test condition activity type with then/else branches

inputs:
  age:
    type: integer
    description: Person's age
    default: 25

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: age_check
    name: Check Age
    type: condition
    condition: ${trigger.age} >= 18

  - id: adult_message
    name: Adult Message
    type: script
    parameters:
      language: bash
      code: |
        echo "You are an adult (age >= 18)"
        echo "Access granted"
    outputs:
      message: $.stdout

  - id: minor_message
    name: Minor Message
    type: script
    parameters:
      language: bash
      code: |
        echo "You are a minor (age < 18)"
        echo "Access denied"
    outputs:
      message: $.stdout
edges:
  - source: age_check
    target: adult_message
    port: then
  - source: age_check
    target: minor_message
    port: else
