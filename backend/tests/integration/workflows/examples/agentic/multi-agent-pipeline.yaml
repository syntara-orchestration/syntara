---
schema_version: "2.0.0"
name: multi-agent-pipeline
description: Sequential agentic tasks with different specialized agents
metadata:
  tags:
    - agentic
    - multi-agent
    - pipeline
triggers:
  - id: trigger_manual
    type: manual_trigger

inputs:
  topic:
    type: string
    description: Topic for research and analysis pipeline
    default: emerging technology trends

nodes:
  - id: research_phase
    type: agentic
    parameters:
      agent: production://research-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Research the topic: ${trigger.topic}

        Focus on:
        - Current state and recent developments
        - Key players and stakeholders
        - Important statistics and data points
    inputs:
      topic: ${trigger.topic}
    outputs:
      research_data: $.result.data
      sources: $.result.sources

  - id: analysis_phase
    type: agentic
    parameters:
      agent: production://analysis-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Analyze the following research data and identify key insights:

        ${research_phase.output.research_data}

        Provide:
        - Trend analysis
        - Risk assessment
        - Opportunity identification
    inputs:
      research_data: ${research_phase.output.research_data}
    outputs:
      insights: $.result.content
      trends: $.result.content
      risks: $.result.content

  - id: recommendation_phase
    type: agentic
    parameters:
      agent: production://strategy-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Based on the analysis, provide strategic recommendations:

        Insights: ${analysis_phase.output.insights}
        Trends: ${analysis_phase.output.trends}
        Risks: ${analysis_phase.output.risks}

        Provide:
        - Top 3 strategic recommendations
        - Implementation roadmap
        - Success metrics
    inputs:
      insights: ${analysis_phase.output.insights}
      trends: ${analysis_phase.output.trends}
    outputs:
      recommendations: $.result.recommendations
      roadmap: $.result.roadmap
      metrics: $.result.metrics
edges:
  - source: research_phase
    target: analysis_phase
  - source: analysis_phase
    target: recommendation_phase
