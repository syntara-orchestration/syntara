---
schema_version: "2.0.0"
name: hybrid-workflow
description: Workflow combining script tasks and agentic tasks
metadata:
  tags:
    - agentic
    - hybrid
    - demo
triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: prepare_data
    type: script
    parameters:
      language: bash
      code: |
        echo "Preparing data for analysis..."
        echo '{"status": "ready", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

  - id: analyze_with_ai
    type: agentic
    parameters:
      agent: production://analysis-agent
      model: claude-3-5-sonnet-20241022
      prompt: |
        Analyze the provided data and generate insights.

        Data status: ${prepare_data.stdout}

        Provide:
        1. Key trends and patterns
        2. Statistical summary
        3. Recommendations

  - id: generate_report
    type: script
    parameters:
      language: bash
      environment:
        INPUT_ANALYSIS: ${analyze_with_ai.output}
      code: |
        echo "=== Analysis Report ==="
        echo "Generated: $(date)"
        echo ""
        echo "Analysis: $INPUT_ANALYSIS"
edges:
  - from: prepare_data
    to: analyze_with_ai
  - from: analyze_with_ai
    to: generate_report
