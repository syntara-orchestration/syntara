---
schema_version: "2.0.0"
name: nested-sequence-test
description: Test sequence containing parallel activities

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: setup
    name: Setup
    type: script
    parameters:
      language: bash
      code: |
        echo "Setting up pipeline"
    outputs:
      status: $.stdout

  - id: parallel_processing_fork
    name: Parallel Processing (fork)
    type: fork

  - id: process_a
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing A"
    outputs:
      result: $.stdout

  - id: process_b
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing B"
    outputs:
      result: $.stdout

  - id: parallel_processing_join
    type: join

  - id: cleanup
    name: Cleanup
    type: script
    parameters:
      language: bash
      code: |
        echo "Cleaning up pipeline"
    outputs:
      status: $.stdout
edges:
  - source: setup
    target: parallel_processing_fork
  - source: parallel_processing_fork
    target: process_a
  - source: parallel_processing_fork
    target: process_b
  - source: process_a
    target: parallel_processing_join
  - source: process_b
    target: parallel_processing_join
  - source: parallel_processing_join
    target: cleanup
