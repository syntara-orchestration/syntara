---
schema_version: "2.0.0"
name: sequence-data-passing-test
description: Test sequence with data passing between steps

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_data
    name: Fetch Data
    type: script_python
    parameters:
      code: |
        import json
        print(json.dumps({"user_id": "123", "name": "Alice", "score": 95}))

  - id: process_data
    name: Process Data
    type: script_bash
    parameters:
      environment:
        INPUT_USER_ID: ${fetch_data.stdout_json.user_id}
        INPUT_NAME: ${fetch_data.stdout_json.name}
        INPUT_SCORE: ${fetch_data.stdout_json.score}
      code: |
        echo "Processing data for user: $INPUT_NAME (ID: $INPUT_USER_ID)"
        echo "Score: $INPUT_SCORE"
        echo "Grade: A"

  - id: save_result
    name: Save Result
    type: script_bash
    parameters:
      code: |
        echo "Saving result complete"
edges:
  - from: fetch_data
    to: process_data
  - from: process_data
    to: save_result
