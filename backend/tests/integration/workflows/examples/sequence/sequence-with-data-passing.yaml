---
schema_version: "2.0.0"
name: sequence-data-passing-test
description: Test sequence with data passing between steps

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: fetch_data
    name: Fetch Data
    type: script
    parameters:
      language: bash
      code: |
        echo '{"user_id": "123", "name": "Alice", "score": 95}'

  - id: process_data
    name: Process Data
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing data for user: $INPUT_NAME (ID: $INPUT_USER_ID)"
        echo "Score: $INPUT_SCORE"
        echo "Grade: A"

  - id: save_result
    name: Save Result
    type: script
    parameters:
      language: bash
      code: |
        echo "Saving result complete"
edges:
  - from: fetch_data
    to: process_data
  - from: process_data
    to: save_result
