---
schema_version: "2.0.0"
name: foreach-loop-test
description: Test forEach loop with bash

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: process_items
    name: Process Items
    type: loop
    loop:
      type: forEach
      items: ${trigger.item_list}
      itemVariable: item

  - id: process_item
    name: Process Item
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing item: $INPUT_ITEM"
        echo "Item value: $INPUT_ITEM"
edges:
  - from: process_items
    to: process_item
    port: body
