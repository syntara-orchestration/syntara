---
schema_version: "2.0.0"
name: output-mapping-json-test
description: Test output mapping with JSON parsing

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: generate_json
    name: Generate JSON Output
    type: script
    parameters:
      language: bash
      code: |
        echo '{"user": "Alice", "age": 30, "active": true}'

  - id: use_parsed_data
    name: Use Parsed JSON Data
    type: script
    parameters:
      language: bash
      code: |
        echo "User: $INPUT_USER_NAME, Age: $INPUT_USER_AGE"
edges:
  - from: generate_json
    to: use_parsed_data
