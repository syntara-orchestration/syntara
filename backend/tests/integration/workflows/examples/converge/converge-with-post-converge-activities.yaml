---
schema_version: "2.0.0"
name: converge-post-activities-test
description: Test converge with activities that execute after converge completes

triggers:
  - id: trigger_manual
    type: manual_trigger

nodes:
  - id: parallel_work_fork
    type: fork

  - id: fetch_data_a
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data A"
        sleep 0.1
        echo '{"source": "A", "count": 10}'

  - id: fetch_data_b
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data B"
        sleep 0.3
        echo '{"source": "B", "count": 20}'

  - id: fetch_data_c
    type: script
    parameters:
      language: bash
      code: |
        echo "Fetching data C"
        sleep 0.1
        echo '{"source": "C", "count": 30}'

  - id: parallel_work_join
    type: join

  - id: aggregate_data
    type: converge
    converge:
      branches:
        - fetch_data_a
        - fetch_data_b
        - fetch_data_c
      strategy: all
      aggregateOutputs: true

  - id: process_aggregated_data
    name: Process Aggregated Data
    type: script
    parameters:
      language: bash
      code: |
        echo "Processing aggregated data from all sources"
        echo "All parallel tasks have completed"
        echo "Total sources: 3"

  - id: send_notification
    name: Send Completion Notification
    type: script
    parameters:
      language: bash
      code: |
        echo "Notification: All data fetching and aggregation complete"
        echo "Ready for next stage"
edges:
  - from: parallel_work_fork
    to: fetch_data_a
  - from: parallel_work_fork
    to: fetch_data_b
  - from: parallel_work_fork
    to: fetch_data_c
  - from: fetch_data_a
    to: parallel_work_join
  - from: fetch_data_b
    to: parallel_work_join
  - from: fetch_data_c
    to: parallel_work_join
  - from: parallel_work_join
    to: aggregate_data
  - from: aggregate_data
    to: process_aggregated_data
  - from: process_aggregated_data
    to: send_notification
