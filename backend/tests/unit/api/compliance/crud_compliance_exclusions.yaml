---
# CRUD Endpoint Compliance Test Exclusions
#
# Endpoints excluded from CRUD compliance testing with justification.
# Format:
#   - operation_id: The operationId from the OpenAPI spec
#     crud_type: One of "read", "create", "update", "delete"
#     reason: Why this endpoint is excluded (min 20 chars)
#
# Only add exclusions for endpoints that:
# 1. Have justified non-standard status codes (e.g., 202 for async creates)
# 2. Are in the process of being fixed (include ticket reference)
#
# Note: Action endpoints (disable_, enable_, publish_, etc.) are filtered out
# by _ACTION_OPERATION_PREFIXES in endpoint_discovery.py and do not need
# exclusions here.

exclusions:
  # ===========================================================================
  # PERMANENT EXCLUSIONS (by design, won't fix)
  # ===========================================================================

  # Create endpoints with justified non-201 status codes
  - operation_id: create_ws_ticket
    crud_type: create
    reason: "Short-lived WS ticket, not a persisted resource — returns 200 by design"

# ===========================================================================
# TEMPORARY EXCLUSIONS (tech debt - should fix)
# ===========================================================================
