---
# List Endpoint Compliance Test Exclusions
#
# Endpoints excluded from compliance testing with justification.
# Format:
#   - operation_id: The operationId from the OpenAPI spec
#     reason: Why this endpoint is excluded
#
# Only add exclusions for endpoints that:
# 1. Return collections but are not user-facing paginated lists
# 2. Have technical constraints preventing compliance
# 3. Are in the process of being fixed (include ticket reference)

exclusions:
  # ===========================================================================
  # PERMANENT EXCLUSIONS (by design, won't fix)
  # ===========================================================================

  - operation_id: get_files_metadata
    reason: "Batch metadata lookup by file IDs, not a paginated list endpoint"

  - operation_id: get_internal_metrics_kpis
    reason: "Aggregation, not paginated list"

  - operation_id: get_internal_metrics_records
    reason: "Internal metrics endpoint"

  # Workflow validation endpoints (return validation results, not paginated lists)
  - operation_id: validate_workflow_definition
    reason: "Validation result not a paginated list (ValidationResult), returns findings/is_valid/error_count/warning_count"

  # ===========================================================================
  # TEMPORARY EXCLUSIONS (tech debt - should fix)
  # ===========================================================================

  # Batch/aggregation operations
  - operation_id: batch_decide_approvals
    reason: "Batch operation with custom response (BatchApprovalResponse), returns results not resources"

  # Auth provider management
  - operation_id: list_auth_providers
    reason: "Non-standard response shape (AuthProvidersResponse), missing next/prev fields"

  # Category management
  - operation_id: list_categories
    reason: "Non-standard response shape (CategoriesListResponse), missing next/prev fields"

  # Credential management
  - operation_id: get_credential_workflows
    reason: "Has correct response shape but missing pagination parameters (limit, cursor, sort, include_total)"

  - operation_id: list_credential_types
    reason: "Has correct response shape but missing pagination parameters (limit, cursor, sort, include_total)"

  # User identities
  - operation_id: list_user_identities
    reason: "Has correct response shape but missing pagination parameters (limit, cursor, sort, include_total)"

  # These endpoints use simple direct value filtering (e.g., ?status=pending)
  # instead of the standard operator-based pattern (e.g., ?status[eq]=pending).
  # They should be migrated to use allOf schema with operator properties.
  - operation_id: list_approvals
    reason: "Uses simple value filters instead of operator-based pattern - status/execution_id need allOf schema with {eq}"

  - operation_id: list_policies
    reason: "Uses simple value filters instead of operator-based pattern - name/scope need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, is_builtin/project_id/project_eligible need {eq}"

  - operation_id: list_roles
    reason: "Uses simple value filters instead of operator-based pattern - name/scope/policy_name need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, is_builtin/project_id need {eq}"

  - operation_id: list_integrations
    reason: "Uses simple value filters instead of operator-based pattern - integration_type/status/enabled/scope need allOf schema with {eq}"

  - operation_id: list_invocations
    reason: "Uses simple value filters instead of operator-based pattern - session_id/prompt need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, status/created_by need {eq}"

  - operation_id: list_projects
    reason: "Uses simple value filters instead of operator-based pattern - name needs allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, is_default/is_builtin need {eq}"

  - operation_id: list_project_approvals
    reason: "Uses simple value filters instead of operator-based pattern - status/execution_id need allOf schema with {eq}"

  - operation_id: list_project_roles
    reason: "Uses simple value filters instead of operator-based pattern - name/scope/policy_name need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, is_builtin need {eq}"

  - operation_id: list_project_policies
    reason: "Uses simple value filters instead of operator-based pattern - name/scope need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, is_builtin/project_eligible need {eq}"

  - operation_id: list_groups_directory
    reason: "Uses simple name filter instead of operator-based pattern - name needs allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}"

  - operation_id: list_role_assignments
    reason: "Uses simple value filters instead of operator-based pattern - principal_type/principal_name/role_name need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, principal_id/project_id need {eq}"

  - operation_id: list_project_role_assignments
    reason: "Uses simple value filters instead of operator-based pattern - principal_type/principal_name/role_name need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, principal_id need {eq}"

  - operation_id: list_credentials
    reason: "Uses simple value filters instead of operator-based pattern - credential_type_id needs allOf schema with {eq}, enabled needs {eq}"

  - operation_id: list_project_credentials
    reason: "Uses simple value filters instead of operator-based pattern - credential_type_id needs allOf schema with {eq}, enabled needs {eq}"

  - operation_id: list_settings
    reason: "Uses simple value filters instead of operator-based pattern - category/group need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}"

  - operation_id: list_users
    reason: "Uses simple value filters instead of operator-based pattern - username/first_name/last_name/auth_source need allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, auth_type needs {eq}"

  - operation_id: list_users_directory
    reason: "Uses simple username filter instead of operator-based pattern - needs allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}"

  - operation_id: list_user_role_assignments
    reason: "Uses simple value filters instead of operator-based pattern - role_name needs allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, project_id needs {eq}"

  - operation_id: list_group_role_assignments
    reason: "Uses simple value filters instead of operator-based pattern - role_name needs allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, project_id needs {eq}"

  - operation_id: list_service_accounts
    reason: "Uses simple value filters instead of operator-based pattern - name needs allOf schema with {eq, contains, starts_with, gt, gte, lt, lte}, status needs {eq}. Sort parameter also missing pattern constraint."

  - operation_id: list_service_account_credentials
    reason: "Uses simple value filters instead of operator-based pattern - credential_type/status need allOf schema with {eq}. Sort parameter also missing pattern constraint."
