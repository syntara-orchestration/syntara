---
# List Endpoint Compliance Test Exclusions
#
# Endpoints excluded from compliance testing with justification.
# Format:
#   - operation_id: The operationId from the OpenAPI spec
#     reason: Why this endpoint is excluded
#
# Only add exclusions for endpoints that:
# 1. Return collections but are not user-facing paginated lists
# 2. Have technical constraints preventing compliance
# 3. Are in the process of being fixed (include ticket reference)

exclusions:
  # ===========================================================================
  # PERMANENT EXCLUSIONS (by design, won't fix)
  # ===========================================================================

  - operation_id: get_files_metadata
    reason: "Batch metadata lookup by file IDs, not a paginated list endpoint"

  - operation_id: get_internal_metrics_kpis
    reason: "Aggregation, not paginated list"

  - operation_id: get_internal_metrics_records
    reason: "Internal metrics endpoint"

  # Workflow validation endpoints (return validation results, not paginated lists)
  - operation_id: validate_workflow_definition
    reason: "Validation result not a paginated list (ValidationResult), returns findings/is_valid/error_count/warning_count"

  # ===========================================================================
  # TEMPORARY EXCLUSIONS (tech debt - should fix)
  # ===========================================================================

  # Batch/aggregation operations
  - operation_id: batch_decide_approvals
    reason: "Batch operation with custom response (BatchApprovalResponse), returns results not resources"

  # Auth provider management
  - operation_id: list_auth_providers
    reason: "Non-standard response shape (AuthProvidersResponse), missing next/prev fields"

  # Category management
  - operation_id: list_categories
    reason: "Non-standard response shape (CategoriesListResponse), missing next/prev fields"

  # Credential management
  - operation_id: get_credential_workflows
    reason: "Has correct response shape but missing pagination parameters (limit, cursor, sort, include_total)"

  - operation_id: list_credential_types
    reason: "Has correct response shape but missing pagination parameters (limit, cursor, sort, include_total)"

  # User identities
  - operation_id: list_user_identities
    reason: "Has correct response shape but missing pagination parameters (limit, cursor, sort, include_total)"

  # ===========================================================================
  # SIMPLE FILTER FORMAT (params used directly in router/service code)
  # ===========================================================================
  # These endpoints pass filter values as named kwargs (params.field_name) to
  # services instead of using parse_filters(). Migrating to operator-based
  # format requires refactoring the router/service layer.

  - operation_id: list_integrations
    reason: "project_id param used directly via params.project_id in router for visibility scoping — needs router/service refactor for operator format"

  - operation_id: list_role_assignments
    reason: "Filter params used directly via params.field_name in role_assignment_router — needs router/service refactor for operator format"

  - operation_id: list_project_role_assignments
    reason: "Filter params used directly via params.field_name in role_assignment_router — needs router/service refactor for operator format"

  - operation_id: list_user_role_assignments
    reason: "Filter params used directly via params.field_name in role_assignment_router — needs router/service refactor for operator format"

  - operation_id: list_group_role_assignments
    reason: "Filter params used directly via params.field_name in role_assignment_router — needs router/service refactor for operator format"

  - operation_id: get_tool_executions
    reason: "Filter params used directly via params.field_name in tool_metrics_service — needs service refactor for operator format"

