---
schema_version: "2.0.0"
name: hello-world
description: Simple hello world workflow with environment variables
triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters: {}
nodes:
  - id: say_hello
    type: script_bash
    name: Say Hello
    parameters:
      environment:
        GREETING: Hello
        WORLD_NAME: World
      code: |
        echo "$GREETING, $WORLD_NAME!"
        echo "Current time: $(date)"

  - id: say_goodbye
    type: script_bash
    name: Say Goodbye
    parameters:
      environment:
        FAREWELL: Goodbye
      code: |
        echo "$FAREWELL, World!"
edges:
  - from: trigger_manual
    to: say_hello
  - from: say_hello
    to: say_goodbye
