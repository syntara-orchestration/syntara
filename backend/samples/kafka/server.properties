# Disposable local fixture only. Never apply to customer brokers.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9094
listeners=INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://localhost:9093
listener.security.protocol.map=INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=INTERNAL
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
listener.name.internal.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="fixture" password="disposable-local-only" user_fixture="disposable-local-only";
listener.name.external.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_fixture="disposable-local-only";
ssl.keystore.type=PEM
ssl.keystore.location=/tmp/kafka-fixture/server.pem
ssl.truststore.type=PEM
ssl.truststore.location=/fixture-certs/ca.pem
ssl.client.auth=none
log.dirs=/tmp/kafka-fixture/data
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
