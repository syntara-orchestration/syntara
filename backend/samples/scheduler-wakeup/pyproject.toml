[project]
name = "scheduler-wakeup-poc"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "greenlet>=3.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.22",
    "temporalio>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
jetstream = ["nats-py>=2.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
