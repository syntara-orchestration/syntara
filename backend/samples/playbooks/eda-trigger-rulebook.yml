---
# Rulebook: Forward webhook events to the workflow trigger
#
# Listens for incoming events and triggers an EDA
# webhook endpoint via a job template.
#
# The job template's credential (custom type) provides webhook_base_url,
# webhook_client_id, and webhook_client_secret. This rulebook only passes
# webhook_path and the event data as extra vars.
#
# Required extra vars on the rulebook activation:
#   webhook_path: webhook path slug from the trigger config

- name: Forward events to the workflow trigger
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Forward all events to the workflow trigger
      condition: event.payload is defined
      action:
        run_job_template:
          name: "Trigger EDA Webhook"
          organization: Default
          job_args:
            extra_vars:
              webhook_path: "{{ webhook_path }}"
              event_payload: "{{ event.payload }}"
