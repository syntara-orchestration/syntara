---
schema_version: "2.0.0"
name: github-repo-info
description: Fetch GitHub repository information and analyze it
triggers:
  - id: trigger_manual
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        properties:
          owner:
            type: string
            description: GitHub repository owner
            default: "ansible"
          repo:
            type: string
            description: GitHub repository name
            default: "ansible"
        required:
          - owner
          - repo
nodes:
  - id: fetch_repo
    type: http_request
    name: Fetch Repository Info
    parameters:
      method: GET
      url: https://api.github.com/repos/${trigger.owner}/${trigger.repo}
      headers:
        Accept: application/vnd.github.v3+json
        User-Agent: Nexus-Workflow-Engine
    outputs:
      repo_data: "${result.body}"
      name: "${result.body.name}"
      description: "${result.body.description}"
      stars: "${result.body.stargazers_count}"
      forks: "${result.body.forks_count}"
      language: "${result.body.language}"
      open_issues: "${result.body.open_issues_count}"
      created_at: "${result.body.created_at}"
      updated_at: "${result.body.updated_at}"
    settings:
      timeout: 30

  - id: fetch_languages
    type: http_request
    name: Fetch Repository Languages
    parameters:
      method: GET
      url: https://api.github.com/repos/${trigger.owner}/${trigger.repo}/languages
      headers:
        Accept: application/vnd.github.v3+json
        User-Agent: Nexus-Workflow-Engine
    outputs:
      languages: "${result.body}"
    settings:
      timeout: 30

  - id: analyze_repo
    type: script
    name: Analyze Repository Data
    parameters:
      language: python
      code: |
        import json
        import os
        from datetime import datetime

        # Get inputs
        name = os.getenv('INPUT_NAME', 'Unknown')
        description = os.getenv('INPUT_DESCRIPTION', 'No description')
        stars = int(os.getenv('INPUT_STARS', '0'))
        forks = int(os.getenv('INPUT_FORKS', '0'))
        language = os.getenv('INPUT_LANGUAGE', 'Unknown')
        open_issues = int(os.getenv('INPUT_OPEN_ISSUES', '0'))
        created_at = os.getenv('INPUT_CREATED_AT', '')
        updated_at = os.getenv('INPUT_UPDATED_AT', '')
        languages_json = os.getenv('INPUT_LANGUAGES', '{}')

        # Parse languages
        languages = json.loads(languages_json)

        # Calculate popularity score (simple formula)
        popularity_score = (stars * 2) + (forks * 5) - (open_issues * 0.5)

        # Determine activity level
        if stars > 10000:
            activity = "Very Popular"
        elif stars > 1000:
            activity = "Popular"
        elif stars > 100:
            activity = "Moderately Active"
        else:
            activity = "Growing"

        # Format languages
        language_list = list(languages.keys())

        # Create analysis report
        report = {
            "repository": name,
            "description": description,
            "primary_language": language,
            "all_languages": language_list,
            "statistics": {
                "stars": stars,
                "forks": forks,
                "open_issues": open_issues,
                "popularity_score": round(popularity_score, 2)
            },
            "activity_level": activity,
            "summary": f"{name} is a {activity.lower()} repository with {stars} stars and {forks} forks, primarily written in {language}."
        }

        print(json.dumps(report, indent=2))
      environment:
        INPUT_NAME: ${fetch_repo.name}
        INPUT_DESCRIPTION: ${fetch_repo.description}
        INPUT_STARS: ${fetch_repo.stars}
        INPUT_FORKS: ${fetch_repo.forks}
        INPUT_LANGUAGE: ${fetch_repo.language}
        INPUT_OPEN_ISSUES: ${fetch_repo.open_issues}
        INPUT_CREATED_AT: ${fetch_repo.created_at}
        INPUT_UPDATED_AT: ${fetch_repo.updated_at}
        INPUT_LANGUAGES: ${fetch_languages.languages}
    outputs:
      report: "${result.stdout_json}"
      summary: "${result.stdout_json.summary}"
      popularity_score: "${result.stdout_json.statistics.popularity_score}"
    settings:
      timeout: 60
edges:
  - from: trigger_manual
    to: fetch_repo
  - from: fetch_repo
    to: fetch_languages
  - from: fetch_languages
    to: analyze_repo
