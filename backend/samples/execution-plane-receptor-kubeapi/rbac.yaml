apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher-poc
  namespace: syntara-control-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: http-executor-dispatcher
  namespace: syntara-execution-poc
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher-poc
  namespace: syntara-execution-poc
subjects:
  - kind: ServiceAccount
    name: dispatcher-poc
    namespace: syntara-control-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: http-executor-dispatcher
