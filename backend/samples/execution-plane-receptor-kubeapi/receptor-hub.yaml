apiVersion: v1
kind: ConfigMap
metadata:
  name: receptor-hub-config
  namespace: syntara-control-poc
data:
  receptor.conf: |
    ---
    - node:
        id: execution-hub
    - tcp-listener:
        port: 2222
    - tcp-server:
        bindaddr: 0.0.0.0
        port: 9443
        remotenode: execution-bridge
        remoteservice: kubeapi
    ...
---
apiVersion: v1
kind: Service
metadata:
  name: receptor-hub
  namespace: syntara-control-poc
spec:
  selector:
    app: receptor-hub
  ports:
    - name: mesh
      port: 2222
      targetPort: mesh
    - name: kubeapi-door
      port: 9443
      targetPort: kubeapi-door
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receptor-hub
  namespace: syntara-control-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receptor-hub
  template:
    metadata:
      labels:
        app: receptor-hub
    spec:
      automountServiceAccountToken: false
      containers:
        - name: receptor
          # Pin this to a tested immutable digest before any non-POC use.
          image: quay.io/ansible/receptor:latest
          ports:
            - name: mesh
              containerPort: 2222
            - name: kubeapi-door
              containerPort: 9443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 998
            runAsGroup: 998
          volumeMounts:
            - name: config
              mountPath: /etc/receptor
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: receptor-hub-config
