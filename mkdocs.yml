      - AI-Assisted Development: frontend/ai-assisted-development.md
      - Filter Test Helpers: frontend/TEST_HELPERS_FILTER_TESTING.md
      - Features:
          - Approval UI Architecture: frontend/features/approval-ui-architecture.md
