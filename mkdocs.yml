---
site_name: Syntara Documentation
site_description: Distributed multi-agent automation system
site_url: https://syntara.readthedocs.io/

repo_url: https://github.com/automation-nexus/nexus-combined
repo_name: automation-nexus/nexus-combined

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Backend:
      - Getting Started: backend/docs/developer-getting-started.md
      - Authentication: backend/docs/authentication.md
      - Authorization: backend/docs/authorization.md
      - Audit: backend/docs/audit.md
      - CLI: backend/docs/cli.md
      - Credentials: backend/docs/credential.md
      - Error Handling: backend/docs/error-handling-strategy.md
      - Execution Runtime: backend/docs/execution-runtime.md
      - File Storage: backend/docs/file-storage.md
      - Integrations: backend/docs/integrations.md
      - Runtime Settings: backend/docs/runtime-settings.md
      - Service Accounts: backend/docs/service-accounts.md
      - Stall Detection: backend/docs/stall-detection-prometheus-gauges.md
      - Workflow Management: backend/docs/workflow-management.md
      - Workflow Versioning: backend/docs/workflow-versioning.md
  - Development:
      - Worktrees: backend/docs/development-with-worktrees.md
      - Windows Setup: docs/windows-setup-guide.md
  - CI:
      - Secrets Inventory: docs/ci/secrets-inventory.md
      - Secrets Storage: docs/ci/secrets-storage.md
      - Test Quarantine: docs/ci/test-quarantine.md
