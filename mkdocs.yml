              - Manual Trigger: backend/workflow-engine/triggers/manual-trigger.md
              - Scheduled Trigger: backend/workflow-engine/triggers/scheduled-trigger.md
              - Webhook Triggers: backend/workflow-engine/triggers/webhook-triggers.md
  - Frontend:
      - Architecture: frontend/architecture.md
      - Data Flow: frontend/data-flow.md
      - Zustand Architecture: frontend/zustand-architecture.md
      - WebSocket Architecture: frontend/websocket-architecture.md
      - Execution Visualizer Protocol: frontend/execution-visualizer-protocol.md
      - Error Handling: frontend/error-handling.md
      - Permissions & RBAC: frontend/permissions-rbac.md
