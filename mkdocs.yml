---
site_name: Syntara Documentation
site_description: Documentation for the Syntara distributed multi-agent automation system
site_url: https://syntara-orchestration.readthedocs.io/
repo_url: https://github.com/syntara-orchestration/syntara
edit_uri: edit/devel/docs/

hooks:
  - docs/hooks/resolve_symlink_edit_urls.py

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - llmstxt:
      markdown_description: >-
        Developer documentation for Syntara, a distributed multi-agent
        automation system. Covers the Python/FastAPI backend, React/TypeScript
        frontend, workflow engine, and development standards.
      full_output: llms-full.txt
      sections:
        Backend:
          - backend/*.md
          - backend/**/*.md
        Frontend:
          - frontend/*.md
          - frontend/**/*.md
        CI:
          - ci/*.md

theme:
  name: material
  logo: syntara-icon.png
  favicon: syntara-icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Contributing:
      - Project Contributor Guide: contributing.md
      - Backend Contributor Guide: backend-contributing.md
      - Frontend Contributor Guide: frontend-contributing.md
      - Windows Setup Guide: windows-setup-guide.md
      - CI:
          - Test quarantine workflow: ci/test-quarantine.md
  - Backend:
      - Approvals:
          - Approval Authorization Model: backend/approvals/approval-authorization-model.md
          - Approval Node Execution Pattern: backend/approvals/approval-execution-pattern.md
          - Approval Overview: backend/approvals/approval-overview.md
      - Architecture Decision Records: backend/decision-records.md
      - Audit Framework: backend/audit.md
      - Authentication: backend/authentication.md
      - Authorization: backend/authorization.md
      - Credentials: backend/credential.md
      - Developer Getting Started Guide: backend/developer-getting-started.md
      - Development with Git Worktrees: backend/development-with-worktrees.md
      - Error Handling Strategy: backend/error-handling-strategy.md
      - Execution Runtime: backend/execution-runtime.md
      - File Storage: backend/file-storage.md
      - Integrations: backend/integrations.md
      - OpenAPI Schema vs Implementation Analysis: backend/openapi-status-code-analysis.md
      - Orchestrator CLI: backend/cli.md
      - Python Structured Logging Research Report: backend/structured-logging-research.md
      - 'Recurring Background Execution: Choosing Between PeriodicWorker and Temporal Built-in Workflows': backend/periodic-background-execution.md
      - Resilient Background Execution: backend/resilient-background-execution.md
      - Runtime Settings: backend/runtime-settings.md
      - Service Accounts: backend/service-accounts.md
      - Service-to-Service Certificate Authentication: backend/s2s-cert-authentication.md
      - Standards:
          - Access Control: backend/standards/access-control.md
