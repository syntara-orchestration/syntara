---
# All infrastructure ports are bound to 127.0.0.1 (loopback only).
# They are reachable from localhost but not from external network interfaces,
# making this file safe to use on cloud VMs without additional hardening.
services:
  database:
    image: ${POSTGRES_IMAGE:-quay.io/sclorg/postgresql-15-c9s}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_DB_PORT:-5432}:5432"
    environment:
      POSTGRESQL_USER: ${APP_DB_USER:-admin}
      POSTGRESQL_PASSWORD: ${APP_DB_PASSWORD:-admin}
      POSTGRESQL_DATABASE: ${APP_DB_NAME:-syntara_api}
      POSTGRESQL_ADMIN_PASSWORD: ${APP_DB_PASSWORD:-admin}
    volumes:
      - syntara_postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRESQL_USER:-admin} -d $${POSTGRESQL_DATABASE:-syntara_api}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: ${APP_CACHE_IMAGE:-mirror.gcr.io/library/redis:6.2.22@sha256:da7091440b2b4d9456603be812dba895cd75bedd66564d7f01f1f010521f8467}
    restart: unless-stopped
    command: sh -c "redis-server --requirepass $${REDIS_PASSWORD:-cache}"
    ports:
      - "127.0.0.1:${APP_CACHE_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${APP_CACHE_PASSWORD:-cache}
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -h 127.0.0.1 -p 6379 -a $${REDIS_PASSWORD:-cache} ping']
      interval: 10s
      timeout: 5s
      retries: 5

  syntara-ui:
    build:
      context: ./frontend
      dockerfile: packages/syntara-ui/Containerfile
    image: ${APP_UI_IMAGE:-localhost/syntara-ui:latest}
    restart: unless-stopped
    ports:
      - ${APP_UI_PORT:-8080}:80
    environment:
      - APP_API_URL=${APP_API_URL:-https://syntara:8000}
    depends_on:
      syntara:
        condition: service_healthy

  temporal:
    image: mirror.gcr.io/temporalio/auto-setup:1.25.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_TEMPORAL_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${APP_DB_PASSWORD:-admin}
      - POSTGRES_SEEDS=database
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - TEMPORAL_AVAILABILITY_ZONE=tls
      - TEMPORAL_TLS_FRONTEND_CERT=/etc/temporal/config/certs/temporal.crt
      - TEMPORAL_TLS_FRONTEND_KEY=/etc/temporal/config/certs/temporal.key
      - TEMPORAL_TLS_FRONTEND_SERVER_NAME=temporal
      - TEMPORAL_TLS_CLIENT1_CA_CERT=/etc/temporal/config/certs/ca.pem
      - TEMPORAL_TLS_CA=/etc/temporal/config/certs/ca.pem
      - TEMPORAL_TLS_CERT=/etc/temporal/config/certs/temporal.crt
      - TEMPORAL_TLS_KEY=/etc/temporal/config/certs/temporal.key
      - TEMPORAL_TLS_SERVER_NAME=temporal
      - TEMPORAL_CLI_TLS_CA=/etc/temporal/config/certs/ca.pem
      - TEMPORAL_CLI_TLS_SERVER_NAME=temporal
    volumes:
      - ./backend/containers/temporal-server/temporal-config:/etc/temporal/config/dynamicconfig:z
      - ./backend/containers/temporal-server/temporal-tls-config.yaml:/etc/temporal/config/docker_tls.yaml:ro,z
      - ./backend/.secrets/certs/ca.pem:/etc/temporal/config/certs/ca.pem:ro,z
      - ./backend/.secrets/certs/temporal.crt:/etc/temporal/config/certs/temporal.crt:ro,z
      - ./backend/.secrets/certs/temporal.key:/etc/temporal/config/certs/temporal.key:ro,z
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, tctl, --address, 'temporal:7233', cluster, health]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: mirror.gcr.io/temporalio/ui:2.31.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_TEMPORAL_UI_PORT:-8081}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      - TEMPORAL_TLS_CA=/etc/temporal/config/certs/ca.pem
      - TEMPORAL_TLS_CERT=/etc/temporal/config/certs/temporal.crt
      - TEMPORAL_TLS_KEY=/etc/temporal/config/certs/temporal.key
      - TEMPORAL_TLS_ENABLE_HOST_VERIFICATION=true
      - TEMPORAL_TLS_SERVER_NAME=temporal
    volumes:
      - ./backend/.secrets/certs/ca.pem:/etc/temporal/config/certs/ca.pem:ro,z
      - ./backend/.secrets/certs/temporal.crt:/etc/temporal/config/certs/temporal.crt:ro,z
      - ./backend/.secrets/certs/temporal.key:/etc/temporal/config/certs/temporal.key:ro,z
    depends_on:
      temporal:
        condition: service_healthy

  moto:
    image: docker.io/motoserver/moto:5.2.2@sha256:d8ae5edc2bf080e7e4c13f9bd4b29b53ac3b4427e92956318db3dbe23ec43eb7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_MOTO_PORT:-5555}:5000"
    healthcheck:
      test: [CMD-SHELL, 'curl -sf http://localhost:5000/moto-api/ > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 5

  syntara:
    build:
      args:
        DOWNSTREAM_OVERRIDE: ${DOWNSTREAM_OVERRIDE:-scratch}
        BRANDING: ${BRANDING:-false}
      context: ./backend
      dockerfile: containers/syntara/Containerfile
    image: ${APP_IMAGE:-localhost/syntara:latest}
    restart: unless-stopped
    command: [sh, -c, 'chmod -R g+rwX /data/audit-exports 2>/dev/null; uv run --no-sync alembic upgrade head && uv run --no-sync python -m syntara.seed --all && (uv run --no-sync python -c "import os,boto3; boto3.client(\"s3\", endpoint_url=os.environ[\"APP_S3_ENDPOINT_URL\"], aws_access_key_id=os.environ[\"APP_S3_ACCESS_KEY_ID\"], aws_secret_access_key=os.environ[\"APP_S3_SECRET_ACCESS_KEY\"], region_name=os.environ[\"APP_S3_REGION\"]).create_bucket(Bucket=os.environ[\"APP_S3_BUCKET_NAME\"])" || true) && uv run --no-sync python -m syntara.api.main']
    ports:
      - ${APP_API_PORT:-8000}:8000
    environment:
      - APP_DB_HOST=database
      - APP_DB_PORT=5432
      - APP_DB_USER=${APP_DB_USER:-admin}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-admin}
      - APP_DB_NAME=${APP_DB_NAME:-syntara_api}

      - APP_S3_ENDPOINT_URL=${APP_S3_ENDPOINT_URL:-http://moto:5000}
      - APP_S3_BUCKET_NAME=${APP_S3_BUCKET_NAME:-orchestrator-files}
      - APP_S3_REGION=${APP_S3_REGION:-us-east-1}
      - APP_S3_ACCESS_KEY_ID=${APP_S3_ACCESS_KEY_ID:-testing}
      - APP_S3_SECRET_ACCESS_KEY=${APP_S3_SECRET_ACCESS_KEY:-testing}
      - APP_S3_VERIFY_SSL=${APP_S3_VERIFY_SSL:-false}
      - APP_S3_USE_PATH_STYLE=${APP_S3_USE_PATH_STYLE:-true}

      - APP_TEMPORAL_ADDRESS=temporal:7233
      - APP_TEMPORAL_NAMESPACE=default
      - APP_CACHE_HOST=redis
      - APP_CACHE_PASSWORD=${APP_CACHE_PASSWORD:-cache}
      - APP_SERVER_PUBLIC_URL=${APP_SERVER_PUBLIC_URL:-}
      - APP_ENV_FILE_PATH=${APP_ENV_FILE_PATH:-.env}
      - APP_FALLBACK_LOG_LEVEL=${APP_FALLBACK_LOG_LEVEL:-INFO}
      - APP_LOG_OUTPUT_FORMAT=${APP_LOG_OUTPUT_FORMAT:-text}
      - APP_SEGMENT_WRITE_KEY=${APP_SEGMENT_WRITE_KEY}
      - APP_SEGMENT_ENDPOINT=${APP_SEGMENT_ENDPOINT:-http://mock-segment:9999}
      - APP_SEGMENT_MAX_RETRIES=${APP_SEGMENT_MAX_RETRIES:-10}
      - APP_SEGMENT_TIMEOUT=${APP_SEGMENT_TIMEOUT:-30}
      - APP_ENTITLEMENT_ID=${APP_ENTITLEMENT_ID}
      - APP_COLLECTION_INTERVAL_SECONDS=${APP_COLLECTION_INTERVAL_SECONDS:-300}
      - APP_CONTAINER_IMAGE_VERSION=${APP_CONTAINER_IMAGE_VERSION:-dev}
      - APP_AAP_BASE_URL=${APP_AAP_BASE_URL}
      - APP_AAP_USERNAME=${APP_AAP_USERNAME}
      - APP_AAP_PASSWORD=${APP_AAP_PASSWORD}
      - APP_AAP_TOKEN=${APP_AAP_TOKEN}
      - APP_AAP_VERIFY_SSL=${APP_AAP_VERIFY_SSL:-true}
      - APP_AAP_PROXY_TIMEOUT_SECONDS=${APP_AAP_PROXY_TIMEOUT_SECONDS:-30}
      - APP_JWT_PRIVATE_KEY_PATH=/run/secrets/jwt-primary.pem
      - APP_JWT_BACKUP_KEYS=[{"key_id":"orchestrator-backup","key_path":"/run/secrets/jwt-backup.pem"}]
      - APP_CORS_ALLOW_ORIGINS=${APP_CORS_ALLOW_ORIGINS:-["http://localhost:8080","https://localhost:8080","http://localhost:5173","https://localhost:5173"]}
      - APP_ADMIN_PASSWORD_PATH=/run/secrets/admin-password
      - APP_SECRET_ENCRYPTION_KEY_PATH=/run/secrets/encryption-key
      - APP_AUDIT_EXPORT_DIR=/data/audit-exports
      - APP_S2S_TLS_ENABLED=${APP_S2S_TLS_ENABLED:-true}
      - APP_S2S_TLS_CA_CERT_PATH=/run/secrets/s2s-ca.pem
      - APP_S2S_TLS_CERT_PATH=/run/secrets/s2s-cert.crt
      - APP_S2S_TLS_KEY_PATH=/run/secrets/s2s-cert.key
      - APP_S2S_TLS_CN_ALLOWLIST=["backend.ao.svc","worker.ao.svc","background-worker.ao.svc","temporal.ao.svc"]
      - APP_BACKGROUND_TASK_QUEUE=orchestrator-background-queue
    volumes:
      - ./backend/src:/opt/app-root/src/src:z
      - syntara_audit_exports:/data/audit-exports:z
      - ./backend/.secrets/jwt-primary.pem:/run/secrets/jwt-primary.pem:ro,z
      - ./backend/.secrets/jwt-backup.pem:/run/secrets/jwt-backup.pem:ro,z
      - ./backend/.secrets/admin-password:/run/secrets/admin-password:ro,z
      - ./backend/.secrets/encryption-key:/run/secrets/encryption-key:ro,z
      - ./backend/.secrets/certs/ca.pem:/run/secrets/s2s-ca.pem:ro,z
      - ./backend/.secrets/certs/backend.crt:/run/secrets/s2s-cert.crt:ro,z
      - ./backend/.secrets/certs/backend.key:/run/secrets/s2s-cert.key:ro,z
    depends_on:
      database:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      moto:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'python3 -c "import urllib.request,ssl;ctx=ssl.create_default_context(cafile=\"/run/secrets/s2s-ca.pem\");urllib.request.urlopen(\"https://localhost:8000/healthz/ready\",context=ctx)"']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  temporal-worker:
    image: ${APP_IMAGE:-localhost/syntara:latest}
    restart: unless-stopped
    command: [python, -m, syntara.workflows.worker]
    extra_hosts: # Dev mode: resolves 'syntara' to host when API runs outside containers
      - "syntara:host-gateway"
    environment:
      - APP_DB_HOST=database
      - APP_DB_PORT=5432
      - APP_DB_USER=${APP_DB_USER:-admin}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-admin}
      - APP_DB_NAME=${APP_DB_NAME:-syntara_api}

      - APP_S3_ENDPOINT_URL=${APP_S3_ENDPOINT_URL:-http://moto:5000}
      - APP_S3_BUCKET_NAME=${APP_S3_BUCKET_NAME:-orchestrator-files}
      - APP_S3_REGION=${APP_S3_REGION:-us-east-1}
      - APP_S3_ACCESS_KEY_ID=${APP_S3_ACCESS_KEY_ID:-testing}
      - APP_S3_SECRET_ACCESS_KEY=${APP_S3_SECRET_ACCESS_KEY:-testing}
      - APP_S3_VERIFY_SSL=${APP_S3_VERIFY_SSL:-false}
      - APP_S3_USE_PATH_STYLE=${APP_S3_USE_PATH_STYLE:-true}

      - APP_SERVER_SCHEME=${APP_SERVER_SCHEME:-https}
      - APP_SERVER_HOST=${APP_SERVER_HOST:-0.0.0.0}
      - APP_SERVER_PORT=${APP_SERVER_PORT:-8000}
      - APP_SERVER_PUBLIC_URL=${APP_SERVER_PUBLIC_URL:-}
      - APP_TEMPORAL_ADDRESS=temporal:7233
      - APP_TEMPORAL_NAMESPACE=default
      - APP_TASK_QUEUE=orchestrator-workflow-queue
      - APP_ENV_FILE_PATH=${APP_ENV_FILE_PATH:-.env}
      - APP_FALLBACK_LOG_LEVEL=${APP_FALLBACK_LOG_LEVEL:-INFO}
      - APP_CACHE_HOST=redis
      - APP_CACHE_PASSWORD=${APP_CACHE_PASSWORD:-cache}
      - APP_WORKFLOW_BASE_URL=${APP_WORKFLOW_BASE_URL:-https://syntara:8000/api/v1}
      - APP_AGENT_ORCHESTRATOR_BASE_URL=${APP_AGENT_ORCHESTRATOR_BASE_URL:-https://syntara:8000/api/v1}
      - APP_APPROVALS_API_BASE_URL=${APP_APPROVALS_API_BASE_URL:-https://syntara:8000/api/v1}
      - APP_TOOL_MANAGER_BASE_URL=${APP_TOOL_MANAGER_BASE_URL:-https://syntara:8000/api/v1}
      - APP_AAP_BASE_URL=${APP_AAP_BASE_URL}
      - APP_AAP_USERNAME=${APP_AAP_USERNAME}
      - APP_AAP_PASSWORD=${APP_AAP_PASSWORD}
      - APP_AAP_TOKEN=${APP_AAP_TOKEN}
      - APP_AAP_TIMEOUT_SECONDS=${APP_AAP_TIMEOUT_SECONDS:-3600}
      - APP_AAP_POLL_INTERVAL_SECONDS=${APP_AAP_POLL_INTERVAL_SECONDS:-5.0}
      - APP_WORKFLOW_HTTP_REQUEST_ALLOWED_HOSTS=${APP_WORKFLOW_HTTP_REQUEST_ALLOWED_HOSTS:-[]}
      - APP_AAP_VERIFY_SSL=${APP_AAP_VERIFY_SSL:-true}
      - APP_SEGMENT_WRITE_KEY=${APP_SEGMENT_WRITE_KEY}
      - APP_SEGMENT_ENDPOINT=${APP_SEGMENT_ENDPOINT:-http://mock-segment:9999}
      - APP_SEGMENT_MAX_RETRIES=${APP_SEGMENT_MAX_RETRIES:-10}
      - APP_SEGMENT_TIMEOUT=${APP_SEGMENT_TIMEOUT:-30}
      - APP_ENTITLEMENT_ID=${APP_ENTITLEMENT_ID}
      - APP_CONTAINER_IMAGE_VERSION=${APP_CONTAINER_IMAGE_VERSION:-dev}
      - APP_JWT_PRIVATE_KEY_PATH=/run/secrets/jwt-primary.pem
      - APP_JWT_BACKUP_KEYS=[{"key_id":"orchestrator-backup","key_path":"/run/secrets/jwt-backup.pem"}]
      - APP_SECRET_ENCRYPTION_KEY_PATH=/run/secrets/encryption-key
      - APP_AUDIT_EXPORT_DIR=/data/audit-exports
      - APP_S2S_TLS_ENABLED=${APP_S2S_TLS_ENABLED:-true}
      - APP_S2S_TLS_CA_CERT_PATH=/run/secrets/s2s-ca.pem
      - APP_S2S_TLS_CERT_PATH=/run/secrets/s2s-cert.crt
      - APP_S2S_TLS_KEY_PATH=/run/secrets/s2s-cert.key
    volumes:
      - ./backend/src:/opt/app-root/src/src:z
      - syntara_audit_exports:/data/audit-exports:z
      - ./backend/.secrets/jwt-primary.pem:/run/secrets/jwt-primary.pem:ro,z
      - ./backend/.secrets/jwt-backup.pem:/run/secrets/jwt-backup.pem:ro,z
      - ./backend/.secrets/encryption-key:/run/secrets/encryption-key:ro,z
      - ./backend/.secrets/certs/ca.pem:/run/secrets/s2s-ca.pem:ro,z
      - ./backend/.secrets/certs/worker.crt:/run/secrets/s2s-cert.crt:ro,z
      - ./backend/.secrets/certs/worker.key:/run/secrets/s2s-cert.key:ro,z
    depends_on:
      database:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      moto:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'cat /proc/[0-9]*/cmdline 2>/dev/null | grep -qa syntara.workflows.worker']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  temporal-background-worker:
    image: ${APP_IMAGE:-localhost/syntara:latest}
    restart: unless-stopped
    command: [python, -m, syntara.workflows.background_worker]
    extra_hosts:
      - "syntara:host-gateway"
    environment:
      - APP_DB_HOST=database
      - APP_DB_PORT=5432
      - APP_DB_USER=${APP_DB_USER:-admin}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-admin}
      - APP_DB_NAME=${APP_DB_NAME:-syntara_api}

      - APP_SERVER_SCHEME=${APP_SERVER_SCHEME:-https}
      - APP_SERVER_HOST=${APP_SERVER_HOST:-0.0.0.0}
      - APP_SERVER_PORT=${APP_SERVER_PORT:-8000}
      - APP_TEMPORAL_ADDRESS=temporal:7233
      - APP_TEMPORAL_NAMESPACE=default
      - APP_BACKGROUND_TASK_QUEUE=orchestrator-background-queue
      - APP_ENV_FILE_PATH=${APP_ENV_FILE_PATH:-.env}
      - APP_FALLBACK_LOG_LEVEL=${APP_FALLBACK_LOG_LEVEL:-INFO}
      - APP_CACHE_HOST=redis
      - APP_CACHE_PASSWORD=${APP_CACHE_PASSWORD:-cache}
      - APP_SEGMENT_WRITE_KEY=${APP_SEGMENT_WRITE_KEY}
      - APP_SEGMENT_ENDPOINT=${APP_SEGMENT_ENDPOINT:-http://mock-segment:9999}
      - APP_ENTITLEMENT_ID=${APP_ENTITLEMENT_ID}
      - APP_CONTAINER_IMAGE_VERSION=${APP_CONTAINER_IMAGE_VERSION:-dev}
      - APP_S3_ENDPOINT_URL=${APP_S3_ENDPOINT_URL:-http://moto:5000}
      - APP_S3_BUCKET_NAME=${APP_S3_BUCKET_NAME:-orchestrator-files}
      - APP_S3_REGION=${APP_S3_REGION:-us-east-1}
      - APP_S3_ACCESS_KEY_ID=${APP_S3_ACCESS_KEY_ID:-testing}
      - APP_S3_SECRET_ACCESS_KEY=${APP_S3_SECRET_ACCESS_KEY:-testing}
      - APP_S3_VERIFY_SSL=${APP_S3_VERIFY_SSL:-false}
      - APP_S3_USE_PATH_STYLE=${APP_S3_USE_PATH_STYLE:-true}
      - APP_S2S_TLS_ENABLED=${APP_S2S_TLS_ENABLED:-true}
      - APP_S2S_TLS_CA_CERT_PATH=/run/secrets/s2s-ca.pem
      - APP_S2S_TLS_CERT_PATH=/run/secrets/s2s-cert.crt
      - APP_S2S_TLS_KEY_PATH=/run/secrets/s2s-cert.key
      - APP_JWT_PRIVATE_KEY_PATH=/run/secrets/jwt-primary.pem
      - APP_JWT_BACKUP_KEYS=[{"key_id":"orchestrator-backup","key_path":"/run/secrets/jwt-backup.pem"}]
      - APP_SECRET_ENCRYPTION_KEY_PATH=/run/secrets/encryption-key
    volumes:
      - ./backend/src:/opt/app-root/src/src:z
      - ./backend/.secrets/jwt-primary.pem:/run/secrets/jwt-primary.pem:ro,z
      - ./backend/.secrets/jwt-backup.pem:/run/secrets/jwt-backup.pem:ro,z
      - ./backend/.secrets/encryption-key:/run/secrets/encryption-key:ro,z
      - ./backend/.secrets/certs/ca.pem:/run/secrets/s2s-ca.pem:ro,z
      - ./backend/.secrets/certs/background-worker.crt:/run/secrets/s2s-cert.crt:ro,z
      - ./backend/.secrets/certs/background-worker.key:/run/secrets/s2s-cert.key:ro,z
    depends_on:
      database:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      moto:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'cat /proc/[0-9]*/cmdline 2>/dev/null | grep -qa syntara.workflows.background_worker']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  mcp-server:
    build:
      context: ./backend
      dockerfile: containers/mcp/Containerfile
    image: ${MCP_IMAGE:-localhost/syntara-mcp:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8765"
    environment:
      - APP_FALLBACK_LOG_LEVEL=${APP_FALLBACK_LOG_LEVEL:-INFO}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8765/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mock-segment:
    image: ${MOCK_SEGMENT_IMAGE:-quay.io/ansible/dummy-segment@sha256:9f8a58b56f3dc1d0fa363bd67a85e68a710819760bc56a38017c1e772c3f6a2e}
    ports:
      - ${SEGMENT_SERVER_PORT:-9999}:9999
    healthcheck:
      test: [CMD-SHELL, 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:9999/health\")"']
      interval: 3s
      timeout: 3s
      retries: 5
    profiles:
      - telemetry-e2e

volumes:
  syntara_postgres_data:
    driver: local
  syntara_audit_exports:
    driver: local
