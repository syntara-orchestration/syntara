---
name: Markdown Links

on:
  pull_request:
    paths:
      - '*.md'
      - '**/*.md'
      - '*.markdown'
      - '**/*.markdown'
      - '.github/workflows/ci-markdown-links.yml'
      - '.github/scripts/.nvmrc'
      - '.github/scripts/package.json'
      - '.github/scripts/package-lock.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  markdown-links:
    name: Check local Markdown links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .github/scripts/.nvmrc
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts

      - name: Prepare MkDocs documentation paths
        # MkDocs resolves links through these site-relative paths.
        run: |
          if [ "$(readlink docs/backend)" != "../backend/docs" ]; then
            echo "Unexpected docs/backend link target." >&2
            exit 1
          fi
          if [ "$(readlink docs/frontend)" != "../frontend/docs" ]; then
            echo "Unexpected docs/frontend link target." >&2
            exit 1
          fi
          if find backend/docs frontend/docs -type l -print -quit | grep -q .; then
            echo "Nested symlinks are not supported in Markdown docs." >&2
            exit 1
          fi

          cp -RL docs/backend "$RUNNER_TEMP/backend-docs"
          cp -RL docs/frontend "$RUNNER_TEMP/frontend-docs"
          rm docs/backend docs/frontend
          mv "$RUNNER_TEMP/backend-docs" docs/backend
          mv "$RUNNER_TEMP/frontend-docs" docs/frontend

      - name: Check local Markdown links
        # The CLI's text report includes findings and a summary.
        # Check paths as MkDocs sees them.
        run: >-
          .github/scripts/node_modules/.bin/md-link-lint
          --exclude 'backend/docs/**'
          --exclude 'frontend/docs/**'
