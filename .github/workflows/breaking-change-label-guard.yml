---
# Walk phase: consumes reusable approval workflow from ansible/actions.
# Replaces the inlined crawl-phase label guard with GitHub App-based auth.
name: Breaking Change Label Guard

on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  authorize:
    uses: ansible/actions/.github/workflows/approval-label-authorization.yml@main
    with:
      approval-label: breaking-change-approved
      team-slug: ansible-staff-eng-leads
      app-client-id: ${{ vars.LABEL_AUTH_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.LABEL_AUTH_APP_PRIVATE_KEY }}
