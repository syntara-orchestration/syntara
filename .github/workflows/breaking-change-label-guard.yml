---
# Walk phase: consumes reusable approval workflow from ansible/actions (PR #164).
# Replaces the inlined crawl-phase label guard with GitHub App-based auth.
# Jira: AAP-97532 (AC2), AAP-91965
name: Breaking Change Label Guard

on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  authorize:
    # djyasin/actions for test; production: ansible/actions@<tag>
    uses: djyasin/actions/.github/workflows/approval-label-authorization.yml@AAP-91965_approvers-team-label # PR #164
    with:
      approval-label: breaking-change-approved
      team-slug: ansible-staff-eng-leads
      app-client-id: ${{ vars.LABEL_AUTH_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.LABEL_AUTH_APP_PRIVATE_KEY }}
