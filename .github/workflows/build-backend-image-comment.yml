---
name: Build Backend Container Image (PR Comment)

on:
  issue_comment:
    types: [created]

concurrency:
  group: build-backend-pr-image-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Resolve the PR branch and validate the commenter has write access before
  # triggering the build. Outputs are passed to the reusable build workflow.
  prepare:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/build-pr-image' &&
      contains(fromJson('["OWNER","MEMBER"]'), github.event.comment.author_association)
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: React to acknowledge the command
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Get PR details
        id: pr
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            // Use the commit SHA rather than the branch name to prevent TOCTOU
            // issues if the branch is force-pushed after the comment is left.
            core.setOutput('ref', pr.data.head.sha);
            core.setOutput('pr_number', String(context.issue.number));

  build:
    needs: prepare
    uses: ./.github/workflows/_build-backend-image.yml
    secrets:
      RH_REGISTRY_USER: ${{ secrets.RH_REGISTRY_USER }}
      RH_REGISTRY_TOKEN: ${{ secrets.RH_REGISTRY_TOKEN }}
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}

  notify:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.result == 'success'
    permissions:
      pull-requests: write

    steps:
      - name: Post build result comment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === 'success';
            const prNumber = process.env.PR_NUMBER;
            const runUrl = process.env.RUN_URL;
            const tag = `quay.io/ansible/syntara:pr-${prNumber}`;
            const body = success
              ? `Image built and queued for push.\n\nTag: \`${tag}\`\n\n[View run](${runUrl})`
              : `Image build failed. [View run](${runUrl})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
