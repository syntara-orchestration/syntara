---
name: Deploy Frontend to Production

on:
  push:
    branches:
      - devel
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend-image-devel.yml'
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push syntara-ui image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend/
          file: frontend/packages/syntara-ui/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/syntara-ui:latest
            ghcr.io/${{ github.repository_owner }}/syntara-ui:${{ github.sha }}
            quay.io/ansible/syntara-ui:latest
            quay.io/ansible/syntara-ui:${{ github.sha }}

      - name: Build and push syntara-mock-api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend/
          file: frontend/packages/syntara-mock-api/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/syntara-mock-api:latest
            ghcr.io/${{ github.repository_owner }}/syntara-mock-api:${{ github.sha }}
