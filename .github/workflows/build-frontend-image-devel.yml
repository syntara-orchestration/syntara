---
name: Deploy Frontend to Production

on:
  push:
    branches:
      - devel
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend-image-devel.yml'
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push syntara-ui image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend/
          file: frontend/packages/syntara-ui/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            quay.io/ansible/syntara-ui:latest
            quay.io/ansible/syntara-ui:${{ github.sha }}
