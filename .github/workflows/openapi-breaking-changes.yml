---
# Detect OpenAPI breaking changes and contract regeneration needs.
#
# Extracted from CI Backend so that the companion comment workflow
# (openapi-breaking-changes-comment.yml) fires as soon as this finishes,
# rather than waiting for the full test suite.
name: OpenAPI Breaking Changes

on:
  pull_request:
    branches: [devel, early-access]
    paths:
      - 'backend/**'
      - 'frontend/packages/syntara-contracts/src/**'
      - '.github/workflows/openapi-breaking-changes*.yml'

concurrency:
  group: openapi-breaking-changes-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Fetch base branch for comparison
        run: git fetch origin ${{ github.base_ref }}

      - name: Detect OpenAPI spec changes
        id: detect
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx 'backend/src/syntara/schemas/openapi.yaml'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Save PR metadata
        if: steps.detect.outputs.changed == 'true'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Save PR body
        if: steps.detect.outputs.changed == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync('pr-body.txt', context.payload.pull_request.body || '');

      - name: Set up Python
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install oasdiff
        if: steps.detect.outputs.changed == 'true'
        run: ./scripts/openapi/install-oasdiff.sh
        working-directory: backend

      - name: Check for breaking changes
        if: steps.detect.outputs.changed == 'true'
        id: breaking
        continue-on-error: true
        run: |
          PR_BODY=$(cat "$GITHUB_WORKSPACE/pr-body.txt")
          ./scripts/openapi/check-breaking-changes.py \
            --base origin/${{ github.base_ref }} \
            --head HEAD \
            --output breaking-results.json \
            --fallback-spec-path backend/src/syntara/schemas/openapi.yaml \
            --pr-body "$PR_BODY"
        working-directory: backend

      - name: Check contract regeneration
        if: steps.detect.outputs.changed == 'true'
        run: |
          PR_BODY=$(cat "$GITHUB_WORKSPACE/pr-body.txt")
          ./scripts/openapi/check-contract-regeneration.py \
            --changed-files-from ${{ github.base_ref }} \
            --output contract-regeneration-results.json \
            --pr-body "$PR_BODY"
        working-directory: backend

      - name: Upload OpenAPI check results
        if: always() && steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-check-results
          path: |
            pr-number.txt
            backend/breaking-results.json
            backend/contract-regeneration-results.json
          if-no-files-found: warn
          retention-days: 1
