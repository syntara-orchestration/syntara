---
# Walk phase: consumes reusable oasdiff workflow from ansible/actions (PR #161).
# Replaces the inlined crawl-phase implementation.
name: OpenAPI Breaking Changes

on:
  pull_request:
    branches: [devel, early-access]
    paths:
      - 'backend/src/syntara/schemas/openapi.yaml'
      - '.github/workflows/openapi-breaking-changes*.yml'

concurrency:
  group: openapi-breaking-changes-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    # djyasin/actions for test; production: ansible/actions@<tag>
    uses: djyasin/actions/.github/workflows/oasdiff-detect-breaking-changes.yml@feat/oasdiff-breaking-change-detection # PR #161
    with:
      spec-path: backend/src/syntara/schemas/openapi.yaml
