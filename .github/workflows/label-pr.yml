---
name: Label PR
on:
  # pull_request_target so the token has write access for fork PRs (safe — no fork code is checked out or executed).
  # See: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request_target:~:text=This%20event%20allows%20your%20workflow%20to%20do%20things%20like%20label%20or%20comment%20on%20pull%20requests%20from%20forks.
  pull_request_target:
    types: [opened, synchronize, reopened] # cover full PR lifecycle so labels stay accurate after force-pushes or reopens
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          sync-labels: true
