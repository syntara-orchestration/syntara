---
name: Build Backend Container Image (Reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (defaults to the caller's ref)
        type: string
        required: false
        default: ''
      pr_number:
        description: PR number to tag the image with (leave empty for non-PR builds)
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'syntara-orchestration/syntara'
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Required for multi-arch builds: emulates ARM64 on the amd64 runner so
      # Docker Buildx can compile the linux/arm64 platform target natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to registry.redhat.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RH_REGISTRY_USER }}
          password: ${{ secrets.RH_REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            quay.io/ansible/syntara
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend/
          file: backend/containers/syntara/Containerfile
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/syntara-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image tags to file
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '%s\n' "$IMAGE_TAGS" > /tmp/syntara-image-tag.txt

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-syntara-image
          path: |
            /tmp/syntara-image.tar
            /tmp/syntara-image-tag.txt
          retention-days: 1
