---
name: Build Backend Container Image (Reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (defaults to the caller's ref)
        type: string
        required: false
        default: ''
      pr_number:
        description: PR number to tag the image with (leave empty for non-PR builds)
        type: string
        required: false
        default: ''
    secrets:
      RH_REGISTRY_USER:
        required: true
      RH_REGISTRY_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository == 'syntara-orchestration/syntara'
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Required for multi-arch builds: emulates ARM64 on the amd64 runner so
      # Docker Buildx can compile the linux/arm64 platform target natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry.redhat.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RH_REGISTRY_USER }}
          password: ${{ secrets.RH_REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/ansible/syntara
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend/
          file: backend/containers/syntara/Containerfile
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/syntara-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image tags to file
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '%s\n' "$IMAGE_TAGS" > /tmp/syntara-image-tag.txt

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-syntara-image
          path: |
            /tmp/syntara-image.tar
            /tmp/syntara-image-tag.txt
          retention-days: 1
