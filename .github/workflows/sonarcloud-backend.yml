---
name: SonarCloud Upload (Backend)

# Fallback for fork PRs: runs in the base repo context (has access to secrets)
# after the CI Backend workflow completes. Fork PRs cannot access repository
# secrets from pull_request workflows, so this workflow_run approach is needed.
# Non-fork PRs use the faster inline SonarCloud job in ci-backend.yml instead.
#
# SECURITY: This workflow checks out fork code and has access to SONAR_TOKEN.
# It is safe because (1) this YAML is loaded from the default branch, not the
# fork, (2) all actions are pinned to commit SHAs, and (3) no repo scripts or
# user-controlled code is executed after checkout — only the pinned SonarCloud
# scan action. Do NOT add steps that run fork-controlled code (npm, make, etc.).
on:
  workflow_run:
    workflows:
      - CI Backend
    types:
      - completed

permissions: read-all

jobs:
  sonarcloud:
    name: SonarCloud Upload (Backend)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name != github.event.workflow_run.repository.full_name
    # SonarCloud quality gate failures are informational, not blocking.
    # Without this, a failed gate marks the entire PR pipeline as failed.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          show-progress: false

      # Download coverage artifacts from the test job (same workflow run)
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage-combined
          path: backend
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Fetch PR Number artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-pr_number
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract PR Number
        run: |
          cat pr_number.txt
          PR_NUM=$(head -n1 pr_number.txt | awk '{print $2}')
          echo "Found PR number: $PR_NUM"
          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_ENV

      - name: Get Additional PR Information
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}")
          echo "PR_BASE=$(echo "$PR_DATA" | jq -r '.base.ref')" >> $GITHUB_ENV
          echo "PR_HEAD=$(echo "$PR_DATA" | jq -r '.head.ref')" >> $GITHUB_ENV

      - name: Checkout PR branch
        run: |
          gh pr checkout ${{ env.PR_NUMBER }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare SonarCloud args
        shell: bash
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"

          SONAR_ARGS="-Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACKEND }}"
          SONAR_ARGS="${SONAR_ARGS} -Dsonar.organization=${{ vars.SONAR_ORG }}"
          SONAR_ARGS="${SONAR_ARGS} -Dsonar.scm.revision=$COMMIT_SHA"
          SONAR_ARGS="${SONAR_ARGS} -Dsonar.pullrequest.key=$PR_NUMBER"
          SONAR_ARGS="${SONAR_ARGS} -Dsonar.pullrequest.branch=$PR_HEAD"
          SONAR_ARGS="${SONAR_ARGS} -Dsonar.pullrequest.base=$PR_BASE"

          echo "SONAR_ARGS=$SONAR_ARGS" >> $GITHUB_ENV

      - name: Check for coverage files
        run: |
          COVERAGE_FILES=$(find backend -name "coverage.xml" -type f 2>/dev/null | wc -l)
          if [ "$COVERAGE_FILES" -gt 0 ]; then
            echo "Coverage Data: Available ($COVERAGE_FILES file(s) found)"
            find backend -name "coverage.xml" -type f | sed 's/^/  /'
          else
            echo "Coverage Data: Not available - exiting"
            exit 1
          fi

          echo "Running SonarCloud analysis..."

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
        with:
          projectBaseDir: backend
          args: ${{ env.SONAR_ARGS }}
