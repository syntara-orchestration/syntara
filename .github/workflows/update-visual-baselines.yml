---
name: Update Visual Baselines

# Dispatched by update-screenshots-listener.yml after validating a
# /update-screenshots PR comment. Using workflow_dispatch instead of
# issue_comment prevents bot report comments (which contain the literal
# text "/update-screenshots") from creating ghost "skipped" runs.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string
      pr_ref:
        description: 'PR head branch ref'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-screenshots-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  update-baselines:
    name: Generate & Commit Baselines
    # Baselines must run with mock webServer; do not inherit org/repo env that sets
    # SYNTARA_E2E_SKIP_WEB_SERVER for real-backend E2E (would skip all snapshot tests).
    env:
      SYNTARA_E2E_SKIP_WEB_SERVER: ''
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        env:
          PR_REF: ${{ inputs.pr_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # + and = added to support branch names like worktree-fix+visual-regression-flakiness
          if [[ ! "${PR_REF}" =~ ^[a-zA-Z0-9._/+=-]+$ ]]; then
            echo "::error::Invalid branch ref: '${PR_REF}'"
            exit 1
          fi
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: '${PR_NUMBER}'"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        # Checks out GitHub's own precomputed test-merge-commit (this branch merged into its
        # testing stale code.
        # exist and the checkout step below fails with a clear error instead of silently
        # ran against the merged tree. If the PR has a real merge conflict, this ref won't
        # the base would drift the next time weekly cron or a follow-up /update-screenshots
        # after merge: if we generated them from the raw branch only, pages also touched on
        # base) rather than the raw branch head. Baselines should match the UI as it will look
        id: checkout
        continue-on-error: true
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.checkout.outcome != 'failure'
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        if: steps.checkout.outcome != 'failure'
        working-directory: frontend

      # HEAD is refs/pull/<N>/merge — a synthetic 2-parent commit where parent 1
      # is the base branch tip and parent 2 is this PR's actual head. Diffing
      # them gives exactly this PR's changed files. scope-visual-regression.ts
      # is an allowlist: it only narrows the run when every changed file falls
      # under a known-safe, isolated route folder, and defaults to a full run
      # for anything ambiguous (shared components, hooks, the mock API, the
      # test infra itself). See that file for the full rationale and the
      # weekly-cron backstop that limits the blast radius of a wrong rule.
      - name: Determine visual regression scope
        id: scope
        if: steps.checkout.outcome != 'failure'
        working-directory: frontend/packages/syntara-ui
        run: |
          set -uo pipefail
          if ! CHANGED=$(git diff --name-only HEAD^1 HEAD^2); then
            echo "::warning::Could not diff merge-commit parents; falling back to a full run"
            echo "result=FULL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Deliberately no `set -e`: a crash in the scope script itself should
          # fail open to a full run (same policy as the git-diff failure above),
          # not skip screenshot generation entirely. Handle that explicitly
          # rather than relying on an empty $SCOPE_LINE producing an empty
          # --grep pattern that happens to match everything.
          if ! SCOPE_LINE=$(printf '%s\n' "$CHANGED" | npm exec tsx -- scripts/scope-visual-regression.ts); then
            echo "::warning::scope-visual-regression.ts failed; falling back to a full run"
            echo "result=FULL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=${SCOPE_LINE#SCOPE=}" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        if: steps.checkout.outcome != 'failure' && steps.scope.outcome != 'failure' && steps.scope.outputs.result != 'NONE'
        run: npx playwright install --with-deps chromium
        working-directory: frontend/packages/syntara-ui

      - name: Generate screenshots
        id: screenshots
        if: steps.checkout.outcome != 'failure' && steps.scope.outcome != 'failure' && steps.scope.outputs.result != 'NONE'
        continue-on-error: true
        env:
          VR_SCOPE: ${{ steps.scope.outputs.result }}
        run: |
          # Match visual-regression-schedule.yml: --workers=1 avoids rAF throttling
          # under Playwright's CI default (workers: 3, fullyParallel: true).
          # Use update-snapshots=all (not the default "changed"): brand-logo masks
          # are only ~784px and stay under maxDiffPixelRatio 0.005, so "changed"
          # would leave most baselines with unmasked logos.
          if [[ "$VR_SCOPE" == "FULL" ]]; then
            npx playwright test e2e/visual-regression/page-screenshots.spec.ts --update-snapshots=all --workers=1
          else
            npx playwright test e2e/visual-regression/page-screenshots.spec.ts --update-snapshots=all --workers=1 --grep "$VR_SCOPE"
          fi
        working-directory: frontend/packages/syntara-ui

      - name: Upload Playwright results on failure
        if: steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-update-baselines-results
          path: |
            frontend/packages/syntara-ui/test-results/
            frontend/packages/syntara-ui/playwright-report/
          retention-days: 7

      # Run on success OR failure: screenshots uses continue-on-error, so a
      # mid-suite failure can still leave rewritten PNGs that Detect would
      # otherwise stage unfiltered. No continue-on-error: a filter crash must
      # fail the job rather than Detect staging unfiltered noise.
      - name: Filter noisy baseline diffs
        id: filter-noise
        if: always() && steps.checkout.outcome != 'failure' && steps.screenshots.outcome != 'skipped'
        working-directory: frontend/packages/syntara-ui
        run: npm exec tsx -- scripts/filter-noisy-baseline-diffs.ts

      - name: Detect changed baselines
        id: detect
        if: steps.checkout.outcome != 'failure'
        working-directory: frontend/packages/syntara-ui
        run: |
          git add e2e/visual-regression/page-screenshots.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            ADDED=$(git diff --cached --diff-filter=A --name-only --relative | wc -l | tr -d ' ')
            MODIFIED=$(git diff --cached --diff-filter=M --name-only --relative | wc -l | tr -d ' ')
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "added=${ADDED}" >> $GITHUB_OUTPUT
            echo "modified=${MODIFIED}" >> $GITHUB_OUTPUT
            SNAPSHOT_PREFIX="e2e/visual-regression/page-screenshots.spec.ts-snapshots/"
            while IFS= read -r file; do
              if [[ "${file}" != "${SNAPSHOT_PREFIX}"* ]]; then
                echo "::error::Unexpected file outside snapshot dir: ${file}"
                exit 1
              fi
            done < <(git diff --cached --name-only --relative)
            git diff --cached --name-only --relative > /tmp/changed-baselines.txt
          fi

      - name: Commit updated baselines (signed via API)
        id: commit
        if: steps.detect.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PR_REF: ${{ inputs.pr_ref }}
          ADDED: ${{ steps.detect.outputs.added }}
          MODIFIED: ${{ steps.detect.outputs.modified }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prRef = process.env.PR_REF;
            // + and = added to support branch names like worktree-fix+visual-regression-flakiness
            if (!/^[a-zA-Z0-9.\/_+=-]+$/.test(prRef)) {
              core.setFailed(`Invalid branch ref: '${prRef}'`);
              return;
            }

            const added = process.env.ADDED || '0';
            const modified = process.env.MODIFIED || '0';
            const message = `chore: update visual regression baselines (${added} new, ${modified} changed)`;

            const changedFiles = fs.readFileSync('/tmp/changed-baselines.txt', 'utf8')
              .trim().split('\n').filter(Boolean);

            if (changedFiles.length === 0) {
              core.setOutput('committed', 'false');
              return;
            }

            const snapshotPrefix = 'e2e/visual-regression/page-screenshots.spec.ts-snapshots/';
            for (const file of changedFiles) {
              if (!file.startsWith(snapshotPrefix) || file.includes('..')) {
                core.setFailed(`Unexpected file path: '${file}'`);
                return;
              }
            }

            const headRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${prRef}`,
            });
            const headSha = headRef.data.object.sha;

            const treeEntries = [];
            for (const file of changedFiles) {
              const fullPath = `frontend/packages/syntara-ui/${file}`;
              const content = fs.readFileSync(
                path.join(process.env.GITHUB_WORKSPACE, fullPath)
              );
              const blob = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: content.toString('base64'),
                encoding: 'base64',
              });
              treeEntries.push({
                path: fullPath,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha,
              });
            }

            const tree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: headSha,
              tree: treeEntries,
            });

            const commit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message,
              tree: tree.data.sha,
              parents: [headSha],
            });

            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${prRef}`,
              sha: commit.data.sha,
            });

            core.info(`Created verified commit ${commit.data.sha}`);
            core.setOutput('committed', 'true');
            core.setOutput('added', added);
            core.setOutput('modified', modified);

      - name: Post result comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          COMMITTED: ${{ steps.commit.outputs.committed || 'false' }}
          ADDED: ${{ steps.detect.outputs.added }}
          MODIFIED: ${{ steps.detect.outputs.modified }}
          CHECKOUT_FAILED: ${{ steps.checkout.outcome == 'failure' }}
          FILTER_FAILED: ${{ steps.filter-noise.outcome == 'failure' }}
          TESTS_FAILED: ${{ steps.screenshots.outcome == 'failure' || steps.screenshots.conclusion == 'failure' }}
          COMMIT_FAILED: ${{ steps.commit.outcome == 'failure' }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          HAS_CHANGES: ${{ steps.detect.outputs.has_changes }}
          VR_SCOPE: ${{ steps.scope.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const committed = process.env.COMMITTED === 'true';
            const added = process.env.ADDED || '0';
            const modified = process.env.MODIFIED || '0';
            const checkoutFailed = process.env.CHECKOUT_FAILED === 'true';
            const filterFailed = process.env.FILTER_FAILED === 'true';
            const testsFailed = process.env.TESTS_FAILED === 'true';
            const commitFailed = process.env.COMMIT_FAILED === 'true';
            const commitOutcome = process.env.COMMIT_OUTCOME || '';
            const hasChanges = process.env.HAS_CHANGES === 'true';
            const runUrl = process.env.RUN_URL;
            const vrScope = process.env.VR_SCOPE || '';
            const scopeNote =
              vrScope === 'NONE'
                ? '_No files under `frontend/packages/syntara-ui/` changed — nothing to screenshot._'
                : vrScope === 'FULL' || vrScope === ''
                  ? '_Ran the full page suite (either a shared file changed, or scoping could not be determined)._'
                  : `_Ran only the pages this PR could affect — filtered with \`--grep\`. The full suite still runs every Monday._`;

            let body;
            if (checkoutFailed) {
              body = [
                '### :x: Visual baselines not updated — merge conflict with the base branch',
                '',
                "This PR's automatic test-merge could not be checked out, which means it has a real " +
                  'merge conflict with its base branch (baselines are generated against that same ' +
                  'merge, since that\'s what PR CI actually renders — see the workflow file for why).',
                '',
                'Merge or rebase onto the base branch locally, push, then re-run `/update-screenshots`.',
              ].join('\n');
            } else if (filterFailed) {
              body = [
                '### :x: Visual baselines not updated — noise filter failed',
                '',
                'Screenshots were generated but the keep/restore filter crashed, so no baselines were committed.',
                '',
                `Check the [workflow run](${runUrl}) logs for the Filter noisy baseline diffs step.`,
              ].join('\n');
            } else if (commitFailed && testsFailed) {
              body = [
                '### :x: Visual baselines not updated — screenshot generation and commit both failed',
                '',
                'Screenshot generation failed, and the commit step also encountered an error.',
                '',
                `Check the [workflow run](${runUrl}) logs and the \`frontend-update-baselines-results\` artifact for details.`,
              ].join('\n');
            } else if (commitFailed) {
              body = [
                '### :x: Visual baselines not updated — commit/push failed',
                '',
                'Screenshots were generated but could not be committed to the branch.',
                '',
                `Check the [workflow run](${runUrl}) logs for details.`,
              ].join('\n');
            } else if (committed && testsFailed) {
              body = [
                '### :camera: Visual baselines partially updated',
                '',
                `- **${added}** new baseline(s) added`,
                `- **${modified}** existing baseline(s) updated`,
                '',
                ':warning: Some screenshot tests failed — baselines for passing tests were committed, but failing tests still need fixes in `page-registry.ts`.',
                '',
                `Check the [workflow run](${runUrl}) logs and the \`frontend-update-baselines-results\` artifact for details.`,
              ].join('\n');
            } else if (committed) {
              body = [
                '### :camera: Visual baselines updated',
                '',
                `- **${added}** new baseline(s) added`,
                `- **${modified}** existing baseline(s) updated`,
                '',
                'The updated `-linux.png` files have been committed to this branch.',
                'Review the image diffs in the Files Changed tab.',
                '',
                scopeNote,
              ].join('\n');
            } else if (testsFailed) {
              body = [
                '### :warning: Visual baselines not updated — test failures',
                '',
                'Screenshot generation failed for one or more pages. No baselines were committed.',
                '',
                `Check the [workflow run](${runUrl}) logs and the \`frontend-update-baselines-results\` artifact for details — the \`page-registry.ts\` entry likely has a locator or setup error.`,
              ].join('\n');
            } else if (hasChanges && commitOutcome !== 'success') {
              // The commit step only runs when detect found staged changes (has_changes
              // === 'true'), so if it's not 'success' here it's something other than
              // "nothing to commit" — e.g. cancelled mid-run — worth a distinct warning
              // rather than silently falling into the "already up to date" message below.
              body = [
                '### :warning: Visual baselines update did not complete',
                '',
                'The workflow hit an error before baseline generation completed.',
                '',
                `Check the [workflow run](${runUrl}) logs for details.`,
              ].join('\n');
            } else {
              body = [
                '### :white_check_mark: Visual baselines already up to date',
                '',
                'No screenshot PNG changes were committed — generated images match the baselines already on this branch.',
                '',
                scopeNote,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Fail job if checkout, scoping, screenshots, filter, or commit had errors
        if: >-
          steps.checkout.outcome == 'failure' ||
          steps.scope.outcome == 'failure' ||
          steps.screenshots.outcome == 'failure' ||
          steps.filter-noise.outcome == 'failure' ||
          steps.detect.outcome == 'failure' ||
          steps.commit.outcome == 'failure'
        run: |
          echo "::error::Merge-commit checkout, scope detection, screenshot generation, noise filter, or commit had failures — see comment on PR"
          exit 1
