---
# Keep backend/requirements.txt in sync with backend/uv.lock on Konflux
# MintMaker PRs.
#
# SECURITY: this workflow checks out PR code and commits with `contents: write`.
# It is safe ONLY because of the layered guards below; do NOT remove any of them:
#   1. The `if:` guard restricts execution to the Konflux MintMaker bot on its
#      own branch prefix. Those PRs originate from branches in THIS repository
#      (not forks), so `pull_request` grants the write token the sync needs
#      without `pull_request_target`.
#   2. The requirements are regenerated with an inline `uv export` + the tracked
#      hash-filter script — no Makefile from the PR tree is trusted to drive the
#      sync.
#   3. The commit goes through the GitHub Contents API, not `git push`.
#
# This replaces an earlier `pull_request_target` trigger. GitHub blocks
# `pull_request_target` by default on public repositories from 2026-12-02;
# because MintMaker PRs are same-repo (non-fork), plain `pull_request` is the
# correct, admin-independent replacement here.
name: Konflux Requirements

on:
  pull_request:
    branches: [devel, early-access]
    paths:
      - backend/uv.lock
      - backend/requirements.txt

concurrency:
  group: konflux-requirements-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    if: startsWith(github.head_ref, 'konflux/mintmaker') && github.actor == 'red-hat-konflux-kflux-prd-rh03[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout PR code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Sync requirements.txt
        # Inline export + hash filter, mirroring `make sync-requirements`, so the
        # sync logic does not depend on a Makefile read from the PR tree.
        working-directory: backend
        run: |
          uv export --frozen --python=3.12 --no-dev --no-editable \
            --no-emit-package pywin32 --no-emit-package colorama \
            --no-emit-workspace --output-file requirements.txt
          uv run python tools/ci/filter_requirements_hashes.py

      - name: Commit via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet backend/requirements.txt; then
            echo "requirements.txt is already in sync"
            exit 0
          fi

          SHA=$(gh api "repos/${{ github.repository }}/contents/backend/requirements.txt?ref=${PR_HEAD_REF}" \
            --jq '.sha')

          TMPFILE=$(mktemp)
          base64 -w 0 backend/requirements.txt > "$TMPFILE"
          jq -Rs \
            --arg message "chore: sync requirements.txt with uv.lock" \
            --arg sha "$SHA" \
            --arg branch "${PR_HEAD_REF}" \
            '{message: $message, content: ., sha: $sha, branch: $branch}' \
            "$TMPFILE" \
            | gh api --method PUT repos/${{ github.repository }}/contents/backend/requirements.txt \
              --input -
