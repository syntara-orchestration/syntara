---
# SECURITY: This workflow uses pull_request_target (runs in base repo context
# with write permissions) and checks out PR code. This is safe ONLY because:
# 1. The `if:` guard restricts to Konflux bot PRs (specific actor + branch prefix)
# 2. `make sync-requirements` is a deterministic uv export + hash filter, not arbitrary code
# 3. Commits go through the GitHub API, not git push
# If modifying this workflow, do NOT remove the actor/branch guards.
name: Konflux Requirements

on:
  pull_request_target:
    branches: [devel, early-access]
    paths:
      - backend/uv.lock
      - backend/requirements.txt

concurrency:
  group: konflux-requirements-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'konflux/mintmaker') && github.actor == 'red-hat-konflux-kflux-prd-rh03[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout PR code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Sync requirements.txt
        run: make sync-requirements
        working-directory: backend

      - name: Commit via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet backend/requirements.txt; then
            echo "requirements.txt is already in sync"
            exit 0
          fi

          SHA=$(gh api "repos/${{ github.repository }}/contents/backend/requirements.txt?ref=${PR_HEAD_REF}" \
            --jq '.sha')

          TMPFILE=$(mktemp)
          base64 -w 0 backend/requirements.txt > "$TMPFILE"
          jq -Rs \
            --arg message "chore: sync requirements.txt with uv.lock" \
            --arg sha "$SHA" \
            --arg branch "${PR_HEAD_REF}" \
            '{message: $message, content: ., sha: $sha, branch: $branch}' \
            "$TMPFILE" \
            | gh api --method PUT repos/${{ github.repository }}/contents/backend/requirements.txt \
              --input -
