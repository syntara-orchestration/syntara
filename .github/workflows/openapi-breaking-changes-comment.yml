---
# Walk phase: consumes reusable comment workflow from ansible/actions (PR #161).
# Replaces the inlined crawl-phase comment scripts.
name: OpenAPI Breaking Changes Comment

on:
  workflow_run:
    workflows: ["OpenAPI Breaking Changes"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    # djyasin/actions for test; production: ansible/actions@<tag>
    uses: djyasin/actions/.github/workflows/oasdiff-post-breaking-change-comment.yml@feat/oasdiff-breaking-change-detection # PR #161
