---
# Walk phase: consumes reusable comment workflow from ansible/actions.
# Replaces the inlined crawl-phase comment scripts.
name: OpenAPI Breaking Changes Comment

on:
  workflow_run:
    workflows: ["OpenAPI Breaking Changes"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    uses: ansible/actions/.github/workflows/oasdiff-post-breaking-change-comment.yml@main
