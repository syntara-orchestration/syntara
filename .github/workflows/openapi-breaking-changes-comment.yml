---
# Walk phase: consumes reusable comment workflow from ansible/actions (PR #161).
# Replaces the inlined crawl-phase comment scripts.
name: OpenAPI Breaking Changes Comment

on:
  workflow_run:
    workflows: ["OpenAPI Breaking Changes"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    # TODO: move to ansible/actions@<release-tag> after PR #161 merges
    uses: djyasin/actions/.github/workflows/oasdiff-post-breaking-change-comment.yml@c44320d35477ed38e7f4932848d3dd15e1c212f8 # PR #161, feat/oasdiff-breaking-change-detection branch
