name: Merge Queue Dequeue Alert

on:
  merge_group:
    types: [checks_requested]

jobs:
  dequeue-burst-detection:
    runs-on: ubuntu-latest
    if: github.event.merge_group.head_sha != ''
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts

      - name: Check for dequeue burst and notify
        run: npm run check-dequeue-burst
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_CI_MONITORING_WEBHOOK_URL: ${{ secrets.SLACK_CI_MONITORING_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_HEAD_REF: ${{ github.event.merge_group.head_ref }}
