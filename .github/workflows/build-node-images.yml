---
name: Build SDK node images
on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/nodes/**
      - .github/workflows/build-node-images.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: make -C backend/nodes install test typecheck
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [http-request, agent, script, aap-job, aap-workflow]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend/nodes
          file: backend/nodes/${{ matrix.node }}/Containerfile
          push: false
          tags: syntara-node-${{ matrix.node }}:sha-${{ github.sha }}
          outputs: type=oci,dest=/tmp/node-image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: syntara-node-${{ matrix.node }}-${{ github.sha }}
          path: /tmp/node-image.tar
          retention-days: 7
