---
name: DAST

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    # TODO(alex): temporal workaround, actions/runner-images#14473 will fix it
    # The 20260726.254 ubuntu-24.04 image ships a static podman 5.8.4 bundle
    # that resolves a stale crun ("unknown version specified" on every RUN
    # step) and, being built without systemd support, never runs healthchecks,
    # so compose hangs waiting for services to become healthy. ubuntu-latest
    # has a working distro podman; move back to ubuntu-latest once fixed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install dependencies
        run: make install
        working-directory: backend

      - name: Generate secrets
        run: make secrets-generate
        working-directory: backend

      - name: Start services with podman-compose
        timeout-minutes: 5
        env:
          # RapidAST loads the live OpenAPI spec; docs must be enabled for that endpoint.
          APP_ENABLE_API_DOCS: "true"
        run: |
          uvx podman-compose -f ../podman-compose.yml -p syntara-ci up --build -d database redis temporal syntara
        working-directory: backend

      - name: Verify services are healthy
        timeout-minutes: 5
        run: |
          echo "Waiting for services to become healthy..."
          podman wait --condition=healthy \
            syntara-ci_database_1 \
            syntara-ci_temporal_1 \
            syntara-ci_syntara_1
          echo "All services are healthy"

      - name: Verify Syntara API is reachable
        run: |
          curl -sf http://localhost:8000/health

      - name: Create results directory
        run: mkdir -p backend/dast/results

      - name: Write GCP key file
        env:
          GCS_KEY: ${{ secrets.RAPIDAST_GCP_KEY }}
        run: printenv GCS_KEY > "${{ runner.temp }}/gcs-key.json"

      - name: Run RapidAST scan
        continue-on-error: true
        run: |
          podman run --rm --network=host \
            -v ${{ github.workspace }}/backend/dast/rapidast-config.yaml:/opt/rapidast/config/config.yaml:z \
            -v ${{ github.workspace }}/backend/dast/results:/opt/rapidast/results:z,U \
            -v ${{ runner.temp }}/gcs-key.json:/opt/rapidast/gcs-key.json:z,ro \
            quay.io/redhatproductsecurity/rapidast:latest \
            --config /opt/rapidast/config/config.yaml

      - name: Upload DAST results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: backend-dast-results
          path: backend/dast/results/
          retention-days: 30

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Compose logs ==="
          uvx podman-compose -f ../podman-compose.yml -p syntara-ci logs database redis temporal syntara
        working-directory: backend

      - name: Cleanup
        if: always()
        run: |
          uvx podman-compose -f ../podman-compose.yml -p syntara-ci down -v || true
        working-directory: backend
