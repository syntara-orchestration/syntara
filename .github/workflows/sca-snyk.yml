---
name: SCA - Snyk Dependencies

on:
  schedule:
    - cron: '23 14 * * *'
  push:
    branches:
      - 'devel'
      - 'early-access'
    paths:
      - 'backend/pyproject.toml'
      - 'backend/requirements*.txt'
      - 'backend/src/*/pyproject.toml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/packages/*/package.json'
      - '.github/workflows/sca-snyk.yml'
  workflow_dispatch:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  changes:
    name: Snyk SCA (Identify changes)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/pyproject.toml'
              - 'backend/requirements*.txt'
              - 'backend/src/*/pyproject.toml'
              - '.github/workflows/sca-snyk.yml'
            frontend:
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/packages/*/package.json'
              - '.github/workflows/sca-snyk.yml'

  snyk-sca-backend:
    name: Snyk SCA (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || (github.event.pull_request == null && github.event.merge_group == null)
    steps:
      # Checkout code to scan
      - name: Checkout code to scan
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: scan

      - name: Set up Python for scan
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

      - name: Install scan dependencies
        working-directory: scan/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan dependencies
        working-directory: scan/backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rc=0
          snyk test \
            --json-file-output=../../snyk-scan-backend.json \
            --project-name="${{ github.repository }}/python" \
            --file=requirements.txt \
            --package-manager=pip || rc=$?
          # Exit 0=clean, 1=vulnerabilities found (both valid). Exit 2+=scan failure — abort.
          if [[ $rc -gt 1 ]]; then echo "Snyk scan failed (exit $rc)"; exit 1; fi

      - name: Checkout base branch
        # Only scan base branch for pull requests and merge queue (not for push/schedule)
        if: github.event.pull_request != null || github.event.merge_group != null
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          path: base

      - name: Install base dependencies
        if: github.event.pull_request != null || github.event.merge_group != null
        working-directory: base/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan base branch dependencies
        if: github.event.pull_request != null || github.event.merge_group != null
        working-directory: base/backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rc=0
          snyk test \
            --json-file-output=../../snyk-base-backend.json \
            --project-name="${{ github.repository }}/python" \
            --file=requirements.txt \
            --package-manager=pip || rc=$?
          # Exit 0=clean, 1=vulnerabilities found (both valid). Exit 2+=scan failure — abort.
          if [[ $rc -gt 1 ]]; then echo "Snyk scan failed (exit $rc)"; exit 1; fi

      - name: Compare and filter vulnerabilities
        # Compare results and fail only on NEW HIGH/CRITICAL vulnerabilities
        if: github.event.pull_request != null || github.event.merge_group != null
        run: |
          # Compare Snyk SCA results between base and scan branches
          # Fail only on NEW HIGH/CRITICAL vulnerabilities introduced by the PR
          # NOTE: Inlined to prevent malicious PRs from modifying comparison logic
          set -euo pipefail

          BASE_JSON="snyk-base-backend.json"
          SCAN_JSON="snyk-scan-backend.json"

          # Extract vulnerability IDs from base branch
          if [[ -f "$BASE_JSON" ]]; then
            BASE_VULNS=$(jq -r '.vulnerabilities[]?.id // empty' "$BASE_JSON" | sort -u)
          else
            BASE_VULNS=""
          fi

          # Extract HIGH/CRITICAL vulnerability IDs from scanned code
          if [[ -f "$SCAN_JSON" ]]; then
            SCAN_HIGH_CRIT=$(jq -r '.vulnerabilities[]? | select(.severity == "high" or .severity == "critical") | .id' "$SCAN_JSON" | sort -u)
          else
            SCAN_HIGH_CRIT=""
          fi

          # Find NEW vulnerabilities (in scan but not in base)
          NEW_VULNS=$(comm -13 <(echo "$BASE_VULNS") <(echo "$SCAN_HIGH_CRIT"))

          if [[ -n "$NEW_VULNS" ]]; then
            echo "❌ NEW HIGH/CRITICAL vulnerabilities introduced by this PR:"
            echo ""
            for vuln_id in $NEW_VULNS; do
              jq -r --arg id "$vuln_id" \
                '.vulnerabilities[] | select(.id == $id) |
                "  - \(.packageName)@\(.version): \(.title)\n    Severity: \(.severity | ascii_upcase)\n    Fix: \(.upgradePath // ["No fix available"] | join(" -> "))\n"' \
                "$SCAN_JSON"
            done
            echo ""
            echo "These vulnerabilities were introduced by changes in this PR."
            echo "Please update the affected dependencies or document why the risk is acceptable."
            exit 1
          else
            echo "✅ No new HIGH/CRITICAL vulnerabilities introduced by this PR"
            if [[ -n "$BASE_VULNS" ]]; then
              echo ""
              echo "ℹ️  Note: Base branch has existing vulnerabilities (not blocking this PR)"
            fi
          fi

      - name: Block on any HIGH/CRITICAL (non-PR events)
        # For push/schedule events, use traditional blocking behavior
        if: github.event.pull_request == null && github.event.merge_group == null
        working-directory: scan/backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --severity-threshold=high \
            --project-name="${{ github.repository }}/python" \
            --file=requirements.txt \
            --package-manager=pip \
            --sarif-file-output=snyk-python.sarif \
            --json-file-output=snyk-python.json

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        if: always() && hashFiles('scan/backend/snyk-python.sarif') != ''
        # continue-on-error: GitHub Advanced Security (required for SARIF upload)
        # is only available for public repos or paid Enterprise plan.
        # This allows the workflow to succeed even when Advanced Security is unavailable,
        # while still uploading SARIF if the feature becomes available later.
        continue-on-error: true
        with:
          sarif_file: scan/backend/snyk-python.sarif
          category: snyk-sca-python

      - name: Upload Snyk JSON report as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (hashFiles('snyk-scan-backend.json') != '' || hashFiles('snyk-base-backend.json') != '' || hashFiles('scan/backend/snyk-python.json') != '')
        with:
          name: snyk-python-report
          path: |
            snyk-scan-backend.json
            snyk-base-backend.json
            scan/backend/snyk-python.json
          retention-days: 90

  snyk-sca-frontend:
    name: Snyk SCA (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || (github.event.pull_request == null && github.event.merge_group == null)
    steps:
      # Checkout code to scan
      - name: Checkout code to scan
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: scan

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

      - name: Install scan dependencies
        working-directory: scan/frontend
        run: npm ci

      - name: Scan dependencies
        working-directory: scan/frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rc=0
          snyk test \
            --json-file-output=../../snyk-scan-frontend.json \
            --project-name="${{ github.repository }}/frontend" \
            --file=package.json || rc=$?
          # Exit 0=clean, 1=vulnerabilities found (both valid). Exit 2+=scan failure — abort.
          if [[ $rc -gt 1 ]]; then echo "Snyk scan failed (exit $rc)"; exit 1; fi

      - name: Checkout base branch
        # Only scan base branch for pull requests and merge queue (not for push/schedule)
        if: github.event.pull_request != null || github.event.merge_group != null
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          path: base

      - name: Install base dependencies
        if: github.event.pull_request != null || github.event.merge_group != null
        working-directory: base/frontend
        run: npm ci

      - name: Scan base branch dependencies
        if: github.event.pull_request != null || github.event.merge_group != null
        working-directory: base/frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rc=0
          snyk test \
            --json-file-output=../../snyk-base-frontend.json \
            --project-name="${{ github.repository }}/frontend" \
            --file=package.json || rc=$?
          if [[ $rc -gt 1 ]]; then echo "Snyk scan failed (exit $rc)"; exit 1; fi

      - name: Compare and filter vulnerabilities
        # Compare results and fail only on NEW HIGH/CRITICAL vulnerabilities
        if: github.event.pull_request != null || github.event.merge_group != null
        run: |
          # Compare Snyk SCA results between base and scan branches
          # Fail only on NEW HIGH/CRITICAL vulnerabilities introduced by the PR
          # NOTE: Inlined to prevent malicious PRs from modifying comparison logic
          set -euo pipefail

          BASE_JSON="snyk-base-frontend.json"
          SCAN_JSON="snyk-scan-frontend.json"

          # Extract vulnerability IDs from base branch
          if [[ -f "$BASE_JSON" ]]; then
            BASE_VULNS=$(jq -r '.vulnerabilities[]?.id // empty' "$BASE_JSON" | sort -u)
          else
            BASE_VULNS=""
          fi

          # Extract HIGH/CRITICAL vulnerability IDs from scanned code
          if [[ -f "$SCAN_JSON" ]]; then
            SCAN_HIGH_CRIT=$(jq -r '.vulnerabilities[]? | select(.severity == "high" or .severity == "critical") | .id' "$SCAN_JSON" | sort -u)
          else
            SCAN_HIGH_CRIT=""
          fi

          # Find NEW vulnerabilities (in scan but not in base)
          NEW_VULNS=$(comm -13 <(echo "$BASE_VULNS") <(echo "$SCAN_HIGH_CRIT"))

          if [[ -n "$NEW_VULNS" ]]; then
            echo "❌ NEW HIGH/CRITICAL vulnerabilities introduced by this PR:"
            echo ""
            for vuln_id in $NEW_VULNS; do
              jq -r --arg id "$vuln_id" \
                '.vulnerabilities[] | select(.id == $id) |
                "  - \(.packageName)@\(.version): \(.title)\n    Severity: \(.severity | ascii_upcase)\n    Fix: \(.upgradePath // ["No fix available"] | join(" -> "))\n"' \
                "$SCAN_JSON"
            done
            echo ""
            echo "These vulnerabilities were introduced by changes in this PR."
            echo "Please update the affected dependencies or document why the risk is acceptable."
            exit 1
          else
            echo "✅ No new HIGH/CRITICAL vulnerabilities introduced by this PR"
            if [[ -n "$BASE_VULNS" ]]; then
              echo ""
              echo "ℹ️  Note: Base branch has existing vulnerabilities (not blocking this PR)"
            fi
          fi

      - name: Block on any HIGH/CRITICAL (non-PR events)
        # For push/schedule events, use traditional blocking behavior
        if: github.event.pull_request == null && github.event.merge_group == null
        working-directory: scan/frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --severity-threshold=high \
            --project-name="${{ github.repository }}/frontend" \
            --file=package.json \
            --sarif-file-output=snyk-npm.sarif \
            --json-file-output=snyk-npm.json

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        if: always() && hashFiles('scan/frontend/snyk-npm.sarif') != ''
        # continue-on-error: GitHub Advanced Security (required for SARIF upload)
        # is only available for public repos or paid Enterprise plan.
        # This allows the workflow to succeed even when Advanced Security is unavailable,
        # while still uploading SARIF if the feature becomes available later.
        continue-on-error: true
        with:
          sarif_file: scan/frontend/snyk-npm.sarif
          category: snyk-sca-npm

      - name: Upload Snyk JSON report as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (hashFiles('snyk-scan-frontend.json') != '' || hashFiles('snyk-base-frontend.json') != '' || hashFiles('scan/frontend/snyk-npm.json') != '')
        with:
          name: snyk-npm-report
          path: |
            snyk-scan-frontend.json
            snyk-base-frontend.json
            scan/frontend/snyk-npm.json
          retention-days: 90
