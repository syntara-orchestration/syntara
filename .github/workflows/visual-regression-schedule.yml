---
name: Visual Regression (Weekly Baseline Refresh)

# Runs once a week against `devel` HEAD, regenerates every screenshot, and
# opens a PR containing only the baselines that actually changed. The UI/UX
# team reviews the week's visual drift via GitHub's native image diff (Files
# changed tab), files issues for anything that looks wrong, and merges to
# accept the rest as the new baseline. This is deliberately decoupled from
# individual PRs — see frontend/packages/syntara-ui/VISUAL_REGRESSION.md for
# the full system (there is no per-PR VR check; this cron and the on-demand
# /update-screenshots command are the only two ways VR runs).
#
# Can also be run on demand via workflow_dispatch (Actions tab, or
# `gh workflow run visual-regression-schedule.yml --ref devel`) — useful to
# force an out-of-band refresh without waiting for Monday.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 12:00 UTC. GitHub Actions cron is UTC-only and has no DST
    # awareness, so this lands at 8:00 AM Eastern during EDT (summer) and
    # 7:00 AM during EST (winter) — a one-hour drift twice a year that isn't
    # worth a second conditional cron entry for a once-a-week job.
    - cron: '0 12 * * 1'

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '22.13.0'
  BASELINE_REFRESH_BRANCH: visual-regression/weekly-refresh

jobs:
  refresh-baselines:
    name: Weekly Visual Regression Baseline Refresh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: devel
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend/packages/syntara-ui

      - name: Check visual baseline coverage
        id: baselines
        run: npm exec tsx -- scripts/check-visual-baselines.ts
        working-directory: frontend/packages/syntara-ui
        continue-on-error: true

      # --update-snapshots=all rewrites every screenshot it captures (the bare
      # --update-snapshots flag defaults to "changed", which skips rewrites when
      # the masked diff stays under maxDiffPixelRatio — e.g. small nav logos).
      # "Failure" here means a real error (locator timeout, page crash), not
      # visual drift. Drift is detected afterward by diffing the rewritten
      # files against what's checked in.
      - name: Regenerate screenshots
        id: screenshots
        run: npx playwright test e2e/visual-regression/page-screenshots.spec.ts --update-snapshots=all --workers=1
        working-directory: frontend/packages/syntara-ui
        continue-on-error: true

      - name: Upload Playwright results on failure
        if: steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-weekly-results
          path: |
            frontend/packages/syntara-ui/test-results/
            frontend/packages/syntara-ui/playwright-report/
          retention-days: 30

      # With --update-snapshots=all, Playwright rewrites every PNG it captures.
      # Filter drops AA/byte-noise under the hybrid keep rule so git only sees
      # meaningful diffs (validated on PR #213). Same filter is used by
      # update-visual-baselines.yml for /update-screenshots.
      # Run on success OR failure: screenshots uses continue-on-error, so a
      # mid-suite failure can still leave rewritten PNGs that Detect would
      # otherwise stage unfiltered. No continue-on-error: a filter crash must
      # fail the job rather than Detect staging unfiltered noise.
      - name: Filter noisy baseline diffs
        id: filter-noise
        if: always() && steps.screenshots.outcome != 'skipped'
        working-directory: frontend/packages/syntara-ui
        run: npm exec tsx -- scripts/filter-noisy-baseline-diffs.ts

      - name: Detect changed baselines
        id: detect
        working-directory: frontend/packages/syntara-ui
        run: |
          git add e2e/visual-regression/page-screenshots.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            ADDED=$(git diff --cached --diff-filter=A --name-only --relative | wc -l | tr -d ' ')
            MODIFIED=$(git diff --cached --diff-filter=M --name-only --relative | wc -l | tr -d ' ')
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "added=${ADDED}" >> "$GITHUB_OUTPUT"
            echo "modified=${MODIFIED}" >> "$GITHUB_OUTPUT"
          fi
          # create-pull-request stages its own changes from the working tree.
          git reset

      - name: Open baseline refresh PR
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: devel
          branch: ${{ env.BASELINE_REFRESH_BRANCH }}
          delete-branch: true
          add-paths: frontend/packages/syntara-ui/e2e/visual-regression/page-screenshots.spec.ts-snapshots/**
          commit-message: >-
            chore: weekly visual regression baseline refresh
            (${{ steps.detect.outputs.added }} new, ${{ steps.detect.outputs.modified }} changed)
          title: >-
            Visual regression: weekly baseline refresh
            (${{ steps.detect.outputs.added }} new, ${{ steps.detect.outputs.modified }} changed)
          team-reviewers: uxd-team
          body: |
            Weekly scheduled run against `devel` regenerated every screenshot in `page-registry.ts`. **${{ steps.detect.outputs.added }}** are new, **${{ steps.detect.outputs.modified }}** changed since last Monday's run.

            ### How to review
            1. Open the **Files changed** tab — GitHub renders a diff view for each changed PNG (swipe/onion-skin/difference).
            2. If something looks like an unintended regression, file a follow-up issue. You can drop that file from this PR (its current baseline stays authoritative until fixed) or leave it in if a fix will land before next Monday.
            3. Merging this PR accepts every remaining image as the new baseline — used by the on-demand `/update-screenshots` flow (there is no per-PR VR check; see `VISUAL_REGRESSION.md`).

            This branch is reused week to week: if last Monday's PR is still open, this run updated it in place with the latest diff instead of opening a duplicate.

            _Opened automatically by the weekly Visual Regression workflow. No application code is included — baseline PNGs only._

      - name: Write summary
        if: always()
        run: |
          if [[ "${{ steps.filter-noise.outcome }}" == "failure" ]]; then
            echo "### :x: Visual Regression — baseline noise filter failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Screenshot PNGs were rewritten but the keep/restore filter crashed. No weekly PR was opened. See the Filter noisy baseline diffs step log." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.screenshots.outcome }}" == "failure" ]]; then
            echo "### :x: Visual Regression — screenshot generation had errors" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the \`visual-regression-weekly-results\` artifact — this means a real test error (timeout, crash), not a pixel diff." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.baselines.outcome }}" == "failure" ]]; then
            echo "### :warning: Baseline coverage check failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing baselines or uncovered routes detected. See the step log above for details." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.detect.outputs.has_changes }}" == "true" ]]; then
            echo "### :camera: Visual Regression — ${{ steps.detect.outputs.added }} new, ${{ steps.detect.outputs.modified }} changed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Opened/updated the [weekly baseline refresh PR](${{ github.server_url }}/${{ github.repository }}/pulls?q=head%3A${{ env.BASELINE_REFRESH_BRANCH }})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :white_check_mark: Visual Regression — no drift this week" >> "$GITHUB_STEP_SUMMARY"
          fi

      # `continue-on-error: true` on "Regenerate screenshots" exists so later
      # steps (baseline diff, PR open, summary) still run after a real test
      # error, giving a diagnosable artifact instead of an early abort. But
      # that also means nothing above this point fails the job on its own —
      # a broken weekly run would otherwise show green indefinitely, quietly
      # breaking the "worst case is one week of staleness" guarantee this
      # cron exists to provide. Fail explicitly here instead.
      - name: Fail job if screenshot generation or noise filter had errors
        if: steps.screenshots.outcome == 'failure' || steps.filter-noise.outcome == 'failure'
        run: |
          echo "::error::Screenshot generation or baseline noise filter failed — see the job summary above"
          exit 1
