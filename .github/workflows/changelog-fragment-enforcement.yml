---
# Walk phase: new capability — changelog fragment enforcement.
# Consumes reusable workflow from ansible/actions.
name: "OpenAPI: Changelog Fragment Enforcement"

on:
  pull_request:
    branches: [devel, early-access]
    paths:
      - 'backend/src/syntara/schemas/openapi.yaml'
      - 'changelogs/fragments/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    uses: ansible/actions/.github/workflows/openapi-changelog-fragment.yml@main
    with:
      spec-paths: "backend/src/syntara/schemas/openapi.yaml"
      fragment-dir: "changelogs/fragments"
