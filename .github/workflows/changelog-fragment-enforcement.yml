---
# Walk phase: new capability — changelog fragment enforcement.
# Consumes reusable workflow from ansible/actions (PR #167).
name: "OpenAPI: Changelog Fragment Enforcement"

on:
  pull_request:
    branches: [devel, early-access]
    paths:
      - 'backend/src/syntara/schemas/openapi.yaml'
      - 'changelogs/fragments/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    # TODO: move to ansible/actions@<release-tag> after PR #167 merges
    uses: djyasin/actions/.github/workflows/openapi-changelog-fragment.yml@6074497c42b7ef9e201df229dc071b9f4503ab4a # PR #167, feat/changelog-fragment-enforcement branch
    with:
      spec-paths: "backend/src/syntara/schemas/openapi.yaml"
      fragment-dir: "changelogs/fragments"
