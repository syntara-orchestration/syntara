---
name: CI Frontend

on:
  pull_request:
    branches: [devel, early-access]
  merge_group:
    branches: [devel, early-access]
  push:
    branches: [devel, early-access]

permissions:
  contents: read # checkout code
  pull-requests: read # gh api needs PR file list
  statuses: read # read E2E commit status

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

# Scoped to this file only — other workflows pin their own.
env:
  NODE_VERSION: '22.13.0'

jobs:
  changes:
    name: (Frontend) Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
      backend: ${{ steps.check.outputs.backend }}
      contracts: ${{ steps.check.outputs.contracts }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No PR number (merge_group context), running all CI as fallback"
            { echo "code=true"; echo "backend=true"; echo "contracts=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/files --paginate --jq '.[].filename')
          if [ -z "$FILES" ]; then
            echo "::warning::No files from API, running all CI as fallback"
            { echo "code=true"; echo "backend=true"; echo "contracts=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qvE '(\.md$|^LICENSE$)' <<< "$FILES"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^backend/' <<< "$FILES"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^backend/src/syntara/schemas/' <<< "$FILES"; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  gen-contracts:
    name: (Frontend) Generate Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Generate TypeScript contracts from OpenAPI specs
        run: npm run gen:ts
        working-directory: frontend/packages/syntara-contracts

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code -- frontend/packages/syntara-contracts/src/ 2>/dev/null; then
            echo "::error::Generated contracts have uncommitted changes. Run 'make gen-contracts' locally and commit the changes."
            exit 1
          fi

  checks:
    name: (Frontend) Checks
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Static analysis
        run: npm run check
        working-directory: frontend

  unit-tests:
    name: (Frontend) Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Run unit test shard with coverage
        id: unit-test-shard
        run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/4
        working-directory: frontend/packages/syntara-ui
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITEST_COVERAGE_DIR: coverage/shard-${{ matrix.shard }}

      - name: Upload shard coverage artifact
        if: steps.unit-test-shard.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-unit-test-coverage-${{ matrix.shard }}
          path: frontend/packages/syntara-ui/coverage/shard-${{ matrix.shard }}/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    name: (Frontend) Coverage Report
    needs: [changes, unit-tests]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: frontend-unit-test-coverage-*
          path: frontend/packages/syntara-ui/coverage-artifacts

      - name: Merge shard coverage reports
        run: npm run test:coverage:merge
        working-directory: frontend/packages/syntara-ui

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/syntara-ui/coverage
          if-no-files-found: error
          retention-days: 7

      # Pass the PR number as an artifact so the workflow_run-based SonarCloud
      # fallback (for fork PRs) can identify and tag the analysis correctly.
      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo "PR ${{ github.event.pull_request.number }}" > pr_number.txt

      - name: Upload PR number artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-pr_number
          path: pr_number.txt
          retention-days: 7

  sonarcloud:
    name: (Frontend) SonarCloud Analysis
    needs: [changes, coverage-report]
    if: >-
      needs.changes.outputs.code == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/syntara-ui/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}

  sonarcloud-baseline:
    name: (Frontend) SonarCloud Baseline
    needs: [changes, coverage-report]
    if: >-
      needs.changes.outputs.code == 'true'
      && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/syntara-ui/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}

  storybook-build:
    name: (Frontend) Storybook Build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Build Storybook
        run: npm run storybook:build
        working-directory: frontend/packages/syntara-ui

  test-build:
    name: (Frontend) Test Container Build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Test build syntara-ui image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend/
          file: frontend/packages/syntara-ui/Containerfile
          platforms: linux/amd64
          push: false
          tags: syntara-ui:test

      - name: Test build syntara-mock-api image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend/
          file: frontend/packages/syntara-mock-api/Containerfile
          platforms: linux/amd64
          push: false
          tags: syntara-mock-api:test

  shared-checks-gate:
    name: (Frontend) Shared Checks Gate
    if: github.event_name != 'push'
    permissions:
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for shared checks
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const timeout = 15 * 60 * 1000;
            const interval = 30 * 1000;
            const start = Date.now();
            const required = ['Pre-commit'];

            while (Date.now() - start < timeout) {
              const results = [];
              for (const checkName of required) {
                const { data } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  check_name: checkName,
                  per_page: 1,
                });
                results.push({ name: checkName, run: data.check_runs[0] });
              }

              const failed = results.find(r =>
                r.run?.status === 'completed' &&
                !['success', 'neutral'].includes(r.run.conclusion)
              );
              if (failed) {
                core.setFailed(`${failed.name} failed (${failed.run.conclusion}): ${failed.run.html_url}`);
                return;
              }

              const allPassed = results.every(r =>
                r.run?.status === 'completed' &&
                ['success', 'neutral'].includes(r.run.conclusion)
              );
              if (allPassed) {
                console.log(`All shared checks passed: ${required.join(', ')}`);
                return;
              }

              const elapsed = Math.round((Date.now() - start) / 1000);
              const summary = results.map(r => {
                if (!r.run) return `${r.name}: not started`;
                return `${r.name}: ${r.run.status}`;
              }).join(', ');
              console.log(`${summary} (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }
            core.setFailed(`Timed out waiting for shared checks: ${required.join(', ')}`);

  test-compose-e2e:
    name: (Frontend) Test Podman Compose E2E
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/packages/syntara-ui/package.json') }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install backend dependencies
        run: make install
        working-directory: backend

      - name: Generate secrets
        run: make secrets-generate
        working-directory: backend

      - name: Generate TLS certificates
        run: make certs-generate
        working-directory: backend

      - name: Log in to registry.redhat.io
        env:
          RH_REGISTRY_TOKEN: ${{ secrets.RH_REGISTRY_TOKEN }}
          RH_REGISTRY_USER: ${{ secrets.RH_REGISTRY_USER }}
        run: echo "$RH_REGISTRY_TOKEN" | podman login registry.redhat.io -u "$RH_REGISTRY_USER" --password-stdin

      - name: Start services with podman-compose
        timeout-minutes: 20
        env:
          APP_SEGMENT_WRITE_KEY: test-e2e-write-key
          APP_SEGMENT_ENDPOINT: http://mock-segment:9999
          APP_COLLECTION_INTERVAL_SECONDS: "10"
        run: |
          ulimit -n 65535
          export PODMAN_BUILD_ARGS="--ulimit nofile=65535:65535"
          uvx podman-compose -p nexus-ci --profile telemetry-e2e up --build -d \
            database temporal syntara temporal-worker temporal-background-worker mcp-server mock-segment syntara-ui

      - name: Wait for backend services to be healthy
        timeout-minutes: 5
        run: |
          podman wait --condition=healthy \
            nexus-ci_database_1 \
            nexus-ci_temporal_1 \
            nexus-ci_syntara_1 \
            nexus-ci_temporal-background-worker_1 \
            nexus-ci_mcp-server_1 \
            nexus-ci_mock-segment_1
          echo "All backend services are healthy"

      - name: Wait for syntara-ui to be reachable
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080 > /dev/null 2>&1 && echo "UI is reachable" && exit 0
            sleep 3
          done
          echo "::error::syntara-ui did not become reachable after 3 minutes"
          exit 1

      - name: Initialize admin password
        working-directory: backend
        run: |
          cat .secrets/admin-password | podman exec -i nexus-ci_syntara_1 \
            python3 -m syntara.orchestrator_admin reset-password -u admin --password-stdin --yes

      - name: Read admin password
        run: |
          password=$(cat backend/.secrets/admin-password)
          echo "::add-mask::$password"
          echo "NEXUS_E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install npm dependencies and Playwright browsers
        run: |
          npm ci --prefix frontend
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            (cd frontend/packages/syntara-ui && npx playwright install-deps chromium)
          else
            (cd frontend/packages/syntara-ui && npx playwright install --with-deps chromium)
          fi

      - name: Run E2E tests
        working-directory: frontend/packages/syntara-ui
        run: npm run e2e -- --timeout 120000
        env:
          NEXUS_E2E_SKIP_WEB_SERVER: '1'
          NEXUS_E2E_BASE_URL: http://localhost:8080
          NEXUS_E2E_PASSWORD: ${{ env.NEXUS_E2E_PASSWORD }}
          CURRENTS_PROJECT_ID: ${{ secrets.CURRENTS_PROJECT_ID }}
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-compose
          path: frontend/packages/syntara-ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-compose-results
          path: frontend/packages/syntara-ui/test-results/results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: |
          uvx podman-compose -p nexus-ci --profile telemetry-e2e logs \
            database temporal syntara temporal-worker temporal-background-worker mcp-server mock-segment syntara-ui

      - name: Cleanup
        if: always()
        run: |
          uvx podman-compose -p nexus-ci --profile telemetry-e2e down -v || true

  konflux-frontend-gate:
    name: (Frontend) Konflux Gate
    # Tekton PAC only fires on pull_request events (not merge_group or push).
    if: github.event_name == 'pull_request'
    permissions:
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for Konflux conforma check
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const timeout = 85 * 60 * 1000;
            const startupWindow = 15 * 60 * 1000;
            const interval = 30 * 1000;
            const start = Date.now();
            const pipelineCheckName = 'Konflux kflux-prd-rh03 / ansible-automation-orchestrator-ui-devel-on-pull-request';
            const conformaCheckName = 'Red Hat Konflux / conforma-on-pull-request-devel / ansible-automation-orchestrator-ui-devel';

            // Phase 1: wait up to 15 minutes for the parent pipeline check to appear.
            // If it never appears the Tekton CEL did not match (no frontend/ changes) — skip.
            console.log('Waiting for Konflux pipeline to start...');
            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: pipelineCheckName,
                per_page: 1,
              });
              if (data.check_runs.length > 0) {
                console.log('Konflux pipeline started — waiting for conforma check...');
                break;
              }
              const elapsed = Math.round((Date.now() - start) / 1000);
              if (Date.now() - start > startupWindow) {
                console.log(`Konflux pipeline never appeared after 15 minutes — Tekton CEL did not match, skipping`);
                return;
              }
              console.log(`Waiting for pipeline to start... (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }

            // Phase 2: pipeline fired — wait for conforma to pass, bailing early if
            // the parent pipeline itself fails before conforma runs (e.g. build error).
            while (Date.now() - start < timeout) {
              const { data: parentData } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: pipelineCheckName,
                per_page: 1,
              });
              const parentRun = parentData.check_runs[0];
              if (parentRun?.status === 'completed' && !['success', 'neutral'].includes(parentRun.conclusion)) {
                core.setFailed(`Konflux pipeline failed (${parentRun.conclusion}) before conforma ran: ${parentRun.html_url}`);
                return;
              }

              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: conformaCheckName,
                per_page: 100,
              });

              const runs = data.check_runs;
              const completed = runs.filter(r => r.status === 'completed');
              const succeeded = completed.filter(r => ['success', 'neutral'].includes(r.conclusion));
              const failed = completed.filter(r => !['success', 'neutral', 'cancelled', 'skipped'].includes(r.conclusion));

              if (failed.length > 0) {
                core.setFailed(`${conformaCheckName} failed (${failed[0].conclusion}): ${failed[0].html_url}`);
                return;
              }
              if (succeeded.length > 0) {
                const r = succeeded[0];
                const suffix = r.conclusion === 'neutral' ? ' (with warnings)' : '';
                console.log(`${conformaCheckName} passed${suffix}: ${r.html_url}`);
                return;
              }

              const elapsed = Math.round((Date.now() - start) / 1000);
              const state = runs.length === 0 ? 'not started yet' : runs[runs.length - 1].status;
              console.log(`${conformaCheckName}: ${state} (${elapsed}s elapsed)`);
              await new Promise(r => setTimeout(r, interval));
            }
            core.setFailed(`Timed out after 85 minutes waiting for: ${conformaCheckName}`);

  # Single required status check for branch protection. All merge-blocking jobs
  # are listed in `needs` so we manage requirements in code instead of maintaining
  # a separate list in GitHub rulesets that can drift out of sync with the workflow.
  #
  # For doc-only PRs the `changes` job sets code=false, all CI jobs are skipped,
  # and this gate passes because `skipped` is accepted alongside `success`.
  required-checks:
    name: (Frontend) Required Checks
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - changes
      - gen-contracts
      - checks
      - unit-tests
      - coverage-report
      - storybook-build
      - test-build
      - konflux-frontend-gate
      - shared-checks-gate
      - test-compose-e2e
    steps:
      - name: Check required jobs passed
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::Detect Changes job did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi

          ok="success|skipped"
          for job in gen-contracts checks unit-tests coverage-report storybook-build test-build test-compose-e2e konflux-frontend-gate shared-checks-gate; do
            case "$job" in
              gen-contracts)          result="${{ needs.gen-contracts.result }}" ;;
              checks)                 result="${{ needs.checks.result }}" ;;
              unit-tests)             result="${{ needs.unit-tests.result }}" ;;
              coverage-report)        result="${{ needs.coverage-report.result }}" ;;
              storybook-build)        result="${{ needs.storybook-build.result }}" ;;
              test-build)             result="${{ needs.test-build.result }}" ;;
              test-compose-e2e)       result="${{ needs.test-compose-e2e.result }}" ;;
              konflux-frontend-gate)  result="${{ needs.konflux-frontend-gate.result }}" ;;
              shared-checks-gate)     result="${{ needs.shared-checks-gate.result }}" ;;
            esac
            echo "$job: $result"
            if [[ ! "$result" =~ ^($ok)$ ]]; then
              echo "::error::Required job '$job' has result '$result'"
              exit 1
            fi
          done
          echo "All required checks passed (or skipped for doc-only PRs)"
