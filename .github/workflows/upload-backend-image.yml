---
# Triggered when Build Backend Container Image (push/tag) or Build Backend
# Container Image (PR Comment) completes successfully.
# Actor membership check prevents external fork PRs from accessing registry
# credentials.
# For PR comment builds: pushes only the pr-[number] tag (overwritten on each run).
# For pushes to devel/tags: pushes all tags from the build artifact.
name: Upload Backend Container Image

on:
  workflow_run:
    workflows: ["Build Backend Container Image", "Build Backend Container Image (PR Comment)"]
    types: [completed]

jobs:
  upload:
    runs-on: ubuntu-latest
    if: >
      github.repository == 'syntara-orchestration/syntara' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.owner.login == github.repository_owner
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-syntara-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Load and push image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: |
          mapfile -t ALL_TAGS < syntara-image-tag.txt

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # For PRs: only push the pr-[number] tag, overwriting on each update
            for tag in "${ALL_TAGS[@]}"; do
              if [[ "$tag" == *:pr-* ]]; then
                # buildkit stores only the tag portion in the OCI archive index
                # e.g. quay.io/ansible/syntara:devel -> devel
                local_ref="${tag##*:}"
                skopeo copy --all "oci-archive:syntara-image.tar:${local_ref}" docker://"$tag"
              fi
            done
          else
            # For devel branch pushes and tags: push all tags
            for tag in "${ALL_TAGS[@]}"; do
              # buildkit stores only the tag portion in the OCI archive index
              # e.g. quay.io/ansible/syntara:devel -> devel
              local_ref="${tag##*:}"
              skopeo copy --all "oci-archive:syntara-image.tar:${local_ref}" docker://"$tag"
            done
          fi
