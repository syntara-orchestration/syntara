---
name: Merge Queue Health Poll

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  queue-health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      SLACK_CI_MONITORING_WEBHOOK_URL: ${{ secrets.SLACK_CI_MONITORING_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: env.SLACK_CI_MONITORING_WEBHOOK_URL != ''
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: env.SLACK_CI_MONITORING_WEBHOOK_URL != ''
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        if: env.SLACK_CI_MONITORING_WEBHOOK_URL != ''
        run: npm ci
        working-directory: .github/scripts

      - name: Check queue health and notify
        if: env.SLACK_CI_MONITORING_WEBHOOK_URL != ''
        run: npm run check-queue-health
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      # Marker steps so the next run can infer steady-state health when no alert fired
      - name: Health is unhealthy
        if: steps.health.outputs.health == 'unhealthy'
        run: echo "Recorded unhealthy state for next run"

      - name: Health is healthy
        if: steps.health.outputs.health == 'healthy'
        run: echo "Recorded healthy state for next run"

      - name: Send unhealthy alert
        if: steps.health.outputs.alert == 'unhealthy'
        run: npm run send-unhealthy-alert
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_CI_MONITORING_WEBHOOK_URL: ${{ secrets.SLACK_CI_MONITORING_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          QUEUE_DEPTH: ${{ steps.health.outputs.queue_depth }}
          MINUTES_SINCE_MERGE: ${{ steps.health.outputs.minutes_since_merge }}
          TIMEOUT_MINUTES: ${{ steps.health.outputs.timeout_minutes }}
          QUEUE_URL: ${{ steps.health.outputs.queue_url }}

      - name: Send recovery alert
        if: steps.health.outputs.alert == 'recovery'
        run: npm run send-recovery-alert
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_CI_MONITORING_WEBHOOK_URL: ${{ secrets.SLACK_CI_MONITORING_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          QUEUE_URL: ${{ steps.health.outputs.queue_url }}
