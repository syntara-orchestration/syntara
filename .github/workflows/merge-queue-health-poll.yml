---
name: Merge Queue Health Poll

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  queue-health-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      SLACK_CI_MONITORING_WEBHOOK_URL: ${{ secrets.SLACK_CI_MONITORING_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.SLACK_CI_MONITORING_WEBHOOK_URL != ''
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: env.SLACK_CI_MONITORING_WEBHOOK_URL != ''
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        if: env.SLACK_CI_MONITORING_WEBHOOK_URL != ''
        run: npm ci
        working-directory: .github/scripts

      - name: Check queue health and notify
        if: env.SLACK_CI_MONITORING_WEBHOOK_URL != ''
        run: npm run notify:queue-health
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
