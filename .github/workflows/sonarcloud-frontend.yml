---
name: SonarCloud Analysis (Frontend)

# Fallback for fork PRs: runs in the base repo context (has access to secrets)
# after the CI Frontend workflow completes. Fork PRs cannot access repository
# secrets from pull_request workflows, so this workflow_run approach is needed.
# Non-fork PRs use the faster inline SonarCloud job in ci-frontend.yml instead.
#
# SECURITY: This workflow checks out fork code and has access to SONAR_TOKEN.
# It is safe because (1) this YAML is loaded from the default branch, not the
# fork, (2) all actions are pinned to commit SHAs, and (3) no repo scripts or
# user-controlled code is executed after checkout — only the pinned SonarCloud
# scan action. Do NOT add steps that run fork-controlled code (npm, make, etc.).
on:
  workflow_run:
    workflows:
      - CI Frontend
    types:
      - completed

permissions: read-all

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name != github.event.workflow_run.repository.full_name
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BRANCH="${{ github.event.workflow_run.head_branch }}"
          PR_NUMBER=$(gh api repos/${{ github.repository }}/pulls \
            --jq ".[] | select(.head.ref == \"${PR_BRANCH}\") | .number" \
            | head -1)
          if [[ -z "$PR_NUMBER" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER}/files --paginate --jq '.[].filename')
          if echo "$FILES" | grep -qvE '(\.md$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  sonarcloud:
    name: SonarCloud Analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # SonarCloud quality gate failures are informational, not blocking.
    # Without this, a failed gate marks the entire PR pipeline as failed.
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Fetch Code Coverage Report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-unit-test-coverage-report
          path: frontend/packages/syntara-ui/coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Fetch PR Number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-pr_number
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract PR Number
        run: |
          cat pr_number.txt
          echo $(head -n1 pr_number.txt | awk '{print $2}')
          echo "PR_NUMBER=$(head -n1 pr_number.txt | awk '{print $2}')" >> $GITHUB_ENV

      - name: Get Additional PR Information
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        id: pr_info
        with:
          route: GET /repos/{repo}/pulls/{number}
          repo: ${{ github.event.repository.full_name }}
          number: ${{ env.PR_NUMBER }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Additional PR Information
        run: |
          echo "PR_BASE=${{ fromJson(steps.pr_info.outputs.data).base.ref }}" >> $GITHUB_ENV
          echo "PR_HEAD=${{ fromJson(steps.pr_info.outputs.data).head.ref }}" >> $GITHUB_ENV

      - name: Checkout Code for PR
        run: |
          gh pr checkout ${{ env.PR_NUMBER }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.PR_HEAD }}
            -Dsonar.pullrequest.base=${{ env.PR_BASE }}
