---
name: Bug report
description: Report a bug to help us improve

body:
  - type: dropdown
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Backend (API / Python)
        - Frontend (UI / React)
        - Both
        - Unknown
    validations:
      required: true

  - type: textarea
    attributes:
      label: Summary
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Describe exactly how to reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected results
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual results
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs / error output
      description: Paste any relevant log output or error messages.
      render: console

  - type: textarea
    attributes:
      label: Environment
      description: >
        Any relevant environment details.
      placeholder: |
        OS: (e.g., RHEL 9, Fedora 44, Ubuntu 22.04, macOS 14)
        Browser: (e.g., Chrome 120, Firefox 121)
        Python version: (e.g., 3.12)
        Node version: (e.g., 22.x)
        Deployment method: (e.g., Podman, local dev)

  - type: checkboxes
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/syntara-orchestration/syntara/blob/devel/.github/CODE_OF_CONDUCT.md)
          required: true
