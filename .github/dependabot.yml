---
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/docs"
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 1
    labels:
      - "docs"
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
