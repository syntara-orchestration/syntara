---
name: Setup Test Environment
description: Common setup steps for test jobs (Python, uv, dependencies, secrets)

inputs:
  python-version:
    description: Python version to use
    required: true
  working-directory:
    description: Working directory for make commands (relative to repo root)
    required: false
    default: 'backend'
  postgres-image:
    description: >-
      PostgreSQL testcontainers image to pre-pull. Must match the POSTGRES_IMAGE
      default in backend/Makefile, which make exports at test runtime.
    required: false
    default: 'quay.io/sclorg/postgresql-15-c9s'
  redis-image:
    description: >-
      Redis testcontainers image to pre-pull. Must match the REDIS_IMAGE default
      in backend/Makefile, which make exports at test runtime.
    required: false
    default: 'mirror.gcr.io/library/redis:6'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Cache uv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory)) }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version }}-
          uv-${{ runner.os }}-

    - name: Install regopy build toolchain (aarch64)
      if: runner.arch == 'ARM64'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y cmake g++ git libssl-dev

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: make install

    - name: Generate secrets
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: make secrets-generate

    # Pre-pull the testcontainers images once, up front, with retry. Without this
    # each xdist worker (up to 8 for integration tests) pulls the image on demand
    # during the test run; concurrent pulls of the unpinned :latest tag amplify
    # transient quay.io 5xx errors into false-positive CI failures. A single
    # retried pull lands the image in the shared Docker daemon so testcontainers
    # reuses the local copy instead of pulling per worker.
    - name: Pre-pull test container images
      shell: bash
      env:
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        REDIS_IMAGE: ${{ inputs.redis-image }}
      run: |
        set -euo pipefail
        pull_with_retry() {
          local image="$1"
          local max_attempts=5
          local delay=5
          for attempt in $(seq 1 "$max_attempts"); do
            if docker pull "$image"; then
              echo "Pulled $image (attempt ${attempt}/${max_attempts})"
              return 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning::Failed to pull ${image} (attempt ${attempt}/${max_attempts}); retrying in ${delay}s"
              sleep "$delay"
              delay=$(( delay + 2 ))
            fi
          done
          echo "::error::Failed to pull ${image} after ${max_attempts} attempts"
          return 1
        }
        pull_with_retry "$POSTGRES_IMAGE"
        pull_with_retry "$REDIS_IMAGE"
